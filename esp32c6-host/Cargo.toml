[package]
name = "esp32c6-host"
version = "0.1.0"
edition = "2021"
publish = false
description = "ESP32-C6 Host adapter: drives the Personal Reticulum engine on bare metal."

# Standalone: its own workspace so the suite's host workspace never tries to
# build this no_std/no_main bare-metal crate for the host target.
[workspace]

[[bin]]
name = "esp32c6-host"
path = "src/main.rs"

[dependencies]
personal-rns = { path = "../personal-rns", default-features = false }

esp-hal = { version = "1.1", features = ["esp32c6", "unstable"] }
esp-backtrace = { version = "0.19", default-features = false, features = ["esp32c6", "panic-handler", "println"] }
esp-println = { version = "0.17", default-features = false, features = ["esp32c6", "jtag-serial", "log-04"] }
esp-bootloader-esp-idf = { version = "0.5", features = ["esp32c6"] }

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false
