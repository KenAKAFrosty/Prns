[package]
name = "prns-config"
version = "0.3.7"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KenAKAFrosty/Prns"
homepage = "https://reticulum.rs"
rust-version = "1.90"
description = "Config discovery, parsing, and reconciliation for the Personal Reticulum daemon"
documentation = "https://docs.rs/prns-config"
readme = "README.md"
keywords = ["reticulum", "mesh", "networking", "configuration"]
categories = ["config", "network-programming"]
publish = true
include = ["src/**", "tests/**", "!tests/**/__pycache__/**", "!tests/**/*.pyc", "examples/**", "Cargo.toml", "README.md"]

[workspace]

[dependencies]
prns-core = { version = "=0.3.7", path = "../prns-core", default-features = false, features = ["interface-discovery", "std"] }
home = "0.5.12"
shlex = "1"
tempfile = "3.27"

[dev-dependencies]
prns-core = { version = "=0.3.7", path = "../prns-core", default-features = false, features = ["interface-discovery-archive"] }
proptest = "1"
serde_json = "1"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"

[package.metadata.docs.rs]
all-features = true
