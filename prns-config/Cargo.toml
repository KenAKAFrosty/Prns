[package]
name = "prns-config"
version = "0.2.8"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KenAKAFrosty/Prns"
homepage = "https://reticulum.rs"
rust-version = "1.90"
description = "Config discovery, parsing, and reconciliation for the Personal Reticulum daemon"
publish = false

[workspace]

[dependencies]
prns-core = { path = "../prns-core", default-features = false, features = ["interface-discovery", "std"] }
home = "0.5.12"
shlex = "1"
tempfile = "3.27"

[dev-dependencies]
prns-core = { path = "../prns-core", default-features = false, features = ["interface-discovery-archive"] }
proptest = "1"
serde_json = "1"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
