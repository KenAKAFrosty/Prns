[package]
name = "nrf52840"
version = "0.1.0"
edition = "2021"
publish = false
description = "nRF52840 Dongle (PCA10059) host body: drives the Personal Reticulum engine on bare metal."

# Standalone: its own workspace so the suite's host workspace never tries to
# build this no_std/no_main bare-metal crate for the host target.
[workspace]

[[bin]]
name = "nrf52840"
path = "src/main.rs"

[dependencies]
personal-rns = { path = "../../personal-rns", default-features = false }

cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "1.0"

embassy-executor = { version = "0.6", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "integrated-timers"] }
embassy-time = { version = "0.3" }
embassy-nrf = { version = "0.2", features = ["nrf52840", "time-driver-rtc1", "gpiote"] }
embassy-usb = { version = "0.3" }
embassy-futures = "0.1"

static_cell = "2.1"
heapless = "0.8"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false
