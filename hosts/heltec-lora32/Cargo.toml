[package]
name = "heltec-lora32"
version = "0.1.0"
edition = "2021"
publish = false
description = "Heltec WiFi LoRa 32 (ESP32-S3 + SX1262 + OLED) host: drives the Personal Reticulum engine on bare metal."

# Standalone: its own workspace so the suite's host workspace never tries to
# build this no_std/no_main bare-metal crate for the host target. Mirrors the
# esp32-c6 host's layout. (Heltec board revision is recorded in src/main.rs once
# confirmed against the silkscreen.)
[workspace]

[dependencies]
personal-rns = { path = "../../personal-rns", default-features = false, features = ["embassy-host"] }
# The shared Hopspot screen renderer (the OLED draw code) — the same crate the
# Linux debug window uses, so both faces of the app render identical pixels.
personal-hopspot-ui = { path = "../../personal-hopspot/ui", default-features = false }

# Same esp-hal 1.1 stack the C6 host pins, retargeted to the S3 (Xtensa LX7,
# dual-core). Stage A is a pure sync poll loop — no embassy executor / time
# driver yet, so none of those deps appear here.
esp-hal = { version = "1.1", features = ["esp32s3", "unstable"] }
esp-backtrace = { version = "0.19", default-features = false, features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.17", default-features = false, features = ["esp32s3", "jtag-serial", "log-04"] }
esp-bootloader-esp-idf = { version = "0.5", features = ["esp32s3"] }

# Onboard SSD1306 OLED (I2C) — Stage B visual feedback. embedded-hal 1.0
# compatible, no_std, no alloc (buffered mode keeps the framebuffer on the
# stack). Small heapless strings for no-alloc line formatting.
ssd1306 = "0.9"
embedded-graphics = "0.8"
heapless = { version = "0.8", default-features = false }
# WiFi (RNSAutoInterface, Milestone 1: association). On esp-hal 1.1 the WiFi
# driver is esp-radio (NOT esp-wifi — that's pinned to esp-hal 1.0). esp-radio
# is async-first and needs a preemptive scheduler (esp-rtos) + a heap
# (esp-alloc). esp-rtos's `embassy` feature gives a thread-mode executor via
# `#[esp_rtos::main]`; embassy-executor/-time are the user-facing async API.
# `unstable` exposes `set_power_saving` — a STA in modem sleep misses
# AP-buffered multicast, which is how RNS discovery beacons arrive.
esp-radio = { version = "0.18.0", features = ["esp32s3", "wifi", "esp-now", "unstable"] }
esp-rtos = { version = "0.3.0", features = ["esp32s3", "embassy", "esp-radio"] }
esp-alloc = "0.10.0"
embassy-executor = { version = "0.10", default-features = false }
embassy-time = { version = "0.5", default-features = false }
# `select` two futures (inbound datagram vs beacon tick) in one discovery loop.
embassy-futures = { version = "0.1", default-features = false }
# `slaac` makes embassy-net auto-assign the IPv6 link-local from the MAC
# (EUI-64) — exactly what RNS AutoInterface's link-local multicast needs.
embassy-net = { version = "0.9.1", features = ["udp", "proto-ipv6", "medium-ethernet", "multicast", "slaac"] }
# `static_cell` promotes the net stack resources + device + worker channels to
# 'static so the embassy tasks (net runner, AutoInterface worker) can own them.
static_cell = "2"
# `log` facade: the AutoInterface worker (in personal-rns) logs through it; we
# install esp-println as the sink in main. esp-println's `log-04` feature.
log = "0.4"

# LoRa radio (SX1262). lora-phy is the no_std/async PHY driver (LoRa-only;
# RNode-compatible params live in impls::rns_parity::rnode_lora::core). We hand it an
# eh-async SpiDevice — esp-hal async SPI + the NSS pin, wrapped by
# embedded-hal-bus's async ExclusiveDevice — plus a hand-written InterfaceVariant
# for the Heltec V4 (reset/busy/dio1/RF-switch + the V4 front-end). The async
# `Wait` trait the variant uses to await BUSY/DIO1 edges comes from embedded-hal-async.
lora-phy = "3.0.1"
embedded-hal-bus = { version = "0.3", default-features = false, features = ["async"] }
embedded-hal-async = "1.0"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false
