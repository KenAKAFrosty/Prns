[package]
name = "esp32-c6"
version = "0.1.0"
edition = "2021"
publish = false
description = "ESP32-C6 host body: drives the Personal Reticulum engine on bare metal."

# Standalone: its own workspace so the suite's host workspace never tries to
# build this no_std/no_main bare-metal crate for the host target.
[workspace]

# The target is the auto-discovered `src/bin/contract.rs` binary — there is no
# package-level `src/main.rs`, so always build with `--bins`.

[dependencies]
personal-rns = { path = "../../personal-rns", default-features = false, features = ["embassy-contract"] }

esp-hal = { version = "1.1", features = ["esp32c6", "unstable"] }
esp-backtrace = { version = "0.19", default-features = false, features = ["esp32c6", "panic-handler", "println"] }
esp-println = { version = "0.17", default-features = false, features = ["esp32c6", "jtag-serial", "log-04"] }
esp-bootloader-esp-idf = { version = "0.5", features = ["esp32c6"] }
# The contract binary runs an embassy executor + embassy-time timebase on the stable
# esp-hal 1.1.1 stack, WITHOUT esp-hal-embassy — its internal `__esp_hal_embassy`
# feature isn't reachable on the 1.1.x esp-* generation we pin. The timebase is our
# own SystemTimer-backed `embassy_time_driver::Driver` in `src/systimer_time_driver.rs`.
embassy-executor = { version = "0.10.0", default-features = false, features = ["platform-riscv32", "executor-thread"] }
embassy-time = { version = "0.5.1", default-features = false, features = ["tick-hz-1_000_000", "generic-queue-64"] }
embassy-time-driver = "0.2.2"
# The driver owns a self-contained generic timer queue (no coupling to the
# executor's integrated per-task timer items), so we name `Queue` directly.
embassy-time-queue-utils = { version = "0.3", default-features = false }
critical-section = "1"
static_cell = "2"
# `embassy_sync::signal::Signal` backs the host wake the interface seams poke
# (`personal-rns`'s `WakeSignal`); pinned to 0.8 to match the seam. The serial worker
# + contract host (`embassy-futures` selects, `embedded-io-async` byte streams) live
# in `personal-rns` behind the `embassy-contract` feature, so this crate names none of
# that directly.
embassy-sync = { version = "0.8", default-features = false }

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false
