[workspace]
members = ["core", "codec", "runtime", "."]
default-members = ["core", "codec", "runtime"]
resolver = "3"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KenAKAFrosty/Prns"
homepage = "https://reticulum.rs"
rust-version = "1.90"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[package]
name = "prns-identities"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false
description = "Durable identity catalog, key vault, recovery and owned clients"

[features]
default = []
owner = ["dep:tokio"]
contact-card = ["dep:prns-contact-card"]
uniffi-bindings = ["owner", "dep:uniffi", "prns-identities-core/uniffi-bindings", "prns-identities-runtime/uniffi-bindings"]
redb-store = ["dep:redb", "prns-storage/redb"]
# Process-crash injection for the isolated integration tests; never enable in a
# shipping application. The normal library does not inspect crash-control env.
fault-injection = []

[dependencies]
prns-contact-card = { path = "../prns-contact-card", features = ["prns-identity"], optional = true }
uniffi = { version = "=0.31.2", default-features = false, optional = true }
prns-storage = { path = "../prns-storage" }
prns-identities-core = { path = "core" }
prns-identities-codec = { path = "codec" }
prns-identities-runtime = { path = "runtime" }
prns-core = { path = "../prns-core", default-features = false, features = ["crypto-precomputed"] }
getrandom = "0.3"
tokio = { version = "1", optional = true, default-features = false, features = ["sync"] }
redb = { version = "=4.2.0", optional = true }

[[test]]
name = "owned"
required-features = ["owner"]

[lints]
workspace = true
