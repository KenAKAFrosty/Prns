[package]
name = "prns-interfaces-embassy"
version = "0.2.6"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KenAKAFrosty/Prns"
homepage = "https://reticulum.rs"
rust-version = "1.90"
description = "Embassy embedded interface implementations for the Personal Reticulum engine"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
prns-core = { path = "../../../prns-core", default-features = false, features = ["embassy-host"] }
prns-runtime = { package = "prns-runtime-embassy", path = "../../../prns-runtime/impls/embassy", default-features = false }
embassy-sync = { version = "0.8.0", default-features = false }
embassy-time = { version = "0.5", default-features = false }
embassy-futures = { version = "0.1", default-features = false }
portable-atomic = { version = "1", default-features = false, features = ["critical-section", "fallback"] }
heapless = { version = "0.8", default-features = false }
embedded-io-async = { version = "0.6", optional = true, default-features = false }
embedded-io-async-07 = { package = "embedded-io-async", version = "0.7", optional = true, default-features = false }
embassy-net = { version = "0.9.1", optional = true, default-features = false, features = ["tcp", "udp", "proto-ipv6", "medium-ethernet", "multicast"] }
embassy-usb = { version = "0.6", optional = true, default-features = false }
embedded-hal = { version = "1", optional = true, default-features = false }
embedded-hal-async = { version = "1", optional = true, default-features = false }
log = { version = "0.4", optional = true, default-features = false }

# Pure-Rust host BLE stack behind the Embassy BLE interface, generic over any bt-hci transport.
# 0.6.0 is the published release whose bt-hci 0.8 agrees with esp-radio 0.18. It depends on
# embassy-sync 0.7 and heapless 0.9 while the rest of this crate is on 0.8; the aliases below
# feed trouble its own versions across the boundary, keeping the dual-version island contained
# to this backend. Boards pick the packet-pool size feature themselves (it is board policy).
trouble-host = { version = "0.6.0", optional = true, default-features = false, features = ["central", "scan", "peripheral", "gatt", "derive", "default-packet-pool-mtu-255"] }
bt-hci = { version = "0.8", optional = true, default-features = false }
embassy-sync-07 = { package = "embassy-sync", version = "0.7", default-features = false, optional = true }
heapless-09 = { package = "heapless", version = "0.9", default-features = false, optional = true }

[dev-dependencies]
prns-core = { path = "../../../prns-core", default-features = false, features = ["std", "embassy-host"] }
prns-runtime = { package = "prns-runtime-embassy", path = "../../../prns-runtime/impls/embassy", default-features = false, features = ["std"] }
critical-section = { version = "1", features = ["std"] }
embassy-time = { version = "0.5", default-features = false, features = ["std", "generic-queue-8"] }

[features]
default = []
log = ["dep:log", "trouble-host?/log"]
tcp = ["dep:embassy-net", "dep:embedded-io-async-07"]
wifi-auto = ["dep:embassy-net", "dep:embedded-io-async-07"]
lora = ["dep:embedded-hal", "dep:embedded-hal-async"]
esp-now = ["prns-core/alloc", "prns-runtime/alloc"]
ble = []
ble-trouble = ["ble", "dep:trouble-host", "dep:bt-hci", "dep:embassy-sync-07", "dep:heapless-09"]
usb = ["dep:embedded-io-async", "dep:embassy-usb"]

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
significant_drop_in_scrutinee = "warn"
