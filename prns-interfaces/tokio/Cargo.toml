[package]
name = "prns-interfaces-tokio"
version = "0.2.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KenAKAFrosty/Prns"
homepage = "https://reticulum.rs"
rust-version = "1.88"
description = "Tokio host interface implementations for the Personal Reticulum engine"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
# The async serial transport behind serial_host's opener; default-features off drops the
# libudev enumeration dep (the opener works by path; enumeration is serialport's job under
# usb-host). >= 5.5 (mio-serial 5.0.7) is required on Windows: earlier versions hard-error
# reading back stop bits when opening an ESP32-native-USB RNode (whose CDC reports 1.5 stop
# bits); 5.0.7 degrades that readback to a warning, so `open_native_async` opens such
# devices instead of failing.
tokio-serial = { version = "5.5", default-features = false, optional = true }
serialport = { version = "4.9", optional = true }
prns-core = { path = "../../prns-core", default-features = false, features = ["tokio-host"] }
prns-runtime = { path = "../../prns-runtime", default-features = false, features = ["tokio-host"] }
heapless = { version = "0.8", default-features = false }
tokio = { version = "1", optional = true, default-features = false, features = ["rt", "macros", "sync", "time", "io-util"] }
socket2 = { version = "0.6", optional = true, features = ["all"] }
if-addrs = { version = "0.13", optional = true }
netdev = { version = "0.45", optional = true }
md-5 = { version = "0.11", optional = true, default-features = false }
hmac = { version = "0.13", optional = true, default-features = false }
getrandom = { version = "0.2", optional = true }
tokio-tungstenite = { version = "0.28", optional = true, default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["alloc", "sink"] }
log = { version = "0.4", optional = true, default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", optional = true, features = ["l2cap", "bluetoothd"] }
zbus = { version = "4", optional = true, default-features = false, features = ["tokio"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
prns-ffi = { path = "../../prns-ffi", optional = true }

[dev-dependencies]
personal-rns = { path = "../../personal-rns", default-features = false, features = ["tokio-host"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
env_logger = "0.11"

[[example]]
name = "local_shared_instance"
required-features = ["shared-instance"]

[[example]]
name = "local_shared_rpc_instance"
required-features = ["shared-instance"]

[[example]]
name = "local_transit_daemon"
required-features = ["shared-instance", "tcp"]

[[example]]
name = "tcp_server_host"
required-features = ["tcp"]

[[example]]
name = "bluetooth_node"
required-features = ["ble"]

[[example]]
name = "wifi_direct_linux"
required-features = ["wifi-direct"]

[features]
default = []
tcp = ["dep:tokio", "tokio/net", "dep:socket2", "dep:log"]
udp = ["dep:tokio", "tokio/net"]
serial = ["dep:tokio"]
serial-host = ["dep:tokio", "dep:tokio-serial"]
kiss = ["dep:tokio"]
ax25 = ["kiss"]
rnode = ["dep:tokio"]
pipe = ["dep:tokio"]
backbone = ["tcp"]
websocket = ["dep:tokio", "tokio/net", "dep:tokio-tungstenite", "dep:futures-util", "dep:log"]
shared-instance = ["dep:tokio", "tokio/net", "dep:md-5", "dep:hmac", "dep:getrandom"]
wifi = ["tcp", "dep:if-addrs", "dep:netdev"]
wifi-direct = ["tcp", "dep:zbus", "dep:futures-util", "dep:if-addrs"]
usb = ["dep:tokio", "dep:futures-util"]
usb-host = ["usb", "serial-host", "dep:serialport"]
ble = ["dep:tokio", "dep:futures-util", "dep:bluer", "dep:prns-ffi"]

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
significant_drop_in_scrutinee = "warn"
