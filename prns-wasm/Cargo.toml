[package]
name = "prns-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KenAKAFrosty/Prns"
homepage = "https://reticulum.rs"
rust-version = "1.88"
description = "WASM and TypeScript-facing bindings for the Personal Reticulum engine"
publish = false

# Standalone workspace: the root workspace keeps the pure engine free of binding
# dependencies and target-specific feature unification.
[workspace]

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
personal-rns = { path = "../personal-rns", default-features = false, features = ["alloc"] }
wasm-bindgen = "0.2"
zeroize = { version = "1", default-features = false, features = ["derive"] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
significant_drop_in_scrutinee = "warn"
