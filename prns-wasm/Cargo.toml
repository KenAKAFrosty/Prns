[package]
name = "prns-wasm"
version = "0.3.7"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KenAKAFrosty/Prns"
homepage = "https://reticulum.rs"
rust-version = "1.90"
description = "WebAssembly and TypeScript-facing bindings for the Personal Reticulum engine"
publish = false

# Standalone workspace: the root workspace keeps the pure engine free of binding
# dependencies and target-specific feature unification.
[workspace]

[features]
default = []
source-archive = ["personal-hopspot-core/source-archive"]

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3"
personal-rns = { path = "../personal-rns", default-features = false, features = ["alloc"] }
personal-hopspot-core = { path = "../personal-hopspot/core", default-features = false }
prns-host = { path = "../prns-host/core" }
prns-host-cooperative = { path = "../prns-host/impls/cooperative" }
prns-runtime = { path = "../prns-runtime/core", default-features = false, features = ["resource-bzip2"] }
wasm-bindgen = "0.2"
zeroize = { version = "1", default-features = false, features = ["derive"] }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
significant_drop_in_scrutinee = "warn"
