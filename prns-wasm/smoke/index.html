<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Prns Browser Node Playground</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #070b10;
        color: #dce8ee;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      main {
        box-sizing: border-box;
        width: min(960px, 100%);
        padding: 28px;
      }

      h1 {
        margin: 0 0 18px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 0 0 18px;
      }

      button {
        border: 1px solid #2a5f50;
        border-radius: 6px;
        background: #0b332b;
        color: #e7fff8;
        cursor: pointer;
        font: inherit;
        min-height: 38px;
        padding: 0 14px;
      }

      button:disabled {
        border-color: #26313a;
        background: #121920;
        color: #77848d;
        cursor: default;
      }

      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 8px 14px;
        margin: 0 0 20px;
      }

      dt {
        color: #9db0bb;
      }

      dd {
        margin: 0;
      }

      pre {
        box-sizing: border-box;
        width: 100%;
        min-height: 220px;
        margin: 0;
        overflow: auto;
        border: 1px solid #1c2a34;
        border-radius: 6px;
        background: #0b1117;
        color: #c8f5e9;
        padding: 14px;
        white-space: pre-wrap;
      }

      .mini {
        min-height: 58px;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Prns Browser Node Playground</h1>
      <div class="toolbar">
        <button id="connect" type="button" disabled>Connect USB</button>
        <button id="announce" type="button" disabled>Send Announce</button>
        <button id="close" type="button" disabled>Close USB</button>
      </div>
      <dl>
        <dt>runtime</dt>
        <dd id="runtime">starting</dd>
        <dt>usb</dt>
        <dd id="usb">idle</dd>
        <dt>snapshot</dt>
        <dd id="snapshot">none</dd>
        <dt>interfaces</dt>
        <dd><pre id="interfaces" class="mini">none</pre></dd>
      </dl>
      <pre id="status">running</pre>
    </main>
    <script type="module" src="./dist/smoke/smoke.js"></script>
  </body>
</html>
