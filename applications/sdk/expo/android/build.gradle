plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'rs.reticulum.prns.app'
version = '0.0.0'

android {
  namespace 'rs.reticulum.prns.app.expo'
  defaultConfig {
    minSdkVersion 29
    versionCode 1
    versionName '0.0.0'
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    testApplicationId 'rs.reticulum.prns.app.expo.test'
    consumerProguardFiles 'consumer-rules.pro'
  }
  sourceSets.main.jniLibs.srcDirs = [layout.buildDirectory.dir('rustJniLibs')]
}

// Cargo owns its incremental dependency graph, including the pinned Prns source.
// Running it on each native build avoids stale libraries after upstream changes.
def rustBuild = tasks.register('buildPrnsRust', Exec) {
  workingDir projectDir
  commandLine 'bash', file('build-rust.sh').absolutePath
  environment 'PRNS_ANDROID_ABIS', providers.gradleProperty('reactNativeArchitectures').getOrElse('arm64-v8a')
  environment 'PRNS_ANDROID_JNI_OUTPUT', layout.buildDirectory.dir('rustJniLibs').get().asFile.absolutePath
  doFirst {
    environment 'ANDROID_NDK_HOME', android.ndkDirectory.absolutePath
  }
}

tasks.named('preBuild').configure { dependsOn rustBuild }

dependencies {
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.mockito:mockito-core:5.14.2'
  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
