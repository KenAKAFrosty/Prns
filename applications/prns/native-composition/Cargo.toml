[package]
name = "prns-app-native"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false
description = "Application-owned native Prns composition with generated UniFFI bindings"
build = "build.rs"

[lib]
name = "prns_app"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "export_contract_fingerprints"
path = "src/bin/export_contract_fingerprints.rs"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["uniffi-bindgen"]

[features]
default = ["uniffi-bindings"]
uniffi-bindings = ["dep:uniffi", "dep:prns-host-uniffi"]
uniffi-bindgen = ["uniffi-bindings", "uniffi/cli", "uniffi/cargo-metadata"]
apple = [
    "dep:prns-interfaces-tokio",
    "personal-rns/bluetooth-auto",
    "personal-rns/tcp",
    "prns-interfaces-tokio/bluetooth-auto",
]
host-test = ["personal-rns/tcp"]
android = [
    "dep:prns-expo-android",
    "prns-host-native/android-platform",
    "personal-rns/bluetooth-auto",
    "personal-rns/tcp",
]
ios-restoration-probe = ["apple", "dep:log", "prns-interfaces-tokio/log"]

[dependencies]
futures-timer = "=3.0.3"
uniffi = { version = "=0.31.2", optional = true, default-features = false }
personal-rns = { path = "../../../personal-rns", default-features = false, features = ["tokio-host"] }
prns-lxmf = { path = "../../services/lxmf", default-features = false, features = ["redb-mailbox", "tokio-host"] }
prns-core = { path = "../../../prns-core", default-features = false, features = ["std"] }
prns-host = { path = "../../../prns-host/core" }
prns-host-native = { path = "../../../prns-host/impls/native" }
prns-host-uniffi = { path = "../../../prns-host/bindings/uniffi", optional = true }
prns-interfaces-tokio = { path = "../../../prns-interfaces/impls/tokio", default-features = false, optional = true }
log = { version = "0.4", default-features = false, optional = true }
prns-expo-android = { path = "../../../prns-react-native/platform/android", optional = true }
redb = "=4.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
prns-runtime = { path = "../../../prns-runtime/core", default-features = false, features = ["remote-control-wifi-host"] }
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["test-util"] }

[lints]
workspace = true
