[package]
name = "prns-lxmf-wire"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false
description = "Bounded allocation-free LXMF wire views and current Python interop corpus"

[features]
default = []

[dependencies]
curve25519-dalek = { version = "5", default-features = false }
ed25519-dalek = { version = "3", default-features = false, features = ["hazmat"] }
hkdf = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
subtle = { version = "2.6", default-features = false }

[dev-dependencies]
ed25519-dalek = { version = "3", default-features = false, features = ["fast"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
path = "src/lib.rs"

[lints]
workspace = true
