[package]
name = "prns-lxmf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false
description = "Reusable application-owned LXMF delivery service above Prns"

[features]
default = []
tokio-host = ["dep:personal-rns", "dep:tokio"]

[dependencies]
prns-lxmf-wire = { path = "../lxmf-wire", default-features = false }
personal-rns = { path = "../../../personal-rns", optional = true, default-features = false, features = ["tokio-host"] }
tokio = { version = "1", optional = true, default-features = false, features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
hex = "0.4"
personal-rns = { path = "../../../personal-rns", default-features = false, features = ["tokio-host", "tcp"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }

[lib]
path = "src/lib.rs"

[[example]]
name = "live_tcp_peer"
required-features = ["tokio-host"]

[lints]
workspace = true
