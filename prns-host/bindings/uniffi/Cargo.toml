[package]
name = "prns-host-uniffi"
version = "0.3.8"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["rlib"]

[features]
default = []
connections = ["prns-host-runtime/connections", "dep:prns-storage"]

[dependencies]
prns-storage = { path = "../../../prns-storage", optional = true }
personal-rns = { path = "../../../personal-rns", default-features = false }
prns-core = { path = "../../../prns-core", default-features = false, features = ["lora-2g4"] }
prns-host = { path = "../../core" }
prns-host-runtime = { path = "../../impls/runtime" }
uniffi = { version = "=0.31.2", default-features = false }
zeroize = "1"
thiserror = "2"
