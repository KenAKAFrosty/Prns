[package]
name = "prns-host-tokio"
version = "0.3.7"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KenAKAFrosty/Prns"
homepage = "https://reticulum.rs"
rust-version = "1.90"
description = "Tokio implementation of the Personal Reticulum host contract"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
prns-host = { path = "../../core" }
tokio = { version = "1", default-features = false, features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
significant_drop_in_scrutinee = "warn"
