[package]
name = "prns-host-native"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KenAKAFrosty/Prns"
homepage = "https://reticulum.rs"
rust-version = "1.90"
description = "Canonical native Personal Reticulum host runtime"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
personal-rns = { path = "../../../personal-rns", default-features = false, features = [
    "tokio-host",
    "tcp",
    "udp",
] }
prns-host = { path = "../../core" }
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "sync",
    "time",
    "net",
] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
significant_drop_in_scrutinee = "warn"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
