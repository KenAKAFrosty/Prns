[package]
name = "prns-host-native"
version = "0.3.7"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KenAKAFrosty/Prns"
homepage = "https://reticulum.rs"
rust-version = "1.90"
description = "Canonical native Personal Reticulum host runtime"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[features]
default = []
android-platform = ["dep:prns-ffi"]

[dependencies]
prns-ffi = { path = "../../../prns-ffi", optional = true, default-features = false }

personal-rns = { path = "../../../personal-rns", default-features = false, features = [
    "tokio-host",
    "tcp",
    "udp",
    "pipe",
    "backbone",
    "i2p",
    "wifi-auto",
    "bluetooth-auto",
    "websocket",
    "config",
    "parallel-persistence",
    "parallel-resource-hash",
] }
prns-host = { path = "../../core" }
prns-host-snapshot = { path = "../snapshot" }
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "sync",
    "time",
    "net",
] }

# Mobile hosts use prepared platform adapters; they must not compile desktop
# serial/BLE-manager and USB discovery implementations by accident.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
personal-rns = { path = "../../../personal-rns", default-features = false, features = [
    "serial", "kiss", "ax25", "rnode", "weave", "usb",
] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", features = ["vendored"] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
significant_drop_in_scrutinee = "warn"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
