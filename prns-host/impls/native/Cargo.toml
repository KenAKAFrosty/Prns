[package]
name = "prns-host-native"
version = "0.3.7"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KenAKAFrosty/Prns"
homepage = "https://reticulum.rs"
rust-version = "1.90"
description = "Canonical native Personal Reticulum host runtime"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
personal-rns = { path = "../../../personal-rns", default-features = false, features = [
    "tokio-host",
    "tcp",
    "udp",
    "serial",
    "kiss",
    "ax25",
    "rnode",
    "pipe",
    "backbone",
    "i2p",
    "weave",
    "wifi-auto",
    "usb",
    "bluetooth-auto",
    "websocket",
    "config",
    "parallel-persistence",
    "parallel-resource-hash",
] }
prns-host = { path = "../../core" }
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "sync",
    "time",
    "net",
] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", features = ["vendored"] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
significant_drop_in_scrutinee = "warn"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
