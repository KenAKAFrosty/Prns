setup = { cargo = "Install Rust through rustup: https://rustup.rs/", rustc = "Install or update Rust through rustup: https://rustup.rs/" }

[[doctor_profile]]
id = "rust"
summary = "Check the tools needed to build the Rust libraries and run the two-node guide."
