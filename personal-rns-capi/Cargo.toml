[package]
name = "personal-rns-capi"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KenAKAFrosty/Prns"
homepage = "https://reticulum.rs"
rust-version = "1.88"
description = "C ABI bindings for personal-rns for C, C++, Go, Zig, and other native consumers"
publish = false

[workspace]

[lib]
# `cdylib` for dynamic FFI consumers, `staticlib` for vendored/native SDK
# packaging, and `rlib` so Rust tests can exercise the exported symbols.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
personal-rns = { path = "../personal-rns", default-features = false, features = ["std"] }
getrandom = "0.2"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
significant_drop_in_scrutinee = "warn"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
