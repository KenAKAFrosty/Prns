<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>RUNNING</title>
  </head>
  <body data-outcome="Pending">
    <script type="module">
      import { Prns, linkId } from "/prns-js/dist/browser/index.js";

      const outcome = await Prns.create({});
      document.body.dataset.outcome = outcome.tag;
      if (outcome.tag !== "Ready") {
        document.title = "FAIL";
      } else {
        const closed = await outcome.data.closeLink(linkId(new Uint8Array(16)));
        document.body.dataset.command = `${closed.tag}:${closed.data.tag}`;
        document.title =
          closed.tag === "Failed" && closed.data.tag === "UnknownLink"
            ? "PASS"
            : "FAIL";
      }
    </script>
  </body>
</html>
