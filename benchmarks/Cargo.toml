[package]
name = "personal-reticulum-suite-benchmarks"
version = "0.0.0"
publish = false
edition = "2021"

# Standalone, like `fuzz/`: an empty `[workspace]` detaches this from the root so
# the engine `--workspace` gates never pull in dev tooling, and it can
# move at its own pace. Builds via its own manifest.
[workspace]

# Builds scenario_node on the fixed embedded layout (Esp32S3) instead of the default
# unbounded GrowableHeap — lets the suite measure the on-device storage profile on-host.
[features]
fixed-storage = ["personal-rns/external-alloc"]
parallel-resource-hash = ["personal-rns/parallel-resource-hash"]
dhat-heap = ["dep:dhat"]

[lib]
name = "benchmarks"
path = "src/lib.rs"
bench = false

[dependencies]
personal-rns = { path = "../personal-rns", features = ["tcp", "udp", "local"] }
prns-interfaces-tokio = { path = "../personal-rns-interfaces/tokio", features = ["tcp", "udp", "shared-instance"] }
dhat = { version = "0.3", optional = true }
# The result substrate is JSON rows (the cross-implementation schema); the energy drivers
# emit them and `render_results` reads them back to render RESULTS.md.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The live-scenario participation binary rides the real tokio reactor over real TCP
# (`scenario_node`); the orchestrator stays std (process spawn + line protocol).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
# Fresh per-run identities for the scenario nodes (the corpus bins keep fixed ones).
getrandom = "0.2"
# Cross-platform host spec gathering for `describe_host` (CPU model, cores, RAM, OS) —
# the per-host reproducibility descriptor that sits beside each host's result rows.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
# Platform sampling for the live orchestrator: macOS reaps each role with `wait4` for its
# peak RSS + CPU rusage (no /proc), and gates the powermetrics energy path on `geteuid`.
# Linux keeps reading /proc, so the dep only carries weight off-Linux.
libc = "0.2"
# Stable identity for the result substrate: a per-device and per-submitter UUID stamped on
# every row, so figures from different machines/people can be joined later (the `host` triple
# is only a class — two M4s share it).
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
# Timing harness for the engine microscope (lean: no plotters/rayon).
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
pprof = { version = "0.14", features = ["flamegraph", "criterion"] }
iai-callgrind = "0.16.1"
# Heap-allocation profiling for the engine microscope examples. Each example owns its
# own `#[global_allocator] = dhat::Alloc`, so the lib / iai / criterion paths are
# untouched — the instrumented allocator only exists inside that one example binary.
dhat = "0.3"

# --- Result substrate: our driver emits rows; the renderer turns rows into RESULTS.md ---
[[bin]]
name = "describe_host"
path = "src/bin/describe_host.rs"
bench = false

# --- Live scenarios: the pairing harness (one node binary, one orchestrator) ---
[[bin]]
name = "scenario_node"
path = "src/bin/scenario_node.rs"
bench = false

[[bin]]
name = "orchestrate"
path = "src/bin/orchestrate.rs"
bench = false

[[bin]]
name = "render_results"
path = "src/bin/render_results.rs"
bench = false

[[bin]]
name = "resource_profile"
path = "src/bin/resource_profile.rs"
bench = false

[[bin]]
name = "wake_scan_profile"
path = "src/bin/wake_scan_profile.rs"
bench = false

# --- Matchup: the shared-instance conformance grid (host + two app clients, our impl outside
# the measured boundary) — stands up the cell and reports the conformance verdict ---
[[bin]]
name = "matchup"
path = "src/bin/matchup.rs"
bench = false

# The Prns side of a shared-instance Matchup: a transport host that holds the local bus so app
# clients meet through our engine. Stood up by the runner for the Prns-host cells.
[[bin]]
name = "matchup_host"
path = "src/bin/matchup_host.rs"
bench = false

# --- Microscope: drive the engine directly, no I/O — the control baseline for crypto work ---
[[bench]]
name = "engine_cycle"
path = "benches/engine_cycle.rs"
harness = false

[[bench]]
name = "engine_cycle_iai"
path = "benches/engine_cycle_iai.rs"
harness = false

# --- Route-lookup crossover: linear scan vs. Lemire-indexed columns across N ---
[[bench]]
name = "route_index"
path = "benches/route_index.rs"
harness = false

# --- Heap profiling: dhat-instrumented microscopes (own global allocator each) ---
[[example]]
name = "dhat_cycle"
path = "examples/dhat_cycle.rs"

[[example]]
name = "dhat_forward"
path = "examples/dhat_forward.rs"

[profile.release]
debug = true
lto = "fat"
codegen-units = 1

[profile.bench]
debug = true
lto = "fat"
codegen-units = 1
