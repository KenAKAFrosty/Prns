[package]
name = "leviculum-announce-bench"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone workspace so the path-dep on the upstream Leviculum workspace member
# resolves without absorbing this harness into it.
[workspace]

[dependencies]
reticulum-core = { path = "../.upstream/reticulum-core" }
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
