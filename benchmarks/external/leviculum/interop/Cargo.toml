[package]
name = "leviculum-node"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "leviculum-node"
path = "src/main.rs"

[dependencies]
# The pinned upstream, patched in place by build.sh (macos-portability.patch) to
# cfg-gate its Linux-only abstract-socket Local-IPC/RPC paths — code this TCP-only
# node never touches. Depending on the in-workspace crates lets cargo resolve their
# workspace-inherited versions from ../.upstream/Cargo.toml.
reticulum-std = { path = "../.upstream/reticulum-std" }
reticulum-core = { path = "../.upstream/reticulum-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Standalone workspace root so this crate is never pulled into the upstream
# workspace under ../.upstream (which forces an x86_64-musl target via its
# .cargo/config.toml and would break the macOS host build).
[workspace]

[profile.release]
opt-level = 3
