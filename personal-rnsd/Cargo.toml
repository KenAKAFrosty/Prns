[package]
name = "personal-rnsd"
version = "0.1.0"
edition = "2021"
description = "Thin daemon host for the Personal Reticulum engine"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "personal-rnsd"
path = "src/main.rs"
required-features = ["std-host"]

[features]
default = ["std-host"]
alloc = ["personal-rns/alloc"]
std = ["alloc", "personal-rns/std"]
std-host = ["std"]
tokio-host = ["std", "dep:tokio"]
fixture-identity = []
interfaces-host-shell = ["std"]

[dependencies]
personal-rns = { path = "../personal-rns", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "time"], optional = true }

[lints]
workspace = true
