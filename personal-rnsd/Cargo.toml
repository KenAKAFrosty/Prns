[package]
name = "personal-rnsd"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Thin daemon host for the Personal Reticulum engine"
publish = false

[[bin]]
name = "personal-rnsd"
path = "src/main.rs"
required-features = ["std-host"]

[features]
default = ["std-host"]
alloc = ["personal-rns/alloc"]
std = ["alloc", "personal-rns/std"]
std-host = ["std", "dep:serialport", "personal-rns/std-host"]
fixture-identity = []

[dependencies]
personal-rns = { path = "../personal-rns", default-features = false }
# USB-serial transport (std-host only). default-features off drops the libudev
# system dep — we open ports by path, never enumerate.
serialport = { version = "4", default-features = false, optional = true }
# OS CSPRNG for the daemon's node identity (main's load_identity_secret_key) —
# the same source RNS uses (`os.urandom`).
getrandom = "0.2"

[lints]
workspace = true
