[package]
name = "personal-rnsd"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KenAKAFrosty/Prns"
homepage = "https://reticulum.rs"
rust-version = "1.88"
description = "Thin daemon host for the Personal Reticulum engine"
publish = false

[workspace]

[[bin]]
name = "personal-rnsd"
path = "src/main.rs"
required-features = ["tokio-host"]

[features]
default = ["tokio-host"]
alloc = ["personal-rns/alloc"]
std = ["alloc", "personal-rns/std"]
tokio-host = [
    "std",
    "personal-rns/tokio-host",
    "personal-rns/local",
    "personal-rns/tcp",
    "personal-rns/udp",
    "personal-rns/wifi-lan-auto",
    "dep:prns-interfaces-tokio",
    "prns-interfaces-tokio/tcp",
    "prns-interfaces-tokio/udp",
    "prns-interfaces-tokio/serial",
    "prns-interfaces-tokio/kiss",
    "prns-interfaces-tokio/ax25",
    "prns-interfaces-tokio/rnode",
    "prns-interfaces-tokio/pipe",
    "prns-interfaces-tokio/backbone",
    "prns-interfaces-tokio/wifi",
    "prns-interfaces-tokio/shared-instance",
    "dep:tokio",
    "dep:tokio-serial",
    "dep:clap",
    "dep:shlex",
]
fixture-identity = []

[dependencies]
personal-rns = { path = "../personal-rns", default-features = false }
prns-interfaces-tokio = { path = "../personal-rns-interfaces/tokio", optional = true, default-features = false }
# The reference-config reader (discovery + ConfigObj parse + the ours-mapping plan layer). It
# pulls only `personal-rns` types (no tokio), so the daemon owns the host-side construction.
personal-rns-config = { path = "../personal-rns-config" }
# The async runtime + async USB-serial transport (tokio-host only). tokio-serial wraps the
# port as an AsyncRead+AsyncWrite stream for the reactor's serial interface; default-features
# off drops the libudev enumeration dep — we open ports by path, never enumerate.
# >= 5.5 (mio-serial 5.0.7) is required on Windows: earlier versions hard-error reading back stop
# bits when opening an ESP32-native-USB RNode (whose CDC reports 1.5 stop bits); 5.0.7 degrades
# that readback to a warning, so `open_native_async` opens such devices instead of failing.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "process"], optional = true }
tokio-serial = { version = "5.5", default-features = false, optional = true }
# The daemon's command-line front door (tokio-host only): typed args, --help, --version.
clap = { version = "4", features = ["derive"], optional = true }
# Shell-style splitting of a PipeInterface command into argv, matching RNS's shlex.split.
shlex = { version = "1", optional = true }
# OS CSPRNG for the daemon's node identity (main's load_identity_secret_key) —
# the same source RNS uses (`os.urandom`).
getrandom = "0.2"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
significant_drop_in_scrutinee = "warn"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
