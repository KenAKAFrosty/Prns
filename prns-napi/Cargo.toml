[package]
name = "prns-napi"
version = "0.3.7"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KenAKAFrosty/Prns"
homepage = "https://reticulum.rs"
rust-version = "1.90"
description = "Node.js bindings for the Personal Reticulum engine"
publish = false

[workspace]

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8", "async"] }
napi-derive = "3"
personal-rns = { path = "../personal-rns", default-features = false, features = [
    "tokio-host",
    "tcp",
    "udp",
    "serial",
    "kiss",
    "ax25",
    "rnode",
    "pipe",
    "backbone",
    "i2p",
    "weave",
    "wifi-auto",
    "usb",
    "bluetooth-auto",
    "websocket",
    "browser-rendezvous",
    "shared-instance",
    "config",
    "runtime-metrics",
    "parallel-persistence",
    "parallel-resource-hash",
] }
prns-host = { path = "../prns-host/core" }
prns-host-native = { path = "../prns-host/impls/native" }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", features = ["vendored"] }

[build-dependencies]
napi-build = "2"

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
significant_drop_in_scrutinee = "warn"
