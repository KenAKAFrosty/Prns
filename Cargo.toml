[workspace]
members = [
    "personal-rns",
    "prns-core",
    "prns-runtime",
    "personal-lxmf",
    "personal-hopspot/core",
    "tools/docs",
    "tools/hopspot",
    "tools/hopspot-flash",
    "tools/prnsd-control",
    "tools/prnsd",
]
# Root-excluded workspaces build standalone via their own manifests and carry their own
# CI jobs (feature-configs), keeping `--workspace` gates the pure engine surface: a
# member's host features (tokio, CoreBluetooth) would unify into the default build and
# break the std-only invariant. `prns-ffi` is the sharpest case: the one crate allowed
# `unsafe` (platform FFI backends), audited with cargo-geiger + Miri.
exclude = [
    "prnsd",
    "prns-ffi",
    "prns-wasm",
    "prns-interfaces/tokio",
    "prns-interfaces/embassy",
    "prns-integration-tests",
]
resolver = "3"

# Shared identity for every member crate. Members inherit these with
# `<field>.workspace = true` so the repository, license, edition, and MSRV
# are declared once. Per-crate `name`, `version`, and `description` stay local.
[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KenAKAFrosty/Prns"
homepage = "https://reticulum.rs"
rust-version = "1.90"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
significant_drop_in_scrutinee = "warn"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(mutants)'] }
