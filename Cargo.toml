[workspace]
members = [
    "personal-rns",
    "prns-core",
    "prns-macros",
    "prns-host/core",
    "prns-flash-manifest",
    "prns-nrf-dfu",
    "prns-nrf-dfu-wasm",
    "prns-runtime/core",
    "personal-hopspot/core",
    "personal-hopspot/sdk/hopspot",
    "docs/command",
    "tools/repo/cargo-tools-command",
    "personal-hopspot/flasher",
]
default-members = [
    "personal-rns",
    "prns-core",
    "prns-runtime/core",
    "personal-hopspot/core",
]
exclude = [
    "prnsd",
    "prns-ffi",
    "prns-napi",
    "prns-wasm",
    "prns-host/abi/c",
    "prns-host/impls/cooperative",
    "prns-host/impls/tokio",
    "prns-runtime/impls/tokio",
    "prns-runtime/impls/embassy",
    "prns-interfaces/impls/tokio",
    "prns-interfaces/impls/embassy",
    "validation/integration",
]
resolver = "3"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KenAKAFrosty/Prns"
homepage = "https://reticulum.rs"
rust-version = "1.90"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
significant_drop_in_scrutinee = "warn"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(mutants)'] }

[profile.release]
codegen-units = 1
lto = "fat"
