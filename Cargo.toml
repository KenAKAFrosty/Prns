[workspace]
members = [
    "personal-rns",
    "personal-lxmf",
    "personal-hopspot/ui",
]
# Thin consumers (binding shims + the daemon), parked while the core engine API
# is in active motion. Not workspace members so `--workspace` gates (CI
# clippy/test/check) don't tax every engine API step; each builds standalone via
# its own manifest (see scripts/*-smoke.sh) and gets a catch-up pass when the
# consumer API settles.
exclude = [
    "personal-rns-ffi",
    "personal-rns-napi",
    "personal-rns-capi",
    "personal-rnsd",
]
resolver = "3"

# Shared identity for every member crate. Members inherit these with
# `<field>.workspace = true` so the repository, license, edition, and MSRV
# are declared once. Per-crate `name`, `version`, and `description` stay local.
[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KenAKAFrosty/Prns"
homepage = "https://reticulum.rs"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
significant_drop_in_scrutinee = "warn"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
