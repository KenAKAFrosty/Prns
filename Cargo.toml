[workspace]
members = [
    "personal-rns",
    "personal-lxmf",
    "personal-hopspot/ui",
]
# The daemon host, parked while the core engine API is in active motion. Not a
# workspace member so `--workspace` gates (CI clippy/test/check) don't tax every
# engine API step; it builds standalone via its own manifest and gets a catch-up
# pass when the consumer API settles.
#
# `personal-rns-ffi` is excluded for a sharper reason: it is the one crate allowed
# `unsafe` (platform FFI backends + mobile packaging), so it must stay out of the
# workspace's feature unification — a member would pull its host features (tokio,
# CoreBluetooth) into the engine's default `--workspace` build and break the
# std-only invariant. It builds standalone and is audited with cargo-geiger + Miri.
exclude = [
    "personal-rnsd",
    "personal-rns-ffi",
]
resolver = "3"

# Shared identity for every member crate. Members inherit these with
# `<field>.workspace = true` so the repository, license, edition, and MSRV
# are declared once. Per-crate `name`, `version`, and `description` stay local.
[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KenAKAFrosty/Prns"
homepage = "https://reticulum.rs"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
significant_drop_in_scrutinee = "warn"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(mutants)'] }
