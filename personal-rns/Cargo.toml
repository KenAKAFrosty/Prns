[package]
name = "personal-rns"
version = "0.2.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Personal Reticulum: the pure engine, the high-level runtime, and every interface family behind one crate and one prelude"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = ["std", "std-sync-host"]
alloc = ["prns-core/alloc", "prns-runtime/alloc"]
external-alloc = ["alloc", "prns-core/external-alloc", "prns-runtime/external-alloc"]
std = ["alloc", "prns-core/std", "prns-runtime/std"]
std-sync-host = ["std", "prns-core/std-sync-host"]
tokio-host = ["std", "prns-core/tokio-host", "prns-runtime/tokio-host", "dep:prns-interfaces-tokio", "prns-interfaces-tokio?/auto"]
embassy-host = ["prns-core/embassy-host", "prns-runtime/embassy-host", "dep:prns-interfaces-embassy"]
runtime-metrics = ["tokio-host", "prns-core/runtime-metrics", "prns-runtime/runtime-metrics"]
tracing = ["tokio-host", "prns-runtime/tracing", "prns-interfaces-tokio?/tracing"]
log = ["prns-runtime/log", "prns-interfaces-tokio?/log", "prns-interfaces-embassy?/log"]
stream-compression = ["prns-core/stream-compression"]
parallel-resource-hash = ["prns-core/parallel-resource-hash"]
test-support = ["prns-core/test-support"]
keyring-zbus = ["prns-core/keyring-zbus"]
keyring-libdbus = ["prns-core/keyring-libdbus"]
flash = ["prns-core/flash"]

# The interface families, one lane-neutral name each: the weak (`?/`) edges light the
# family up on whichever runtime lane the build declared, so `tokio-host` + `tcp` is the
# host TcpClient/TcpServer and `embassy-host` + `tcp` is the embedded client — same
# feature spelling. A family named without its lane is a compile error (src/lane_guards.rs),
# never a silent no-op. When both lanes are on, the prelude's bare name goes to tokio
# (the `Prns`/`Fleet` precedent); the embassy module stays reachable explicitly.
tcp = ["prns-interfaces-tokio?/tcp", "prns-interfaces-embassy?/tcp"]
wifi = ["prns-interfaces-tokio?/wifi", "prns-interfaces-embassy?/wifi"]
wifi-direct = ["prns-interfaces-tokio?/wifi-direct"]
wifi-aware = ["prns-interfaces-tokio?/wifi-aware"]
usb = ["prns-interfaces-tokio?/usb", "prns-interfaces-tokio?/usb-host", "prns-interfaces-embassy?/usb"]
config = ["prns-interfaces-tokio?/from-plan"]
ble = ["prns-interfaces-tokio?/ble", "prns-interfaces-tokio?/ble-host", "prns-interfaces-embassy?/ble"]
udp = ["prns-interfaces-tokio?/udp"]
serial = ["prns-interfaces-tokio?/serial", "prns-interfaces-tokio?/serial-host"]
kiss = ["prns-interfaces-tokio?/kiss"]
ax25 = ["prns-interfaces-tokio?/ax25"]
rnode = ["prns-interfaces-tokio?/rnode"]
pipe = ["prns-interfaces-tokio?/pipe", "prns-interfaces-tokio?/pipe-host"]
backbone = ["prns-interfaces-tokio?/backbone"]
websocket = ["prns-interfaces-tokio?/websocket"]
shared-instance = ["prns-interfaces-tokio?/shared-instance"]
lora = ["prns-interfaces-embassy?/lora"]
ble-trouble = ["ble", "prns-interfaces-embassy?/ble-trouble"]
esp-now = ["prns-interfaces-embassy?/esp-now"]
usb-device = ["usb", "prns-interfaces-embassy?/usb-device"]

[dependencies]
prns-core = { path = "../prns-core", default-features = false }
prns-runtime = { path = "../prns-runtime", default-features = false }
prns-interfaces-tokio = { path = "../prns-interfaces/tokio", optional = true, default-features = false }
prns-interfaces-embassy = { path = "../prns-interfaces/embassy", optional = true, default-features = false }

[lints]
workspace = true
