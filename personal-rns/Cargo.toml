[package]
name = "personal-rns"
version = "0.2.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Personal Reticulum: the pure engine, the high-level runtime, and every interface family behind one crate and one prelude"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = ["std", "std-sync-host"]
alloc = ["prns-core/alloc", "prns-runtime/alloc"]
external-alloc = ["alloc", "prns-core/external-alloc", "prns-runtime/external-alloc"]
std = ["alloc", "prns-core/std", "prns-runtime/std"]
std-sync-host = ["std", "prns-core/std-sync-host"]
tokio-host = ["std", "prns-core/tokio-host", "prns-runtime/tokio-host"]
embassy-seam = ["prns-core/embassy-seam"]
embassy-host = ["embassy-seam", "prns-core/embassy-host", "prns-runtime/embassy-host"]
log = ["prns-runtime/log"]
stream-compression = ["prns-core/stream-compression"]
parallel-resource-hash = ["prns-core/parallel-resource-hash"]
bridge-bin = ["prns-core/bridge-bin"]
differential-coverage = ["prns-core/differential-coverage"]
test-support = ["prns-core/test-support"]
keyring-zbus = ["prns-core/keyring-zbus"]
keyring-libdbus = ["prns-core/keyring-libdbus"]
flash = ["prns-core/flash"]

# The tokio interface families, forwarded so an app can stand on this one crate:
# each pulls the runtime lane it runs on.
tcp = ["tokio-host", "dep:prns-interfaces-tokio", "prns-interfaces-tokio/tcp"]
udp = ["tokio-host", "dep:prns-interfaces-tokio", "prns-interfaces-tokio/udp"]
serial = ["tokio-host", "dep:prns-interfaces-tokio", "prns-interfaces-tokio/serial"]
kiss = ["tokio-host", "dep:prns-interfaces-tokio", "prns-interfaces-tokio/kiss"]
ax25 = ["tokio-host", "dep:prns-interfaces-tokio", "prns-interfaces-tokio/ax25"]
rnode = ["tokio-host", "dep:prns-interfaces-tokio", "prns-interfaces-tokio/rnode"]
pipe = ["tokio-host", "dep:prns-interfaces-tokio", "prns-interfaces-tokio/pipe"]
backbone = ["tokio-host", "dep:prns-interfaces-tokio", "prns-interfaces-tokio/backbone"]
websocket = ["tokio-host", "dep:prns-interfaces-tokio", "prns-interfaces-tokio/websocket"]
shared-instance = ["tokio-host", "dep:prns-interfaces-tokio", "prns-interfaces-tokio/shared-instance"]
wifi = ["tokio-host", "dep:prns-interfaces-tokio", "prns-interfaces-tokio/wifi"]
usb = ["tokio-host", "dep:prns-interfaces-tokio", "prns-interfaces-tokio/usb"]
ble = ["tokio-host", "dep:prns-interfaces-tokio", "prns-interfaces-tokio/ble"]

# The embassy interface families, prefixed because the bare names belong to the
# tokio lane (a build enabling both lanes keeps both reachable).
embassy-tcp = ["embassy-host", "dep:prns-interfaces-embassy", "prns-interfaces-embassy/tcp"]
embassy-wifi = ["embassy-host", "dep:prns-interfaces-embassy", "prns-interfaces-embassy/wifi"]
embassy-lora = ["embassy-host", "dep:prns-interfaces-embassy", "prns-interfaces-embassy/lora"]
embassy-esp-now = ["embassy-host", "dep:prns-interfaces-embassy", "prns-interfaces-embassy/esp-now"]
embassy-ble = ["embassy-host", "dep:prns-interfaces-embassy", "prns-interfaces-embassy/ble"]
embassy-usb = ["embassy-host", "dep:prns-interfaces-embassy", "prns-interfaces-embassy/usb"]
embassy-usb-device = ["embassy-host", "dep:prns-interfaces-embassy", "prns-interfaces-embassy/usb-device"]

[dependencies]
prns-core = { path = "../prns-core", default-features = false }
prns-runtime = { path = "../prns-runtime", default-features = false }
prns-interfaces-tokio = { path = "../prns-interfaces/tokio", optional = true, default-features = false }
prns-interfaces-embassy = { path = "../prns-interfaces/embassy", optional = true, default-features = false }

[lints]
workspace = true
