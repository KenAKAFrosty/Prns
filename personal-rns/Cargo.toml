[package]
name = "personal-rns"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Pure Reticulum engine and wire contract for Personal Reticulum"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = ["std", "std-sync-host"]
alloc = []
# Place fixed-capacity bulk in a caller-chosen heap region (PSRAM) via a custom
# `Allocator`: pulls the `allocator_api2` backport and unlocks the allocator-generic
# `FixedHeap*` columns + the `Esp32S3` prepackage. Off by default — ordinary hosts
# never link the backport, they use the inline or growable residences.
external-alloc = ["alloc", "dep:allocator-api2"]
std = ["alloc"]
std-sync-host = ["std", "dep:getrandom", "dep:rtrb"]
# The async-std lane: the same owned rtrb rings as `std-sync-host` (drop-clean
# for hotplug), with tokio supplying the wakers (`Notify`) and the host's
# deadline timer. `tokio` implies std, so the name needs no std- prefix. The
# lane most std consumers (rnsd, desktop) should sit on — async workers get
# the lease grammar, sync workers keep `drain_each`.
fat-links = []
# The reference's top `optimise_mtu` tier (524 KiB, what a >=1 Gbps wire wants): every
# lane slot and wire scratch pays the ceiling, so this is a std-host tier — embedded
# targets size with `fat-links` instead.
giga-links = ["fat-links"]
tokio-host = ["std", "dep:tokio", "dep:getrandom", "dep:rtrb", "giga-links"]
# Just the embassy primitives the contract seam needs (`embassy-sync` channels +
# `embassy-time` clock, `static_cell` for the outbound grant ring's backing
# buffer) — NOT `embassy-net`, so this builds on the host toolchain and the
# embassy seam is compile-checkable without an ESP cross-build. No alloc.
embassy-seam = ["dep:embassy-sync", "dep:embassy-time", "dep:static_cell"]
# The embassy contract runtime for USB/serial-only boards (ESP32-C6, …): the channel
# seam + `embassy-futures` (select) + `embedded-io-async` (byte streams), enough for
# the serial worker (`serve`) and `EmbassyContractHost`, but NOT the WiFi/LoRa stack.
# Host-buildable (no embassy-net), so it compile-checks off-target. No alloc.
embassy-contract = ["embassy-seam", "dep:embassy-futures", "dep:embedded-io-async", "dep:portable-atomic"]
# A WiFi embedded host: the embassy contract seam + embassy-net (enough for the
# AutoInterface worker shell). The fresh interface rebuild covers USB + WiFi-auto; the
# old LoRa/ESP-NOW radio shells were removed with the device host examples.
embassy-wifi = ["embassy-contract", "dep:embassy-net", "dep:log"]
# The plug-and-play USB-auto host interface: the std worker machinery plus
# serialport, which enumerates + opens USB CDC ports cross-platform (it cfg-gates
# libudev / IOKit / SetupAPI internally). Opt-in, so std hosts that don't want it
# never link serialport.
usb-auto = ["std-sync-host", "dep:serialport", "dep:mio", "dep:mio-serial"]
# The plug-and-play WiFi/LAN auto-interface (RNS AutoInterface parity) for std hosts:
# the std worker machinery plus socket2 (IPv6 multicast egress + address reuse) and
# if-addrs (the chosen NIC's real link-local + index). Opt-in, so std hosts that don't
# want it never link either crate.
wifi-lan-auto = ["std-sync-host", "dep:socket2", "dep:if-addrs"]
# The RNS-parity TCP interface (TcpClientInterface / TcpServerInterface) on the reactor
# seam: tokio's own TCP plus socket2 for the reference's socket discipline (TCP_NODELAY,
# keepalive probes, user timeout). Opt-in, so tokio hosts that don't want TCP never link
# socket2.
tcp = ["tokio-host", "dep:socket2", "tokio/net"]
# The RNS-parity UDP interface (UDPInterface) on the reactor seam: one raw wire packet
# per datagram, fixed peer addressing, tokio's own UDP — no extra socket crate needed.
udp = ["tokio-host", "tokio/net"]
stream-compression = ["std"]
bridge-bin = ["std", "dep:serde", "dep:serde_json"]
differential-coverage = ["std"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# Crypto: no_std, no internal RNG (entropy is supplied as data by the host),
# so these must build alloc-free
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
hkdf = { version = "0.12", default-features = false }
aes = { version = "0.8", default-features = false }
cbc = { version = "0.1", default-features = false, features = ["block-padding"] }
ed25519-dalek = { version = "2", default-features = false, features = ["zeroize", "fast"] }
x25519-dalek = { version = "2", default-features = false, features = ["precomputed-tables", "static_secrets"] }
zeroize = { version = "1", default-features = false, features = ["derive"] }

# Fixed-capacity collections for retained engine state (alloc-free, inline storage)
heapless = { version = "0.8", default-features = false }

# Stable backport of the nightly `allocator_api` (`Allocator` + allocator-aware
# `Box`/`Vec`), under `external-alloc` only. Lets the fixed-heap columns be generic over
# the allocator — `Global` on a host, esp-alloc's `ExternalMemory` (PSRAM) on the S3.
# Version-matched to what esp-alloc 0.10 carries.
allocator-api2 = { version = "0.3", optional = true, default-features = false, features = ["alloc"] }

# OS CSPRNG for the std host catalogue (LinuxSync, under `std-sync-host`). The no_std
# core never sees an RNG — entropy is data the host supplies — so this is optional
# and only the host layer pulls it in.
getrandom = { version = "0.2", optional = true }

# Lock-free SPSC ring backing the std worker seam (under `std-sync-host`): owned, Send,
# freed on drop. The std-native replacement for a leaked `heapless::spsc` — that's
# an embedded static-storage primitive with no business on a heap-backed host.
rtrb = { version = "0.3", optional = true }

# Async runtime for the `tokio-host` seam: `sync` for the Notify wakers that
# cross it, `time` for the host's deadline waits, `macros` for the reactor's
# `select!` over its three inputs. Workers bring their own I/O features; the seam
# itself needs no runtime flavor.
tokio = { version = "1", optional = true, default-features = false, features = ["rt", "macros", "sync", "time", "io-util"] }

# The USB-auto host interface's portable USB-serial layer (under `usb-auto`):
# enumerate, open, and raw byte I/O on Linux/macOS/Windows. Default features keep
# enumeration (libudev on Linux, IOKit/SetupAPI elsewhere — serialport cfg-gates
# its own per-OS backends).
serialport = { version = "4", optional = true }
# Readiness-driven I/O for the USB-auto host worker (under `usb-auto`): one
# `mio::Poll` over every open serial fd plus a `Waker` the runtime pokes on egress,
# so the worker blocks until a port is readable or the engine has a packet to send —
# no self-clocked polling. `mio-serial` adapts `serialport` ports into `mio` sources.
mio = { version = "1", optional = true, features = ["os-poll", "os-ext"] }
mio-serial = { version = "5", optional = true }

# The WiFi/LAN auto-interface's socket layer (under `wifi-lan-auto`): IPv6 multicast
# egress (`IPV6_MULTICAST_IF`) plus `SO_REUSEADDR`/`SO_REUSEPORT` set before bind —
# none of which `std::net::UdpSocket` exposes. Thin libc/winsock wrapper, no_std-free.
socket2 = { version = "0.6", optional = true, features = ["all"] }
# Interface enumeration for the WiFi/LAN auto-interface (under `wifi-lan-auto`): the
# chosen NIC's real `fe80::` link-local and its interface index. The peering token must
# hash over the address peers actually see as our source, so a synthesized one won't do.
if-addrs = { version = "0.13", optional = true }

# Embassy stack for the embassy WiFi worker shells. Optional + version-matched
# to the ESP hosts (embassy-net 0.9.1 / esp-rtos 0.3 both pin embassy-sync 0.8),
# so enabling the feature adds no redundant copy. Never built by the core gates.
embassy-net = { version = "0.9.1", optional = true, default-features = false, features = ["udp", "proto-ipv6", "medium-ethernet", "multicast"] }
embassy-sync = { version = "0.8.0", optional = true, default-features = false }
embassy-time = { version = "0.5", optional = true, default-features = false }
# Once-take promotion of the outbound grant ring's backing buffer to `'static`
# (`zerocopy_channel::Channel::new` borrows its slots). Version-matched to what
# every embedded host already carries.
static_cell = { version = "2", optional = true }
embassy-futures = { version = "0.1", optional = true, default-features = false }
# Async byte-stream traits for serial-style worker shells — lets the shell stay
# hardware-agnostic (the host hands it any `Read`/`Write`, e.g. esp-hal's
# usb-serial-jtag halves) so `personal-rns` never depends on a specific HAL.
# 0.6 matches what esp-hal 1.1 implements for its serial peripherals.
embedded-io-async = { version = "0.6", optional = true, default-features = false }
# Logging facade for the worker shells — the host installs the sink (esp-println).
log = { version = "0.4", optional = true, default-features = false }
# Real u64 atomics on the 32-bit embedded targets: neither the esp32s3 (xtensa) nor riscv32
# has a native 64-bit atomic, so the interface-status byte counters would otherwise cap at a
# u32's 4 GiB. portable-atomic emulates them through critical-section (esp-hal supplies the
# impl in the firmware binary; native on the host), keeping the counters true u64.
portable-atomic = { version = "1", optional = true, default-features = false, features = ["critical-section"] }

[dev-dependencies]
proptest = "1"
# Host-side execution of the embassy seam + reactor tests (`--features
# embassy-contract`): a critical-section impl for the seam's mutex, and the std
# time driver so deadlines actually fire under `block_on`. Dev-only; cross-builds
# never see these.
critical-section = { version = "1", features = ["std"] }
embassy-time = { version = "0.5", default-features = false, features = ["std", "generic-queue-8"] }
# Executor + macros for the tokio seam's cross-task tests (`--features tokio-host`).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "test-util"] }

[lints]
workspace = true
