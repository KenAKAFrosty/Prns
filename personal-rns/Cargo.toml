[package]
name = "personal-rns"
version = "0.1.0"
edition = "2021"
description = "Pure Reticulum engine and wire contract for Personal Reticulum"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = ["std", "std-host"]
alloc = []
std = ["alloc"]
std-host = ["std", "dep:getrandom", "dep:rtrb"]
# Just the embassy primitives the contract seam needs (`embassy-sync` channels +
# `embassy-time` clock) — NOT `embassy-net`, so this builds on the host toolchain
# and the embassy seam is compile-checkable without an ESP cross-build. No alloc.
embassy-seam = ["dep:embassy-sync", "dep:embassy-time"]
# The embassy contract runtime for USB/serial-only boards (ESP32-C6, …): the channel
# seam + `embassy-futures` (select) + `embedded-io-async` (byte streams), enough for
# the serial worker (`serve`) and `EmbassyContractHost`, but NOT the WiFi/LoRa stack.
# Host-buildable (no embassy-net), so it compile-checks off-target. No alloc.
embassy-contract = ["embassy-seam", "dep:embassy-futures", "dep:embedded-io-async"]
# Embedded host shells that also run the WiFi/LoRa stack (ESP32-S3 heltec, …). Adds
# embassy-net + lora-phy on top of `embassy-contract`; OFF by default so the
# pure-no_std and no-std-esp-build gates never see it. An embedded host turns it on
# to get the radio worker shells (e.g. the AutoInterface). No alloc.
embassy-host = ["embassy-contract", "dep:embassy-net", "dep:lora-phy", "dep:log"]
stream-compression = ["std"]
bridge-bin = ["std", "dep:serde", "dep:serde_json"]
differential-coverage = ["std"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# Crypto: no_std, no internal RNG (entropy is supplied as data by the host),
# so these must build alloc-free
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
hkdf = { version = "0.12", default-features = false }
aes = { version = "0.8", default-features = false }
cbc = { version = "0.1", default-features = false, features = ["block-padding"] }
ed25519-dalek = { version = "2", default-features = false }
x25519-dalek = { version = "2", default-features = false }
zeroize = { version = "1", default-features = false, features = ["derive"] }

# Fixed-capacity collections for retained engine state (alloc-free, inline storage)
heapless = { version = "0.8", default-features = false }

# OS CSPRNG for the std host catalogue (LinuxSync, under `std-host`). The no_std
# core never sees an RNG — entropy is data the host supplies — so this is optional
# and only the host layer pulls it in.
getrandom = { version = "0.2", optional = true }

# Lock-free SPSC ring backing the std worker seam (under `std-host`): owned, Send,
# freed on drop. The std-native replacement for a leaked `heapless::spsc` — that's
# an embedded static-storage primitive with no business on a heap-backed host.
rtrb = { version = "0.3", optional = true }

# Embassy stack for the `embassy-host` worker shells. Optional + version-matched
# to the ESP hosts (embassy-net 0.9.1 / esp-rtos 0.3 both pin embassy-sync 0.8),
# so enabling the feature adds no redundant copy. Never built by the core gates.
embassy-net = { version = "0.9.1", optional = true, default-features = false, features = ["udp", "proto-ipv6", "medium-ethernet", "multicast"] }
embassy-sync = { version = "0.8.0", optional = true, default-features = false }
embassy-time = { version = "0.5", optional = true, default-features = false }
embassy-futures = { version = "0.1", optional = true, default-features = false }
# Async byte-stream traits for serial-style worker shells — lets the shell stay
# hardware-agnostic (the host hands it any `Read`/`Write`, e.g. esp-hal's
# usb-serial-jtag halves) so `personal-rns` never depends on a specific HAL.
# 0.6 matches what esp-hal 1.1 implements for its serial peripherals.
embedded-io-async = { version = "0.6", optional = true, default-features = false }
# LoRa PHY driver for the RNode-compatible LoRa worker shell. The host builds the
# `LoRa<RK, DLY>` (SX1262 + board InterfaceVariant) and hands it to the shell, so
# `personal-rns` names lora-phy but no specific radio HAL. no_std, async.
lora-phy = { version = "3.0.1", optional = true }
# Logging facade for the worker shells — the host installs the sink (esp-println).
log = { version = "0.4", optional = true, default-features = false }

[dev-dependencies]
proptest = "1"
# Host-only embassy test substrate — compiled for `cargo test`/bench but NEVER for
# `cargo build`, so the embedded gates and off-target cross-builds stay untouched.
# `mock-driver` registers a manually-advanced embassy-time clock, so the
# `EmbassyContractHost` wait race is tested *deterministically* (advance the clock,
# re-poll) rather than by wall-clock sleeps; `critical-section/std` provides the host
# critical-section impl that both the mock driver and the `WakeSignal` mutex need. On
# target, esp-hal supplies the real time driver and critical section instead.
# `generic-queue-8` makes the timer queue self-contained on the host (the default
# integrated queue wants an embassy-executor symbol the host test binary lacks).
embassy-time = { version = "0.5", default-features = false, features = ["mock-driver", "generic-queue-8"] }
critical-section = { version = "1", features = ["std"] }

[lints]
workspace = true
