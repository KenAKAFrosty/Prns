<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- dx fills this empty title from Dioxus.toml [web.app] title. -->
    <title></title>
    <meta name="description" content="A high-performance Rust port of Reticulum (RNS). A deterministic, no_std, alloc-free core, from a five-dollar microcontroller to a cloud server." />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="canonical" href="https://reticulum.rs/" />

    <!-- Open Graph (kept in static HTML so crawlers, which do not run wasm, can read it) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Prns" />
    <meta property="og:title" content="Prns: High performance Reticulum, built to run on any device" />
    <meta property="og:description" content="A deterministic, no_std, alloc-free core. From a five-dollar microcontroller to a cloud server." />
    <meta property="og:url" content="https://reticulum.rs/" />
    <meta property="og:image" content="https://reticulum.rs/assets/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Prns: a high-performance Reticulum in safe Rust, runs on many targets" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Prns: High performance Reticulum, built to run on any device" />
    <meta name="twitter:description" content="A deterministic, no_std, alloc-free core. From a five-dollar microcontroller to a cloud server." />
    <meta name="twitter:image" content="https://reticulum.rs/assets/og.png" />
  </head>
  <body>
    <div id="main"></div>
    <!-- Spotlight: track the pointer per-card so .spotlight::before can glow at
         the cursor. Delegated on window, so it covers wasm-rendered cards too. -->
    <script>
      addEventListener("pointermove", function (e) {
        var el = e.target && e.target.closest ? e.target.closest(".spotlight") : null;
        if (!el) return;
        var r = el.getBoundingClientRect();
        el.style.setProperty("--mx", (e.clientX - r.left) + "px");
        el.style.setProperty("--my", (e.clientY - r.top) + "px");
      }, { passive: true });

      // Scroll-reveal: add .is-visible as each .reveal enters the viewport. The
      // wasm renders cards after load, so a MutationObserver picks up new ones.
      // Under reduced-motion the CSS keeps .reveal visible, so we do nothing.
      (function () {
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (en) {
            if (en.isIntersecting) {
              en.target.classList.add("is-visible");
              io.unobserve(en.target);
            }
          });
        }, { rootMargin: "0px 0px 15% 0px", threshold: 0 });
        var pending = false;
        function scan() {
          pending = false;
          var nodes = document.querySelectorAll(".reveal:not([data-rev])");
          for (var i = 0; i < nodes.length; i++) {
            nodes[i].setAttribute("data-rev", "1");
            io.observe(nodes[i]);
          }
        }
        function schedule() {
          if (pending) return;
          pending = true;
          requestAnimationFrame(scan);
        }
        new MutationObserver(schedule).observe(document.documentElement, {
          childList: true,
          subtree: true,
        });
        schedule();
      })();
    </script>
  </body>
</html>
