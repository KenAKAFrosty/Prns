<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, noarchive">
    <title>Prns is coming soon</title>
    <meta name="description" content="Prns is preparing public docs for a high-performance Rust implementation of Reticulum.">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="canonical" href="https://prns.dev/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Prns">
    <meta property="og:title" content="Prns is coming soon">
    <meta property="og:description" content="Public docs for a high-performance Rust implementation of Reticulum are being staged.">
    <meta property="og:url" content="https://prns.dev/">
    <meta property="og:image" content="https://prns.dev/assets/og.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Prns is coming soon">
    <meta name="twitter:description" content="Public docs for a high-performance Rust implementation of Reticulum are being staged.">
    <meta name="twitter:image" content="https://prns.dev/assets/og.png">
    <style>
      :root {
        color-scheme: dark;
        --ink: #0b0e13;
        --paper: #f4f6fa;
        --soft: #a5acb8;
        --mid: #6c7480;
        --line: #1a1f28;
        --surface: #11151c;
        --layer: #161b24;
        --accent: #6ee7b7;
        --accent-strong: #34d399;
        --signal: #93c5fd;
        --warn: #fbbf24;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        background: var(--ink);
        color: var(--paper);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
        -webkit-font-smoothing: antialiased;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -2;
        background-image: url("/assets/prns-mark.svg");
        background-position: 76% 46%;
        background-repeat: no-repeat;
        background-size: 560px 560px;
        content: "";
        opacity: 0.16;
        -webkit-mask-image: radial-gradient(circle at 76% 46%, #000 0%, #000 26%, transparent 58%);
        mask-image: radial-gradient(circle at 76% 46%, #000 0%, #000 26%, transparent 58%);
      }

      body::after {
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
          linear-gradient(90deg, rgb(110 231 183 / 0.04) 1px, transparent 1px),
          linear-gradient(0deg, rgb(147 197 253 / 0.028) 1px, transparent 1px),
          rgb(11 14 19 / 0.86);
        background-size: 76px 76px, 76px 76px, auto;
        content: "";
      }

      .page {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        padding: 28px;
      }

      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        color: var(--paper);
        text-decoration: none;
      }

      .brand img {
        width: 34px;
        height: 34px;
        flex: 0 0 auto;
      }

      .brand-name {
        font-size: 1.08rem;
        font-weight: 700;
        line-height: 1;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        border: 1px solid rgb(110 231 183 / 0.22);
        border-radius: 999px;
        background: rgb(17 21 28 / 0.7);
        padding: 9px 14px;
        color: var(--soft);
        font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
        font-size: 0.78rem;
        line-height: 1;
        white-space: nowrap;
      }

      .status::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent-strong);
        box-shadow: 0 0 0 0 rgb(52 211 153 / 0.55);
        content: "";
        animation: beacon 2.8s ease-out infinite;
      }

      @keyframes beacon {
        0% { box-shadow: 0 0 0 0 rgb(52 211 153 / 0.55); }
        70% { box-shadow: 0 0 0 7px rgb(52 211 153 / 0); }
        100% { box-shadow: 0 0 0 0 rgb(52 211 153 / 0); }
      }

      .hero {
        display: grid;
        flex: 1;
        align-items: center;
        padding: 40px 0;
      }

      .hero-inner {
        width: min(100%, 1120px);
        margin: 0 auto;
      }

      .kicker {
        margin: 0 0 18px;
        color: var(--accent);
        font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
        font-size: 0.78rem;
        font-weight: 700;
        line-height: 1.5;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 820px;
        margin: 0;
        font-size: 3rem;
        font-weight: 620;
        line-height: 1.05;
        letter-spacing: -0.02em;
      }

      h1 .accent {
        color: var(--accent);
      }

      .lead {
        max-width: 620px;
        margin: 26px 0 0;
        color: var(--soft);
        font-size: 1.12rem;
        line-height: 1.7;
      }

      .repo-note {
        max-width: 620px;
        margin: 18px 0 0;
        color: var(--mid);
        font-size: 1rem;
        line-height: 1.6;
      }

      .repo-note a {
        border-bottom: 1px solid rgb(110 231 183 / 0.35);
        color: var(--accent);
        text-decoration: none;
        transition: border-color 0.15s ease;
      }

      .repo-note a:hover,
      .repo-note a:focus-visible {
        border-bottom-color: var(--accent-strong);
      }

      .launch-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 32px;
      }

      .pill {
        border: 1px solid rgb(244 246 250 / 0.12);
        border-radius: 8px;
        background: rgb(22 27 36 / 0.55);
        padding: 10px 13px;
        color: var(--soft);
        font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
        font-size: 0.82rem;
        line-height: 1;
      }

      .signal {
        position: relative;
        display: grid;
        grid-template-columns: repeat(14, 1fr);
        gap: 8px;
        max-width: 560px;
        margin-top: 48px;
      }

      .segment {
        height: 6px;
        border-radius: 8px;
        background: rgb(110 231 183 / 0.14);
        animation: carrier 2.6s ease-in-out infinite;
        animation-delay: calc(var(--i) * 0.11s);
      }

      @keyframes carrier {
        0%, 62%, 100% {
          background: rgb(110 231 183 / 0.14);
          box-shadow: none;
        }
        20% {
          background: var(--accent);
          box-shadow: 0 0 16px rgb(110 231 183 / 0.5);
        }
      }

      .footer {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 14px;
        border-top: 1px solid rgb(244 246 250 / 0.1);
        padding-top: 18px;
        color: var(--mid);
        font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
        font-size: 0.8rem;
      }

      .footer strong {
        color: var(--soft);
        font-weight: 500;
      }

      @media (min-width: 760px) {
        .page {
          padding: 38px 48px 30px;
        }

        h1 {
          font-size: 4.25rem;
        }

        .lead {
          font-size: 1.2rem;
        }
      }

      @media (max-width: 620px) {
        body::before {
          background-position: 84% 30%;
          background-size: 340px 340px;
          opacity: 0.12;
          -webkit-mask-image: radial-gradient(circle at 84% 30%, #000 0%, #000 24%, transparent 56%);
          mask-image: radial-gradient(circle at 84% 30%, #000 0%, #000 24%, transparent 56%);
        }

        .page {
          padding: 22px;
        }

        .nav {
          align-items: flex-start;
          flex-direction: column;
        }

        .hero {
          padding: 40px 0 32px;
        }

        h1 {
          font-size: 2.42rem;
        }

        .lead {
          font-size: 1.02rem;
        }

        .signal {
          margin-top: 38px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .status::before {
          animation: none;
        }

        .segment {
          animation: none;
        }

        .segment:nth-child(3n + 1) {
          background: rgb(110 231 183 / 0.34);
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <nav class="nav" aria-label="Site">
        <a class="brand" href="https://reticulum.rs/">
          <img src="/assets/prns-mark.svg" width="34" height="34" alt="Prns">
          <span class="brand-name">Prns</span>
        </a>
        <div class="status">Launching soon</div>
      </nav>
      <main class="hero">
        <section class="hero-inner" aria-labelledby="coming-soon-title">
          <p class="kicker">Mesh networking that's yours</p>
          <h1 id="coming-soon-title">Prns is<br><span class="accent">coming soon.</span></h1>
          <p class="lead">The public website is being prepared.<br>It lands here when Prns goes public.</p>
          <p class="repo-note">Can't wait? <a href="https://github.com/KenAKAFrosty/Prns">The source is already in the open on GitHub&nbsp;&rarr;</a></p>
          <div class="launch-strip" aria-label="Design principles">
            <span class="pill">Safe</span>
            <span class="pill">Robust</span>
            <span class="pill">Fast</span>
            <span class="pill">Any device</span>
          </div>
          <div class="signal" aria-hidden="true">
            <span class="segment" style="--i: 0"></span>
            <span class="segment" style="--i: 1"></span>
            <span class="segment" style="--i: 2"></span>
            <span class="segment" style="--i: 3"></span>
            <span class="segment" style="--i: 4"></span>
            <span class="segment" style="--i: 5"></span>
            <span class="segment" style="--i: 6"></span>
            <span class="segment" style="--i: 7"></span>
            <span class="segment" style="--i: 8"></span>
            <span class="segment" style="--i: 9"></span>
            <span class="segment" style="--i: 10"></span>
            <span class="segment" style="--i: 11"></span>
            <span class="segment" style="--i: 12"></span>
            <span class="segment" style="--i: 13"></span>
          </div>
        </section>
      </main>
      <footer class="footer">
        <span><strong>prns.dev &middot; reticulum.rs</strong> &middot; MIT / Apache 2.0</span>
      </footer>
    </div>
  </body>
</html>
