[application]
name = "reticulum-site"

[web.app]
title = "Reticulum in Rust — A production-grade port of RNS"

[web.resource]
# Inject the compiled Tailwind output into the initial HTML <head> so styling
# is present before the wasm boots; otherwise the page flashes unstyled.
style = ["./assets/tailwind.css"]
script = []

[web.resource.dev]
style = []
script = []

[web.watcher]
reload_html = true
watch_path = ["src", "content", "i18n", "assets"]
