[package]
name = "prns-lxmf-feature-consumer"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

# No dev-dependencies: test-host features must not unify into these graphs.
[workspace]
resolver = "3"

[features]
default = []
runtime = ["prns-lxmf/tokio-runtime"]
host = ["prns-lxmf/tokio-host"]

[dependencies]
prns-lxmf = { path = "../../..", default-features = false }
