[package]
name = "prns-lxmf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false
description = "Reusable caller-owned LXMF delivery service above Prns"

[features]
default = []
tokio-runtime = ["dep:personal-rns", "dep:tokio"]
tokio-host = ["tokio-runtime", "dep:prns-host", "dep:prns-host-runtime", "personal-rns/tokio-host"]

[dependencies]
prns-host = { path = "../../prns-host/core", optional = true }
prns-host-runtime = { path = "../../prns-host/impls/runtime", optional = true }
prns-lxmf-wire = { path = "../wire", default-features = false }
personal-rns = { path = "../../personal-rns", optional = true, default-features = false }
tokio = { version = "1", optional = true, default-features = false, features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
hex = "0.4"
personal-rns = { path = "../../personal-rns", default-features = false, features = ["tokio-host", "tcp"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }

[lib]
path = "src/lib.rs"

[[example]]
name = "live_tcp_peer"
required-features = ["tokio-host"]

[lints]
workspace = true
