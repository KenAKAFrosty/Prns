[package]
name = "git-over-rns"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
personal-rns = { path = "../../personal-rns", default-features = false, features = ["tokio-host", "wifi-lan-auto"] }
tokio = { version = "1", features = ["full"] }
# The host side of the USB auto-interface: serialport enumerates the CDC ports the
# discovery scan walks; tokio-serial opens each as an async stream.
tokio-serial = "5"
serialport = "4"

# Linux gets event-driven USB hot-plug via udev; other hosts lean on the auto
# interface's own fallback re-scan.
[target.'cfg(target_os = "linux")'.dependencies]
tokio-udev = "0.9"
tokio-stream = "0.1"

# Standalone on purpose: this is an example others can read and run, built on its
# own rather than as a member of the engine workspace, so it never taxes the core
# crate's CI gates (the same arrangement personal-rnsd uses).
[workspace]
