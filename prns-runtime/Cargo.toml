[package]
name = "prns-runtime"
version = "0.2.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "High-level Personal Reticulum runtime: Prns recipes, handles, and the tokio and embassy reactor bodies over prns-core"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
alloc = ["prns-core/alloc"]
external-alloc = ["alloc", "prns-core/external-alloc"]
std = ["alloc", "prns-core/std"]
# The tokio runtime lane: the `Prns` actor/handle bind, the request runner, and the
# tokio reactor body. Owns the async deps the engine-side `prns-core/tokio-host` gate
# deliberately does not pull.
tokio-host = ["std", "prns-core/tokio-host", "dep:tokio", "dep:futures-util", "dep:getrandom"]
# The embassy runtime lane for embedded boards: the embassy bind + reactor body over
# the core's channel seam. Host-buildable (no embassy-net), so it compile-checks
# off-target. No alloc.
embassy-host = ["prns-core/embassy-host", "dep:embassy-sync", "dep:embassy-time", "dep:embassy-futures", "dep:portable-atomic"]
# A debug-logging gate: pulls the `log` facade so the reactor can emit diagnostic traces
# on hosts that have a logger (the embedded esp-println one). Off in production builds.
log = ["dep:log"]

[dependencies]
prns-core = { path = "../prns-core", default-features = false }

# Fixed-capacity collections for the reactor's retained lane state (alloc-free, inline storage)
heapless = { version = "0.8", default-features = false }

# Async runtime for the `tokio-host` lane: `sync` for the Notify wakers that
# cross it, `time` for the host's deadline waits, `macros` for the reactor's
# `select!` over its three inputs. Workers bring their own I/O features; the seam
# itself needs no runtime flavor.
tokio = { version = "1", optional = true, default-features = false, features = ["rt", "macros", "sync", "time", "io-util"] }

# Cooperative multiplexer for the request runner (under `tokio-host`): `FuturesUnordered` drives
# every in-flight handler on the runner's single task, so a slow `async fn` yields to the others
# rather than blocking them — the cooperative concurrency the typed router promises. `alloc` is the
# only feature it needs; the crate owns the pin machinery our `deny(unsafe_code)` won't let us hand-roll.
futures-util = { version = "0.3", optional = true, default-features = false, features = ["alloc", "sink"] }

# OS CSPRNG for the tokio reactor's entropy fills. The no_std core never sees an RNG —
# entropy is data the host supplies — so this rides the host lane only.
getrandom = { version = "0.2", optional = true }

embassy-sync = { version = "0.8.0", optional = true, default-features = false }
embassy-time = { version = "0.5", optional = true, default-features = false }
embassy-futures = { version = "0.1", optional = true, default-features = false }
# Real u64 atomics on the 32-bit embedded targets: neither the esp32s3 (xtensa) nor riscv32
# has a native 64-bit atomic, so the interface-status byte counters would otherwise cap at a
# u32's 4 GiB. `critical-section` covers targets with no native CAS (esp-hal supplies the
# impl in the firmware binary); `fallback` covers targets that HAVE native CAS but only to
# 32 bits (riscv32imac), where critical-section is a no-op and u64 needs the seqlock.
portable-atomic = { version = "1", optional = true, default-features = false, features = ["critical-section", "fallback"] }
# Logging facade for the reactor shells — the host installs the sink (esp-println).
log = { version = "0.4", optional = true, default-features = false }

[dev-dependencies]
prns-core = { path = "../prns-core", default-features = false, features = ["test-support"] }
# Host-side execution of the embassy bind + reactor tests (`--features embassy-host`):
# a critical-section impl for the seam's mutex, and the std time driver so deadlines
# actually fire under `block_on`. Dev-only; cross-builds never see these.
critical-section = { version = "1", features = ["std"] }
embassy-time = { version = "0.5", default-features = false, features = ["std", "generic-queue-8"] }
# Executor + macros for the tokio bind's cross-task tests (`--features tokio-host`).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "test-util"] }

[lints]
workspace = true
