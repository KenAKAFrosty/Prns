[package]
name = "prns-runtime-embassy"
version = "0.3.7"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KenAKAFrosty/Prns"
homepage = "https://reticulum.rs"
rust-version = "1.90"
description = "Embassy host runtime for Personal Reticulum"
documentation = "https://docs.rs/prns-runtime-embassy"
readme = "README.md"
keywords = ["reticulum", "mesh", "networking", "embassy", "embedded"]
categories = ["network-programming", "embedded", "no-std"]
publish = true
include = ["src/**", "tests/**", "!tests/**/__pycache__/**", "!tests/**/*.pyc", "examples/**", "Cargo.toml", "README.md"]

[workspace]

[lib]
path = "src/lib.rs"

[features]
default = []
alloc = ["prns-runtime/alloc"]
rnx = ["alloc", "prns-runtime/rnx"]
external-alloc = ["alloc", "prns-runtime/external-alloc"]
std = ["alloc", "prns-runtime/std"]
log = ["dep:log"]
large-static-responses = ["prns-core/large-static-responses"]

[dependencies]
prns-core = { version = "=0.3.7", path = "../../../prns-core", default-features = false, features = ["embassy-host", "flash"] }
prns-runtime = { version = "=0.3.7", path = "../../core", default-features = false }
embassy-sync = { version = "0.8.0", default-features = false }
embassy-time = { version = "0.5", default-features = false }
embassy-futures = { version = "0.1", default-features = false }
portable-atomic = { version = "1", default-features = false, features = ["critical-section", "fallback"] }
heapless = { version = "0.8", default-features = false }
embedded-storage-async = { version = "0.4", default-features = false }
static_cell = "2.1"
log = { version = "0.4", optional = true, default-features = false }

[dev-dependencies]
prns-core = { version = "=0.3.7", path = "../../../prns-core", default-features = false, features = ["std", "embassy-host", "test-support", "flash"] }
embedded-storage = "0.3"
critical-section = { version = "1", features = ["std"] }
embassy-time = { version = "0.5", default-features = false, features = ["std", "generic-queue-8"] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
significant_drop_in_scrutinee = "warn"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[package.metadata.docs.rs]
all-features = true
