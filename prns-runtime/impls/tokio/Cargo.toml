[package]
name = "prns-runtime-tokio"
version = "0.2.4"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KenAKAFrosty/Prns"
homepage = "https://reticulum.rs"
rust-version = "1.90"
description = "Tokio host runtime for Personal Reticulum"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[features]
default = []
interface-discovery = ["prns-runtime/interface-discovery"]
interface-discovery-archive = ["interface-discovery", "prns-runtime/interface-discovery-archive"]
runtime-metrics = ["prns-core/runtime-metrics", "prns-runtime/runtime-metrics"]
rns-management = ["prns-runtime/rns-management"]
parallel-persistence = ["prns-core/parallel-persistence"]
tracing = ["dep:tracing"]

[dependencies]
prns-core = { path = "../../../prns-core", default-features = false, features = ["tokio-host"] }
prns-runtime = { path = "../../core", default-features = false, features = ["std"] }
heapless = { version = "0.8", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time", "io-util"] }
rtrb = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["alloc", "sink"] }
getrandom = { version = "0.2" }
bzip2 = { version = "0.6" }
tracing = { version = "0.1", optional = true, default-features = false, features = ["std", "attributes"] }

[dev-dependencies]
prns-core = { path = "../../../prns-core", default-features = false, features = ["test-support"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "test-util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
significant_drop_in_scrutinee = "warn"
