name: publish signed website to Cloudflare

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact promoted stable flasher version
        required: true
        type: string
      release_record_sha256:
        description: SHA-256 of the signed flasher release record
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prns-site-preview
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_RECORD_SHA256: ${{ inputs.release_record_sha256 }}
  WRANGLER_VERSION: 4.118.0
  CLOUDFLARE_SITE_HOST: prns.dev

jobs:
  deploy:
    name: Deploy the exact promoted website to prns.dev
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Resolve the Pages project that owns the public domain
        id: cloudflare-target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          host = os.environ["CLOUDFLARE_SITE_HOST"]
          matches = []
          page_size = 10
          page = 1
          while True:
              request = Request(
                  f"https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects?page={page}&per_page={page_size}",
                  headers={
                      "Authorization": f"Bearer {os.environ['CLOUDFLARE_API_TOKEN']}",
                      "User-Agent": "prns-release-deploy/1",
                  },
              )
              try:
                  with urlopen(request, timeout=30) as response:
                      payload = json.load(response)
              except HTTPError as error:
                  failure = json.load(error)
                  raise SystemExit(
                      f"Cloudflare Pages discovery failed (HTTP {error.code}): {json.dumps(failure['errors'])}"
                  ) from None
              if payload["success"] is not True:
                  raise SystemExit("Cloudflare Pages project discovery failed")
              matches.extend(project for project in payload["result"] if host in project["domains"])
              if len(payload["result"]) < page_size:
                  break
              page += 1
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one Pages project for {host}; found {len(matches)}")
          project = matches[0]
          outputs = {"project": project["name"], "branch": project["production_branch"]}
          for name, value in outputs.items():
              if not isinstance(value, str) or not value or "\n" in value or "\r" in value:
                  raise SystemExit(f"Invalid Cloudflare Pages {name}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              for name, value in outputs.items():
                  output.write(f"{name}={value}\n")
          print(f"Deploying {host} through Pages project {outputs['project']} on branch {outputs['branch']}")
          PYTHON
      - name: Download the exact promoted stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          test "$GITHUB_REF" = "refs/heads/${default_branch}"
          [[ "$RELEASE_VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]
          test "${RELEASE_VERSION,,}" != next
          [[ "$RELEASE_RECORD_SHA256" =~ ^[0-9a-f]{64}$ ]]
          mkdir -p target/cloudflare-release
          gh release view "v${RELEASE_VERSION}" --json isDraft,isPrerelease,tagName \
            > target/cloudflare-release/release.json
          jq -e --arg tag "v${RELEASE_VERSION}" \
            '.isDraft == false and .isPrerelease == false and .tagName == $tag' \
            target/cloudflare-release/release.json
          gh release download "v${RELEASE_VERSION}" --dir target/cloudflare-release \
            --pattern "flasher-release-record-v${RELEASE_VERSION}.json" \
            --pattern "flasher-release-record-v${RELEASE_VERSION}.json.minisig" \
            --pattern "prns-flasher-candidate-v${RELEASE_VERSION}-signed.tar.gz"
      - name: Verify signed custody and stage the complete website
        run: |
          ./tools/prns release toolchain minisign install -- "${RUNNER_TEMP}/prns-release-bin"
          record="target/cloudflare-release/flasher-release-record-v${RELEASE_VERSION}.json"
          bundle="target/cloudflare-release/prns-flasher-candidate-v${RELEASE_VERSION}-signed.tar.gz"
          test "$(sha256sum "$record" | awk '{print $1}')" = "$RELEASE_RECORD_SHA256"
          "${RUNNER_TEMP}/prns-release-bin/minisign" -Vm "$record" \
            -x "$record.minisig" -p release/keys/minisign.pub
          test "$(jq -r '.candidate.archive.name' "$record")" = "$(basename "$bundle")"
          test "$(sha256sum "$bundle" | awk '{print $1}')" = \
            "$(jq -r '.candidate.archive.sha256' "$record")"
          ./tools/prns release candidate extract -- "$bundle" target/cloudflare-candidate
          ./tools/prns release rollback -- stage \
            --candidate target/cloudflare-candidate \
            --release-record "$record" \
            --release-record-sha256 "$RELEASE_RECORD_SHA256" \
            --version "$RELEASE_VERSION" \
            --output target/cloudflare-website \
            --identity-output target/cloudflare-stage.json
          for asset in stable.json stable.json.minisig; do
            curl --fail --location --retry 5 --retry-all-errors \
              --header 'Cache-Control: no-cache' \
              --output "target/cloudflare-release/$asset" \
              "https://reticulum.rs/releases/channels/$asset?cloudflare=${GITHUB_RUN_ID}"
            cmp "target/cloudflare-release/$asset" \
              "target/cloudflare-website/releases/channels/$asset"
          done
      - name: Keep source links available within the Cloudflare Pages file limit
        run: |
          test ! -e target/cloudflare-website/_redirects
          test -d target/cloudflare-website/api/src
          rm -rf target/cloudflare-website/api/src
          printf '%s\n' '/api/src/* https://reticulum.rs/api/src/:splat 302' \
            > target/cloudflare-website/_redirects
          test "$(find target/cloudflare-website -type f | wc -l)" -le 20000
      - name: Deploy the signed website using the existing Cloudflare credentials
        env:
          CLOUDFLARE_PAGES_PROJECT: ${{ steps.cloudflare-target.outputs.project }}
          CLOUDFLARE_PRODUCTION_BRANCH: ${{ steps.cloudflare-target.outputs.branch }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          record="target/cloudflare-release/flasher-release-record-v${RELEASE_VERSION}.json"
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy target/cloudflare-website \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "$CLOUDFLARE_PRODUCTION_BRANCH" \
            --commit-hash "$(jq -r '.release.source_commit' "$record")" \
            --commit-dirty=false
      - name: Verify the complete deployed website
        run: |
          ./tools/prns release rollback -- verify-live-website \
            --stage-identity target/cloudflare-stage.json \
            --site-url "https://${CLOUDFLARE_SITE_HOST}"
