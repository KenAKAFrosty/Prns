name: deep-validation

on:
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: Seconds per fuzz target
        default: "30"
        required: true
  schedule:
    - cron: "17 9 1 * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings --cfg aes_armv8"

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      kani: ${{ steps.matrix.outputs.kani }}
      fuzz: ${{ steps.matrix.outputs.fuzz }}
      oracles: ${{ steps.matrix.outputs.oracles }}
      interop: ${{ steps.matrix.outputs.interop }}
      hardening: ${{ steps.matrix.outputs.hardening }}
      embedded_resources: ${{ steps.matrix.outputs.embedded_resources }}
      tier: ${{ steps.matrix.outputs.tier }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: matrix
        env:
          VALIDATION_TIER: ${{ github.event_name == 'schedule' && 'scheduled' || 'release' }}
        run: |
          python3 validation/run.py verify
          echo "tier=$VALIDATION_TIER" >> "$GITHUB_OUTPUT"
          echo "kani=$(python3 validation/run.py matrix --domain kani --tier "$VALIDATION_TIER")" >> "$GITHUB_OUTPUT"
          echo "fuzz=$(python3 validation/run.py matrix --domain fuzz --tier "$VALIDATION_TIER")" >> "$GITHUB_OUTPUT"
          echo "oracles=$(python3 validation/run.py matrix --domain oracles --tier "$VALIDATION_TIER")" >> "$GITHUB_OUTPUT"
          echo "interop=$(python3 validation/run.py matrix --domain interop --tier "$VALIDATION_TIER")" >> "$GITHUB_OUTPUT"
          echo "hardening=$(python3 validation/run.py matrix --domain hardening --tier "$VALIDATION_TIER")" >> "$GITHUB_OUTPUT"
          echo "embedded_resources=$(python3 validation/run.py matrix --suite embedded-builds --suite esp32-firmware-check --tier "$VALIDATION_TIER")" >> "$GITHUB_OUTPUT"

  embedded-emulators:
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install emulator build and runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libgcrypt20 libglib2.0-dev libpixman-1-dev libsdl2-2.0-0 libslirp0 ninja-build pkg-config python3-setuptools python3-venv xz-utils
      - name: Prepare the complete contract-pinned emulator set
        run: |
          python3 validation/run.py prepare-embedded-assurance \
            --root "${RUNNER_TEMP}/prns-embedded-assurance" \
            --suite embedded-isa-thumbv7em \
            --suite embedded-isa-riscv32imac \
            --suite embedded-isa-xtensa-esp32s3 \
            --suite embedded-platform-nrf52840
          tar -cJf "${RUNNER_TEMP}/prns-embedded-assurance.tar.xz" \
            -C "${RUNNER_TEMP}/prns-embedded-assurance" builds packages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deep-assurance-runners-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/prns-embedded-assurance.tar.xz

  embedded-resources:
    needs: inventory
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.inventory.outputs.embedded_resources) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.0
          components: llvm-tools-preview
          targets: riscv32imac-unknown-none-elf,thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: deep-resources-${{ matrix.id }}
      - name: Install exact ESP compiler and tools
        if: matrix.toolchain == 'esp'
        run: ./tools/prns release toolchain esp install -- "${RUNNER_TEMP}/prns-esp-tools"
      - run: python3 validation/run.py run --suite "${{ matrix.id }}" --expected-sha "$GITHUB_SHA"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deep-resource-${{ matrix.id }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: |
            target/flash-artifacts/resources/configured/reports/*.json
            target/flash-artifacts/resources/configured/work/*/linker.map
            target/flash-artifacts/resources/configured/work/*/function-boundaries.json
            target/flash-artifacts/resources/configured/work/*/stack-evidence.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deep-${{ matrix.id }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: validation-artifacts/results

  kani:
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.inventory.outputs.kani) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: deep-kani-${{ matrix.group }}
      - run: cargo install kani-verifier --version 0.67.0 --locked
      - run: cargo kani setup
      - run: python3 validation/run.py run --suite "${{ matrix.id }}" --expected-sha "$GITHUB_SHA"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deep-${{ matrix.id }}-${{ github.run_id }}
          path: validation-artifacts/results/${{ matrix.id }}/**
          retention-days: 7

  fuzz:
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.inventory.outputs.fuzz) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: toolchain
        run: echo "nightly=$(python3 validation/run.py toolchain nightly)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ steps.toolchain.outputs.nightly }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: deep-fuzz
      - run: cargo install cargo-fuzz --version 0.13.1 --locked
      - run: python3 validation/run.py run --suite "${{ matrix.id }}" --expected-sha "$GITHUB_SHA" --fuzz-seconds "${{ github.event_name == 'schedule' && '120' || inputs.fuzz_seconds }}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deep-${{ matrix.id }}-${{ github.run_id }}
          retention-days: 7
          path: |
            validation-artifacts/results/${{ matrix.id }}/**
            validation-artifacts/fuzz/**
            validation-artifacts/fuzz-corpus/**

  oracles:
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.inventory.outputs.oracles) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: python3 validation/run.py prepare-oracles
      - run: python3 validation/run.py run --suite "${{ matrix.id }}" --expected-sha "$GITHUB_SHA"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deep-${{ matrix.id }}-${{ github.run_id }}
          path: validation-artifacts/results/${{ matrix.id }}/**
          retention-days: 7

  interop:
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.inventory.outputs.interop) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: python3 validation/run.py prepare-oracles
      - run: python3 validation/run.py run --suite "${{ matrix.id }}" --expected-sha "$GITHUB_SHA"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deep-${{ matrix.id }}-${{ github.run_id }}
          path: validation-artifacts/results/${{ matrix.id }}/**
          retention-days: 7

  hardening:
    needs: [inventory, embedded-emulators]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.inventory.outputs.hardening) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: toolchain
        run: echo "nightly=$(python3 validation/run.py toolchain nightly)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ steps.toolchain.outputs.nightly }}
          components: miri,rust-src,llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: deep-${{ matrix.id }}
      - name: Install embedded compiler targets
        if: matrix.group == 'embedded-isa' || matrix.group == 'embedded-platform'
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup target add --toolchain 1.96.0 riscv32imac-unknown-none-elf thumbv7em-none-eabihf
      - name: Install embedded emulator runtime dependencies
        if: matrix.group == 'embedded-isa' || matrix.group == 'embedded-platform'
        run: sudo apt-get update && sudo apt-get install -y libgcrypt20 libglib2.0-0 libpixman-1-0 libsdl2-2.0-0 libslirp0
      - name: Install exact ESP compiler and tools
        if: matrix.toolchain == 'esp'
        run: ./tools/prns release toolchain esp install -- "${RUNNER_TEMP}/prns-esp-tools"
      - name: Restore exact embedded assurance emulators
        if: matrix.group == 'embedded-isa' || matrix.group == 'embedded-platform'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: deep-assurance-runners-${{ github.run_id }}
          path: ${{ runner.temp }}
      - name: Extract exact embedded assurance emulators
        if: matrix.group == 'embedded-isa' || matrix.group == 'embedded-platform'
        run: |
          mkdir -p "${RUNNER_TEMP}/prns-embedded-assurance"
          tar -xJf "${RUNNER_TEMP}/prns-embedded-assurance.tar.xz" \
            -C "${RUNNER_TEMP}/prns-embedded-assurance"
      - name: Activate exact embedded assurance emulator
        if: matrix.group == 'embedded-isa' || matrix.group == 'embedded-platform'
        run: |
          python3 validation/run.py prepare-embedded-assurance \
            --root "${RUNNER_TEMP}/prns-embedded-assurance" \
            --suite "${{ matrix.id }}"
          echo "${RUNNER_TEMP}/prns-embedded-assurance/bin" >> "$GITHUB_PATH"
      - run: python3 validation/run.py run --suite "${{ matrix.id }}" --expected-sha "$GITHUB_SHA"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deep-${{ matrix.id }}-${{ github.run_id }}
          path: validation-artifacts/results
          retention-days: 7

  embedded-assurance:
    if: always()
    needs: [inventory, embedded-resources, hardening]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: deep-embedded-assurance
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: deep-resource-*-${{ github.run_id }}
          path: target/flash-artifacts/assurance/resources
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: deep-embedded-*-${{ github.run_id }}
          path: validation-artifacts/results
          merge-multiple: true
      - name: Require every embedded proof attempt
        env:
          VALIDATION_TIER: ${{ needs.inventory.outputs.tier }}
        run: |
          python3 validation/run.py aggregate \
            --tier "$VALIDATION_TIER" \
            --domain hardening \
            --suite embedded-isa-thumbv7em \
            --suite embedded-isa-riscv32imac \
            --suite embedded-isa-xtensa-esp32s3 \
            --suite embedded-miri-full \
            --suite embedded-platform-nrf52840 \
            --suite embedded-platform-esp32s3 \
            --expected-sha "$GITHUB_SHA"
      - name: Compose complete scheduled embedded assurance
        run: |
          ./tools/prns build embedded assurance summarize \
            --resources target/flash-artifacts/assurance/resources \
            --proofs validation-artifacts/results \
            --output target/flash-artifacts/assurance/matrix
      - name: Publish embedded assurance matrix to the job summary
        run: cat target/flash-artifacts/assurance/matrix/matrix.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deep-embedded-assurance-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: target/flash-artifacts/assurance/matrix/*

  deep-validation:
    name: Deep validation
    if: always()
    needs: [kani, fuzz, oracles, interop, hardening, embedded-resources, embedded-assurance]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      KANI_RESULT: ${{ needs.kani.result }}
      FUZZ_RESULT: ${{ needs.fuzz.result }}
      ORACLES_RESULT: ${{ needs.oracles.result }}
      INTEROP_RESULT: ${{ needs.interop.result }}
      HARDENING_RESULT: ${{ needs.hardening.result }}
      EMBEDDED_RESOURCES_RESULT: ${{ needs.embedded-resources.result }}
      EMBEDDED_ASSURANCE_RESULT: ${{ needs.embedded-assurance.result }}
    steps:
      - run: |
          for result in "$KANI_RESULT" "$FUZZ_RESULT" "$ORACLES_RESULT" "$INTEROP_RESULT" "$HARDENING_RESULT" "$EMBEDDED_RESOURCES_RESULT" "$EMBEDDED_ASSURANCE_RESULT"; do
            test "$result" = success
          done
