name: reticulum.rs site

on:
  workflow_dispatch:

# Allow one concurrent deploy; cancel in-flight runs on new pushes.
concurrency:
  group: prns-public-pages
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: vars.PRNS_PUBLIC_SITE_PROMOTED != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false

      - name: Assemble coming soon site
        run: |
          set -euo pipefail
          DIST=docs/website/target/site-coming-soon
          mkdir -p "$DIST/assets"
          cp docs/website/coming-soon/index.html "$DIST/index.html"
          cp docs/website/coming-soon/index.html "$DIST/404.html"
          cp docs/website/public/CNAME "$DIST/CNAME"
          cp docs/website/public/assets/favicon.svg "$DIST/assets/favicon.svg"
          cp docs/website/public/assets/prns-mark.svg "$DIST/assets/prns-mark.svg"
          cp docs/website/public/assets/og.png "$DIST/assets/og.png"
          echo "Dist contents:"
          ls -la "$DIST"

      - name: Upload coming soon Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: docs/website/target/site-coming-soon

  deploy:
    needs: build
    if: needs.build.result == 'success' && vars.PRNS_PUBLIC_SITE_PROMOTED != 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install exact Minisign verifier
        run: ./tools/prns release toolchain minisign install -- "${RUNNER_TEMP}/prns-release-bin"
      - name: Refuse to overwrite any live signed stable channel
        id: custody
        env:
          GH_TOKEN: ${{ github.token }}
          PRNS_MINISIGN_BIN: ${{ runner.temp }}/prns-release-bin/minisign
        run: |
          mkdir -p target/live-site-custody
          if [[ "$(gh variable get PRNS_PUBLIC_SITE_PROMOTED 2>/dev/null || true)" == true ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cache_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl --fail --location --retry 5 --retry-all-errors \
            --header 'Cache-Control: no-cache' \
            --output target/live-site-custody/stable.json \
            "https://reticulum.rs/releases/channels/stable.json?custody=${cache_key}"
          set +e
          ./tools/prns release website-history -- probe-stable \
            --descriptor target/live-site-custody/stable.json
          probe_status="$?"
          set -e
          case "$probe_status" in
            0)
              curl --fail --location --retry 5 --retry-all-errors \
                --header 'Cache-Control: no-cache' \
                --output target/live-site-custody/stable.json.minisig \
                "https://reticulum.rs/releases/channels/stable.json.minisig?custody=${cache_key}"
              "$PRNS_MINISIGN_BIN" -Vm target/live-site-custody/stable.json \
                -x target/live-site-custody/stable.json.minisig \
                -p release/keys/minisign.pub
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              ;;
            1)
              cmp target/live-site-custody/stable.json \
                docs/website/coming-soon/index.html
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              ;;
            *) exit "$probe_status" ;;
          esac
      - name: Deploy to GitHub Pages
        if: steps.custody.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
