name: promote signed flasher release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact VERSION without a v prefix
        required: true
        type: string
      release_record_sha256:
        description: Lowercase SHA-256 of the signed release-record asset
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prns-public-pages
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  EXPECTED_RELEASE_RECORD_SHA256: ${{ inputs.release_record_sha256 }}
  RUSTUP_TOOLCHAIN: 1.96.0

jobs:
  verify:
    runs-on: ubuntu-24.04
    environment: public-release
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: flasher-promotion
          cache-targets: false
      - name: Confirm default-branch custody and install exact Minisign verifier
        id: repository
        run: |
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          test "$GITHUB_REF" = "refs/heads/${default_branch}"
          echo "default_branch=$default_branch" >> "$GITHUB_OUTPUT"
          scripts/install-release-minisign.sh "${RUNNER_TEMP}/prns-release-bin"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download exact prerelease custody assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/release
          [[ "$RELEASE_VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]
          test "${RELEASE_VERSION,,}" != "next"
          gh release download "v${RELEASE_VERSION}" \
            --pattern "prns-flasher-candidate-v${RELEASE_VERSION}-signed.tar.gz" \
            --pattern "prns-flasher-candidate-run-v${RELEASE_VERSION}.json" \
            --pattern "prns-flasher-attestation-v${RELEASE_VERSION}.json" \
            --pattern "prns-flasher-attestation-v${RELEASE_VERSION}.metadata.json" \
            --pattern "acceptance-v${RELEASE_VERSION}.json" \
            --pattern "acceptance-v${RELEASE_VERSION}.json.minisig" \
            --pattern "release-record-v${RELEASE_VERSION}.json" \
            --pattern "release-record-v${RELEASE_VERSION}.json.minisig" \
            --dir target/release
      - name: Bind promotion to the reviewed release record
        run: |
          [[ "$EXPECTED_RELEASE_RECORD_SHA256" =~ ^[0-9a-f]{64}$ ]]
          record="target/release/release-record-v${RELEASE_VERSION}.json"
          test "$(sha256sum "$record" | awk '{print $1}')" = "$EXPECTED_RELEASE_RECORD_SHA256"
      - name: Extract exact signed candidate
        run: |
          python3 scripts/extract-flasher-candidate.py \
            "target/release/prns-flasher-candidate-v${RELEASE_VERSION}-signed.tar.gz" \
            target/signed-candidate
      - name: Verify signatures, hashes, provenance, hardware evidence, and release record
        env:
          DEFAULT_BRANCH: ${{ steps.repository.outputs.default_branch }}
          PRNS_MINISIGN_BIN: ${{ runner.temp }}/prns-release-bin/minisign
        run: |
          record="target/release/release-record-v${RELEASE_VERSION}.json"
          acceptance_commit="$(jq -r '.acceptance.source_commit' "$record")"
          source_commit="$(jq -r '.release.source_commit' "$record")"
          git merge-base --is-ancestor "$source_commit" \
            "origin/${DEFAULT_BRANCH}"
          git merge-base --is-ancestor "$acceptance_commit" \
            "origin/${DEFAULT_BRANCH}"
          scripts/verify-flasher-release.sh \
            --candidate target/signed-candidate \
            --candidate-run "target/release/prns-flasher-candidate-run-v${RELEASE_VERSION}.json" \
            --signed-bundle "target/release/prns-flasher-candidate-v${RELEASE_VERSION}-signed.tar.gz" \
            --acceptance "target/release/acceptance-v${RELEASE_VERSION}.json" \
            --acceptance-source-commit "$acceptance_commit" \
            --release-record "$record" \
            --attestation-bundle "target/release/prns-flasher-attestation-v${RELEASE_VERSION}.json" \
            --attestation-metadata "target/release/prns-flasher-attestation-v${RELEASE_VERSION}.metadata.json" \
            --repository "$GITHUB_REPOSITORY"
      - name: Verify GitHub attestations for every published binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundle="target/release/prns-flasher-attestation-v${RELEASE_VERSION}.json"
          signer_workflow="$GITHUB_REPOSITORY/.github/workflows/flasher-sign.yml"
          gh attestation verify \
            "target/release/prns-flasher-candidate-v${RELEASE_VERSION}-signed.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$bundle" \
            --signer-workflow "$signer_workflow" \
            --deny-self-hosted-runners
          for archive in target/signed-candidate/cli/hopspot-flash-*; do
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$bundle" \
              --signer-workflow "$signer_workflow" \
              --deny-self-hosted-runners
          done
          while IFS= read -r relative; do
            gh attestation verify "target/signed-candidate/$relative" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$bundle" \
              --signer-workflow "$signer_workflow" \
              --deny-self-hosted-runners
          done < <(jq -r '[.targets[].parts[].path] | unique[]' target/signed-candidate/flash-manifest.json)
      - name: Confirm stable channel, source commit, and public review interval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          record="target/release/release-record-v${RELEASE_VERSION}.json"
          source_commit="$(jq -r '.release.source_commit' "$record")"
          test "$(cat VERSION)" = "$RELEASE_VERSION"
          test -f "target/signed-candidate/channels/stable.json"
          gh release view "v${RELEASE_VERSION}" \
            --json isDraft,isPrerelease,publishedAt,tagName,targetCommitish \
            > "${RUNNER_TEMP}/prerelease.json"
          python3 scripts/validate-flasher-prerelease.py \
            --release-json "${RUNNER_TEMP}/prerelease.json" \
            --version "$RELEASE_VERSION" \
            --source-commit "$source_commit" \
            --minimum-hours 24 \
            --allow-promoted
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: target/signed-candidate/website

  publish-release:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Mark the verified prerelease stable without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "v${RELEASE_VERSION}" --prerelease=false --latest=true

  deploy-stable-site:
    needs: [verify, publish-release]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact signed website bundle with the stable descriptor last
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  post-promotion-smoke:
    name: Post-promotion signed channel and installer smoke
    needs: [verify, publish-release, deploy-stable-site]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      SITE_URL: ${{ needs.deploy-stable-site.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.0
      - name: Fetch and reverify the complete public release under read-only permissions
        env:
          GH_TOKEN: ${{ github.token }}
          PRNS_MINISIGN_BIN: ${{ runner.temp }}/prns-release-bin/minisign
        run: |
          scripts/install-release-minisign.sh "${RUNNER_TEMP}/prns-release-bin"
          mkdir -p target/post-promotion/release-assets
          gh release download "v${RELEASE_VERSION}" \
            --dir target/post-promotion/release-assets
          bundle="target/post-promotion/release-assets/prns-flasher-candidate-v${RELEASE_VERSION}-signed.tar.gz"
          python3 scripts/extract-flasher-candidate.py \
            "$bundle" \
            target/post-promotion/candidate
          record="target/post-promotion/release-assets/release-record-v${RELEASE_VERSION}.json"
          acceptance_commit="$(jq -r '.acceptance.source_commit' "$record")"
          scripts/verify-flasher-release.sh \
            --candidate target/post-promotion/candidate \
            --candidate-run "target/post-promotion/release-assets/prns-flasher-candidate-run-v${RELEASE_VERSION}.json" \
            --signed-bundle "$bundle" \
            --acceptance "target/post-promotion/release-assets/acceptance-v${RELEASE_VERSION}.json" \
            --acceptance-source-commit "$acceptance_commit" \
            --release-record "$record" \
            --attestation-bundle "target/post-promotion/release-assets/prns-flasher-attestation-v${RELEASE_VERSION}.json" \
            --attestation-metadata "target/post-promotion/release-assets/prns-flasher-attestation-v${RELEASE_VERSION}.metadata.json" \
            --repository "$GITHUB_REPOSITORY"
          python3 scripts/verify-flasher-release-assets.py \
            --candidate target/post-promotion/candidate \
            --assets target/post-promotion/release-assets \
            --version "$RELEASE_VERSION"
      - name: Fetch and verify the live signed channel, manifest, website, and firmware
        env:
          PRNS_MINISIGN_BIN: ${{ runner.temp }}/prns-release-bin/minisign
        run: |
          site_root="${SITE_URL%/}"
          test -n "$site_root"
          live="target/post-promotion/live"
          mkdir -p "$live"
          fetch() {
            curl --fail --location --retry 5 --retry-all-errors \
              --output "$2" "$site_root/$1"
          }
          fetch "index.html" "$live/index.html"
          fetch "assets/flasher/prns-flash.js" "$live/prns-flash.js"
          fetch "releases/channels/stable.json" "$live/stable.json"
          fetch "releases/channels/stable.json.minisig" "$live/stable.json.minisig"
          "$PRNS_MINISIGN_BIN" -Vm "$live/stable.json" \
            -x "$live/stable.json.minisig" -p release/keys/minisign.pub
          test "$(jq -r '.version' "$live/stable.json")" = "$RELEASE_VERSION"

          fetch "releases/${RELEASE_VERSION}/flash-manifest.json" "$live/flash-manifest.json"
          fetch "releases/${RELEASE_VERSION}/flash-manifest.json.minisig" "$live/flash-manifest.json.minisig"
          "$PRNS_MINISIGN_BIN" -Vm "$live/flash-manifest.json" \
            -x "$live/flash-manifest.json.minisig" -p release/keys/minisign.pub
          test "$(sha256sum "$live/flash-manifest.json" | awk '{print $1}')" = \
            "$(jq -r '.manifest_sha256' "$live/stable.json")"
          test "$(jq -r '.release.version' "$live/flash-manifest.json")" = "$RELEASE_VERSION"

          cmp "$live/index.html" target/post-promotion/candidate/website/index.html
          cmp "$live/prns-flash.js" \
            target/post-promotion/candidate/website/assets/flasher/prns-flash.js
          cmp "$live/stable.json" \
            target/post-promotion/candidate/website/releases/channels/stable.json
          cmp "$live/flash-manifest.json" \
            "target/post-promotion/candidate/website/releases/${RELEASE_VERSION}/flash-manifest.json"

          while IFS=$'\t' read -r relative size checksum; do
            destination="$live/$(basename "$relative")-$checksum"
            fetch "releases/${RELEASE_VERSION}/$relative" "$destination"
            test "$(stat -c '%s' "$destination")" = "$size"
            test "$(sha256sum "$destination" | awk '{print $1}')" = "$checksum"
          done < <(
            jq -r '.targets[].parts[] | [.path, (.size | tostring), .sha256] | @tsv' \
              "$live/flash-manifest.json"
          )
      - name: Prove stable release state and immutable shell installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "v${RELEASE_VERSION}" --json isDraft --jq '.isDraft')" = "false"
          test "$(gh release view "v${RELEASE_VERSION}" --json isPrerelease --jq '.isPrerelease')" = "false"
          install_root="${RUNNER_TEMP}/hopspot-flash-smoke"
          HOPSPOT_FLASH_INSTALL_DIR="$install_root" \
            sh target/post-promotion/candidate/cli/install.sh
          test "$("$install_root/hopspot-flash" --version)" = \
            "hopspot-flash ${RELEASE_VERSION}"

  mark-promoted:
    name: Enable future full-site deployments
    needs: post-promotion-smoke
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Enable full public site only after every promotion smoke passes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh variable set PRNS_PUBLIC_SITE_PROMOTED --body true
