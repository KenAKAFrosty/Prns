name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Warnings fail the build for *our* crates. Cargo applies `--cap-lints allow` to
  # registry dependencies, so this never breaks on third-party warnings.
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt (root workspace)
        run: cargo fmt --all -- --check
      # NOTE: scripts/fmt-check.sh also fmt-checks personal-hopspot/app — a separate
      # workspace on the Xtensa "esp" toolchain (espup), not installable on a stock
      # runner, so it is checked locally / on a device runner, not here.

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: doc (intra-doc links are load-bearing navigation)
        run: cargo doc -p personal-rns --no-deps --document-private-items --quiet

  feature-configs:
    # The jobs above only build the default features (`std` + `std-sync-host`). The async host
    # lane (tokio-host/tcp/udp) and the embassy contract lane are feature-gated, so the default
    # `clippy`/`test` never compile, lint, or run them — that is exactly how a tokio-host
    # `clippy::expect_used` and a non-exhaustive `match` in an embassy test both reached main
    # unseen. This job lints, tests, and doc-checks each lane on its own.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Async host lane. `tcp` is tokio-host's superset and the only config that compiles the
      # request runner's integration tests; `--no-default-features` drops the sync lane so this
      # is the async stack a tokio consumer actually ships (tcp -> std still brings alloc, so the
      # heap-backed unit tests build).
      - name: clippy — tcp / tokio-host lane
        run: cargo clippy -p personal-rns --no-default-features --features tcp --all-targets -- -D warnings
      - name: test — tcp / tokio-host lane
        run: cargo test -p personal-rns --no-default-features --features tcp
      - name: doc — tcp / tokio-host lane
        run: cargo doc -p personal-rns --no-deps --document-private-items --no-default-features --features tcp --quiet
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"
      # tokio-host on the *default* features — what `cargo test --features tokio-host` exercises
      # locally, the std-sync-host + async stack a consumer enabling tokio-host on top of the
      # defaults actually ships. Distinct from the no-default `tcp` lane above: this is the config
      # that catches a std-sync-host <-> tokio-host feature-unification break the tcp lane can't see.
      - name: clippy — tokio-host on default features
        run: cargo clippy -p personal-rns --features tokio-host --all-targets -- -D warnings
      - name: test — tokio-host on default features
        run: cargo test -p personal-rns --features tokio-host
      # Local shared-instance lane (LocalServer / LocalClient). Carried with `tcp` because the
      # end-to-end test dials the server with a TcpClient — the same HDLC wire a real RNS app
      # speaks — so the integration test only compiles with both features on.
      - name: clippy — local / shared-instance lane
        run: cargo clippy -p personal-rns --no-default-features --features "local tcp" --all-targets -- -D warnings
      - name: test — local / shared-instance lane
        run: cargo test -p personal-rns --no-default-features --features "local tcp"
      - name: doc — local / shared-instance lane
        run: cargo doc -p personal-rns --no-deps --document-private-items --no-default-features --features "local tcp" --quiet
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"
      # Embassy contract lane. `no-std-embedded` already proves it *builds* alloc-free (host +
      # C6); this RUNS the tests `cargo build` never compiles — the loopback driver and the
      # completion-pool soundness suite. Defaults stay on so `alloc` backs the crate-wide
      # heap-column unit tests; the alloc-free build is the esp script's job, not this one.
      - name: clippy — embassy-contract lane
        run: cargo clippy -p personal-rns --features embassy-contract --all-targets -- -D warnings
      - name: test — embassy-contract lane
        run: cargo test -p personal-rns --features embassy-contract
      - name: doc — embassy-contract lane
        run: cargo doc -p personal-rns --no-deps --document-private-items --features embassy-contract --quiet
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"

  msrv:
    # The declared MSRV (workspace `rust-version`) must actually build. Pinned to the
    # declared workspace floor (1.88); catches a feature or a dependency bump that
    # quietly requires a newer compiler than we advertise.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  no-std-embedded:
    # The forcing-function gate: the core stays no_std + alloc-free and cross-compiles
    # to the ESP32-C6 (riscv32imac). Reuses the committed script verbatim.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/no-std-esp-build.sh

  deny:
    # License (no copyleft) + RUSTSEC advisories + source policy, from deny.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: EmbarkStudios/cargo-deny-action@v2
