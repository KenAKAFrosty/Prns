name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Warnings fail the build for *our* crates. Cargo applies `--cap-lints allow` to
  # registry dependencies, so this never breaks on third-party warnings.
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt + doc gate (scripts/fmt-check.sh, all workspaces)
        run: bash scripts/fmt-check.sh
      - name: validation docs drift guard
        run: bash scripts/validation-doc-drift.sh
      - name: comment census gate
        run: bash scripts/comment-census.sh

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: doc (intra-doc links are load-bearing navigation)
        run: cargo doc -p prns-core -p prns-runtime -p personal-rns --no-deps --document-private-items --quiet

  feature-configs:
    # The jobs above only build the default features (`std` + `std-sync-host`). The async host
    # lane (tokio-host/tcp/udp) and the embassy-host lane are feature-gated, so the default
    # `clippy`/`test` never compile, lint, or run them — that is exactly how a tokio-host
    # `clippy::expect_used` and a non-exhaustive `match` in an embassy test both reached main
    # unseen. This job lints, tests, and doc-checks each lane on its own.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The tokio interface crate: every host interface family above the engine's tokio-host bind,
      # linted/tested/doc'd as the standalone workspace consumers actually build. --all-features is
      # honest here — the per-OS BLE backends live in target tables, so Linux gets BlueR and never
      # sees the mac/win ffi backend.
      - name: clippy — prns-interfaces-tokio (all features)
        run: cargo clippy --all-features --all-targets -- -D warnings
        working-directory: prns-interfaces/impls/tokio
      - name: test — prns-interfaces-tokio (all features)
        run: cargo test --all-features
        working-directory: prns-interfaces/impls/tokio
      - name: doc — prns-interfaces-tokio (all features)
        run: cargo doc --no-deps --document-private-items --all-features --quiet
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"
        working-directory: prns-interfaces/impls/tokio
      - name: clippy — prns-runtime-tokio
        run: cargo clippy --all-features --all-targets -- -D warnings
        working-directory: prns-runtime/impls/tokio
      - name: test — prns-runtime-tokio
        run: cargo test --all-features
        working-directory: prns-runtime/impls/tokio
      - name: doc — prns-runtime-tokio
        run: cargo doc --no-deps --document-private-items --all-features --quiet
        working-directory: prns-runtime/impls/tokio
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"
      # The umbrella on the same lane — the config a consumer enabling tokio-host on top of the
      # defaults actually ships, catching a std-sync-host <-> tokio-host feature-unification break
      # across all three layers at once. Interface families ride their lane-neutral names, so this
      # also proves the weak-edge forwarding resolves them to the tokio impls.
      - name: clippy — personal-rns umbrella, tokio-host lane + families
        run: cargo clippy -p personal-rns --features tokio-host,tcp,udp,wifi,shared-instance --all-targets -- -D warnings
      # The same lane-neutral family names on the embassy lane (host-compiled), proving the weak
      # edges resolve them to the embassy impls instead.
      - name: clippy — personal-rns umbrella, embassy-host lane + families
        run: cargo clippy -p personal-rns --no-default-features --features embassy-host,tcp,wifi,lora,esp-now,ble,usb,usb-device --all-targets -- -D warnings
      # The embassy interface crate, host-compiled (no_std enforced by the crate itself); its real
      # cross-builds ride the no-std-embedded job.
      - name: clippy — prns-interfaces-embassy (all features)
        run: cargo clippy --all-features --all-targets -- -D warnings
        working-directory: prns-interfaces/impls/embassy
      - name: doc — prns-interfaces-embassy (all features)
        run: cargo doc --no-deps --document-private-items --all-features --quiet
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"
        working-directory: prns-interfaces/impls/embassy
      # The cross-crate capstones: engine + runtime binds + real interface impls over live loopback
      # sockets, public API only (the tests that used to live inside personal-rns/tests).
      - name: clippy — prns-integration-tests
        run: cargo clippy --all-targets -- -D warnings
        working-directory: prns-integration-tests
      - name: test — prns-integration-tests
        run: cargo test
        working-directory: prns-integration-tests
      - name: clippy — prns-runtime-embassy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: prns-runtime/impls/embassy
      - name: test — prns-runtime-embassy
        run: cargo test -- --skip a_recipe_node_hears_an_ifac_announce_a_supervisor_stands_a_peer_up_for
        working-directory: prns-runtime/impls/embassy
      - name: doc — prns-runtime-embassy
        run: cargo doc --no-deps --document-private-items --quiet
        working-directory: prns-runtime/impls/embassy
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"
      # Hopspot desktop face (personal-hopspot/desktop): its own stable-toolchain
      # workspace, it consumes the runtime Message/Diagnostic enums by *exhaustive* match. Nothing
      # else in CI builds it (fmt-check only fmt-checks the workspace), so a new runtime event variant
      # could leave the desktop bin non-compiling, unseen until a hand build (exactly how the
      # multi-segment and link-guard variants slipped through). This lints and compiles it.
      - name: clippy — hopspot desktop face
        run: cargo clippy --all-targets -- -D warnings
        working-directory: personal-hopspot/desktop
      # The config reader and the daemon are their own root-excluded workspaces, so --workspace
      # clippy/test never see them — exactly how prns-config's mapping layer reached main
      # non-compiling, unseen, while the rest of the tree stayed green. Lint + test the reader here
      # (its ConfigObj/coercion oracle tests self-skip without the reference venv, but still compile,
      # and the mapping + proptest suites run); lint the daemon, which path-deps the reader, so this
      # also compiles the reader against the daemon's feature set.
      - name: clippy — prns-config
        run: cargo clippy --all-targets -- -D warnings
        working-directory: prns-config
      - name: test — prns-config
        run: cargo test
        working-directory: prns-config
      - name: clippy — prnsd
        run: cargo clippy --all-features --all-targets -- -D warnings
        working-directory: prnsd
      - name: test — prnsd
        run: cargo test --all-features
        working-directory: prnsd
      - name: clippy — prns-wasm (wasm32)
        run: cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings
        working-directory: prns-wasm

  msrv:
    # The declared MSRV (workspace `rust-version`) must actually build. Pinned to the
    # declared workspace floor (1.90); catches a feature or a dependency bump that
    # quietly requires a newer compiler than we advertise.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
      # The root-excluded workspaces declare the same 1.90 floor; hold them to it too.
      - run: cargo check
        working-directory: prns-config
      - run: cargo check
        working-directory: prnsd

  no-std-embedded:
    # The forcing-function gate: the core stays no_std + alloc-free and cross-compiles
    # to the ESP32-C6 (riscv32imac). Reuses the committed script verbatim.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf, thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/no-std-esp-build.sh
      - name: prns-interfaces-embassy — cross-build (ESP32-C6 / riscv32imac)
        run: cargo build --target riscv32imac-unknown-none-elf --features "tcp,wifi,lora,esp-now,ble,usb"
        working-directory: prns-interfaces/impls/embassy
      - name: prns-interfaces-embassy — cross-build (nRF52840 / thumbv7em)
        run: cargo build --target thumbv7em-none-eabihf --features "lora,ble,usb-device"
        working-directory: prns-interfaces/impls/embassy
      - name: t-echo firmware — cross-build (nRF52840 / thumbv7em)
        run: cargo build --release
        working-directory: personal-hopspot/embedded/nrf52840

  android-service:
    # Android is now more than a foreground Activity shell: the Hopspot app packages a foreground
    # `PrnsService` that owns the local shared-instance server so another signed app can bind to
    # one compliant daemon instead of starting its own Reticulum instance. This lane builds the JNI
    # libraries for the shipped ABIs, assembles the APK, and asserts the merged manifest keeps the
    # foreground-service + signature bind contract intact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            personal-hopspot/mobile/android/rust
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: install Android SDK pieces
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018"
      - name: install cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2
      - name: foreground service shared-instance smoke
        run: bash scripts/android-service-smoke.sh

  macos-ble:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            prns-ffi
            prns-interfaces/impls/tokio
            personal-hopspot/mobile/ios/rust
      - name: clippy — prns-ffi (CoreBluetooth backend)
        run: cargo clippy --all-features --all-targets -- -D warnings
        working-directory: prns-ffi
      - name: clippy — prns-interfaces-tokio (all features, Apple legs)
        run: cargo clippy --all-features --all-targets -- -D warnings
        working-directory: prns-interfaces/impls/tokio
      - name: clippy — hopspot iOS face crate
        run: cargo clippy --all-targets -- -D warnings
        working-directory: personal-hopspot/mobile/ios/rust

  windows-desktop:
    # The Hopspot desktop face is the cross-platform proving ground, and nothing else in CI builds on
    # Windows, so a Windows-only break (a path assumption, an OS cfg gate, the SDL2 link) reaches main
    # unseen. This lane builds and lints personal-hopspot/desktop on windows-latest. It
    # is a plain-std crate on stable (its own rust-toolchain.toml pins stable; RUSTUP_TOOLCHAIN below
    # reasserts it belt-and-suspenders). It links SDL2 statically from source on Windows (sdl2
    # `bundled` + `static-link`, see its Cargo.toml + .cargo/config.toml); that build needs CMake + the
    # MSVC toolchain, both preinstalled on windows-latest.
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: personal-hopspot/desktop
      # Lint + compile parity with the Linux desktop-face step in feature-configs: this is what would
      # have caught the snapshot-refactor type mismatch that left main non-compiling.
      - name: clippy — hopspot desktop face (Windows)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: personal-hopspot/desktop
      # Clippy stops before the final link, so it never exercises the static SDL2 link. A real build
      # does — proving the self-contained, no-DLL Windows binary actually links.
      - name: build — hopspot desktop face (static SDL2 links)
        run: cargo build
        working-directory: personal-hopspot/desktop

  local-interop:
    # Real-RNS interop: the LocalServer shared instance against a stock RNS client, proving the wire
    # and control RPC match what Sideband/NomadNet/MeshChat actually speak — not just our own framing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - name: install the reference RNS (rns==1.3.5)
        run: uv venv /tmp/rns && uv pip install --python /tmp/rns/bin/python -r benchmarks/reference/requirements.txt
      - name: install the control-RPC reference RNS (rns==1.3.8)
        run: uv venv /tmp/rns-rpc && uv pip install --python /tmp/rns-rpc/bin/python -r benchmarks/reference/rpc-requirements.txt
      - name: real-RNS local shared-instance smoke
        run: SMOKE_PYTHON=/tmp/rns/bin/python bash scripts/local-interop-smoke.sh
      - name: real-RNS local control-RPC smoke (1.3.8 msgpack)
        run: RPC_SMOKE_PYTHON=/tmp/rns-rpc/bin/python bash scripts/local-rpc-interop-smoke.sh
      - name: real-RNS remote-management smoke (1.3.8)
        run: RPC_SMOKE_PYTHON=/tmp/rns-rpc/bin/python bash scripts/remote-management-interop-smoke.sh
      - name: real-RNS probe-responder smoke (1.3.8)
        run: RPC_SMOKE_PYTHON=/tmp/rns-rpc/bin/python bash scripts/probe-responder-interop-smoke.sh
      - name: real-RNS transit smoke (links both ways through the bridge)
        run: SMOKE_PYTHON=/tmp/rns/bin/python bash scripts/local-transit-smoke.sh
      - name: real-RNS IFAC transit smoke (1 MiB resources both ways)
        run: SMOKE_PYTHON=/tmp/rns/bin/python bash scripts/ifac-tcp-interop-smoke.sh
      - name: real-RNS inverse smoke (prnsd joins a stock instance as a client)
        run: SMOKE_PYTHON=/tmp/rns/bin/python bash scripts/local-client-smoke.sh
      - name: real-RNS TCP server smoke (stock RNS TCPClientInterface dials our TcpServer)
        run: SMOKE_PYTHON=/tmp/rns/bin/python bash scripts/tcp-server-interop-smoke.sh

  deny:
    # License (no copyleft) + RUSTSEC advisories + source policy, from deny.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: EmbarkStudios/cargo-deny-action@v2
