[package]
name = "prns-integration-tests"
version = "0.3.6"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KenAKAFrosty/Prns"
homepage = "https://reticulum.rs"
rust-version = "1.90"
description = "Cross-crate integration capstones: the Personal Reticulum engine driven through the runtime binds and the real interface impls, public API only"
publish = false

[workspace]

[dependencies]
personal-rns = { path = "../../personal-rns", default-features = false, features = ["tokio-host", "tcp", "udp", "shared-instance", "wifi-auto", "wifi-direct", "runtime-metrics"] }
personal-hopspot-core = { path = "../../personal-hopspot/core" }

[dev-dependencies]
env_logger = "0.11"
futures-util = "0.3"
prns-core = { path = "../../prns-core" }
prns-ffi = { path = "../../prns-ffi" }
prns-interfaces-tokio = { path = "../../prns-interfaces/impls/tokio", features = ["bluetooth-auto", "log", "shared-instance", "tcp", "websocket", "wifi-direct"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "process"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = "4"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
significant_drop_in_scrutinee = "warn"
