[package]
name = "prns-validation-oracles"
version = "0.3.7"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KenAKAFrosty/Prns"
homepage = "https://reticulum.rs"
rust-version = "1.90"
description = "Explicit stock-RNS comparison drivers for Personal Reticulum"
publish = false

[workspace]

[dependencies]
prns-core = { path = "../../prns-core" }
prns-config = { path = "../../prns-config" }
serde_json = "1"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
significant_drop_in_scrutinee = "warn"
