[package]
name = "personal-reticulum-suite-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
prns-core = { path = "../../prns-core", features = ["tokio-host", "shared-instance-rpc"] }
prns-runtime = { path = "../../prns-runtime/core", default-features = false }
prns-config = { path = "../../prns-config" }
rmpv = "1.3"

