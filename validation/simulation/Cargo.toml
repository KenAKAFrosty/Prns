[package]
name = "prns-simulation"
version = "0.3.8"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Deterministic, host-native virtual device validation for Personal Reticulum"
publish = false

[features]
controlled-time = ["tokio/test-util", "prns-runtime-tokio/simulation-control", "prns-runtime-tokio/runtime-metrics"]
heap-profile = ["dep:dhat"]

[dependencies]
dhat = { version = "0.3", optional = true }
personal-rns = { path = "../../personal-rns", default-features = false, features = ["tokio-host", "wifi-halow", "tcp"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
prns-runtime-tokio = { path = "../../prns-runtime/impls/tokio", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
personal-hopspot-core = { path = "../../personal-hopspot/core", default-features = false }
critical-section = { version = "1", features = ["std"] }
embassy-sync = { version = "0.8.0", default-features = false }
embassy-time = { version = "0.5", default-features = false, features = ["tick-hz-1_000_000", "generic-queue-64"] }
embassy-time-driver = { version = "0.2", features = ["tick-hz-1_000_000"] }
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"] }
embedded-storage-async = { version = "0.4", default-features = false }
prns-core = { path = "../../prns-core", default-features = false, features = ["flash"] }
prns-interfaces-embassy = { path = "../../prns-interfaces/impls/embassy", default-features = false, features = ["bluetooth-auto"] }
prns-interfaces-tokio = { path = "../../prns-interfaces/impls/tokio", default-features = false, features = ["bluetooth-auto-runtime"] }
prns-runtime = { path = "../../prns-runtime/core", default-features = false, features = ["resource-bzip2"] }
prns-runtime-embassy = { path = "../../prns-runtime/impls/embassy", default-features = false, features = ["large-static-responses"] }
tokio = { version = "1", default-features = false, features = ["test-util"] }

[lints]
workspace = true
