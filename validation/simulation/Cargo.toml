[package]
name = "prns-simulation"
version = "0.3.7"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Deterministic, host-native virtual device validation for Personal Reticulum"
publish = false

[features]
controlled-time = ["tokio/test-util"]

[dependencies]
personal-rns = { path = "../../personal-rns", default-features = false, features = ["tokio-host"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
critical-section = { version = "1", features = ["std"] }
embassy-sync = { version = "0.8.0", default-features = false }
embassy-time = { version = "0.5", default-features = false, features = ["mock-driver", "generic-queue-64"] }
prns-interfaces-embassy = { path = "../../prns-interfaces/impls/embassy", default-features = false, features = ["bluetooth-auto"] }
prns-interfaces-tokio = { path = "../../prns-interfaces/impls/tokio", default-features = false, features = ["bluetooth-auto-runtime"] }
prns-runtime-embassy = { path = "../../prns-runtime/impls/embassy", default-features = false }
tokio = { version = "1", default-features = false, features = ["test-util"] }

[lints]
workspace = true
