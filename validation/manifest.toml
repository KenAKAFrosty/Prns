[[registry.asset_exemptions]]
path = "prns-wasm/smoke/smoke.ts"
reason = "Interactive browser-and-device smoke page; the automatable TypeScript smokes are registered suites."

[[suite]]
id = "cargo-locks"
domain = "hygiene"
tiers = ["pr", "release", "scheduled"]
platform = "any"
toolchain = "python"
timeout_seconds = 600
command = ["__RUNNER_PYTHON__", "validation/hygiene/cargo-locks.py"]
inputs = ["validation/hygiene/cargo-locks.py", "validation/manifest.toml"]
artifacts = "validation-artifacts/results/cargo-locks"

