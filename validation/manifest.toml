platform = "any"
toolchain = "python"
timeout_seconds = 60
command = ["__RUNNER_PYTHON__", "tools/prns", "run", "repo.host-contract.check"]
inputs = [
  "tools/repo/generate-host-contract.py",
  "prns-host/schema/host-contract-v1.json",
  "prns-host/core/src/generated.rs",
  "prns-host/abi/c/include/prns_host.h",
  "prns-host/bindings/dotnet/src/PersonalRns/Generated/HostContract.g.cs",
  "prns-host/bindings/go/convenience.go",
  "prns-host/bindings/go/contract_generated.go",
  "prns-host/bindings/julia/src/HostContract.generated.jl",
  "prns-host/bindings/julia/src/PersonalRns.jl",
  "prns-host/bindings/julia/src/command.jl",
  "prns-host/bindings/jvm/src/main/kotlin/rs/reticulum/prns/Command.kt",
  "prns-host/bindings/jvm/src/main/kotlin/rs/reticulum/prns/Events.kt",
  "prns-host/bindings/jvm/src/main/kotlin/rs/reticulum/prns/HostContract.generated.kt",
  "prns-host/bindings/jvm/src/main/kotlin/rs/reticulum/prns/Host.kt",
  "prns-host/bindings/jvm/src/main/kotlin/rs/reticulum/prns/ResourceUpload.kt",
  "prns-host/bindings/python/src/personal_rns/generated.py",
  "prns-host/bindings/swift/Sources/CPrnsHost/include/prns_host.h",
  "prns-host/bindings/swift/Sources/PersonalRns/HostContract.generated.swift",
  "prns-host/bindings/swift/Sources/PersonalRns/Host.swift",
  "prns-host/conformance/host-contract-v1.json",
  "prns-js/src/contract.generated.ts",
]
artifacts = "validation-artifacts/results/host-contract-generated"

