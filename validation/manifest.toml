schema = 1

[tools]
cargo_fuzz = "0.13.1"
cargo_mutants = "27.1.0"
kani = "0.67.0"

[toolchains]
nightly = "nightly-2025-11-21"

[interpreters.smoke]
environment = "SMOKE_PYTHON"
venv = "validation/.venv/rns-1.4.2"
requirements = "validation/oracles/requirements.txt"
version = "1.4.2"

[interpreters.rpc]
environment = "RPC_SMOKE_PYTHON"
venv = "validation/.venv/rns-rpc-1.4.2"
requirements = "validation/oracles/requirements.txt"
version = "1.4.2"

