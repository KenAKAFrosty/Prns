schema = 1

[tools]
cargo_fuzz = "0.13.1"
cargo_mutants = "27.1.0"
kani = "0.67.0"

[toolchains]
nightly = "nightly-2025-11-21"

[interpreters.smoke]
environment = "SMOKE_PYTHON"
venv = "validation/.venv/rns-{version}"
requirements = "validation/oracles/requirements.txt"
version = "1.4.2"

[interpreters.rpc]
environment = "RPC_SMOKE_PYTHON"
venv = "validation/.venv/rns-rpc-{version}"
requirements = "validation/oracles/requirements.txt"
version = "1.4.2"

[interpreters.interop_smoke]
environment = "SMOKE_PYTHON"
venv = "validation/.venv/rns-interop-{version}"
requirements = "validation/interop/requirements.txt"
version = "1.5.0"

[interpreters.interop_rpc]
environment = "RPC_SMOKE_PYTHON"
venv = "validation/.venv/rns-interop-rpc-{version}"
requirements = "validation/interop/requirements.txt"
version = "1.5.0"

