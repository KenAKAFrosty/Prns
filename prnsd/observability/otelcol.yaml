receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://*
  file_log/prnsd:
    include:
      - ${env:PRNSD_LOG_PATH}
    start_at: beginning
    operators:
      - type: json_parser
        timestamp:
          parse_from: attributes.timestamp
          layout_type: gotime
          layout: 2006-01-02T15:04:05.999999999Z07:00
        severity:
          parse_from: attributes.level

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: /ready

processors:
  batch:
  resource/prnsd:
    attributes:
      - key: service.name
        value: prnsd
        action: upsert

exporters:
  otlp_http/metrics:
    endpoint: http://127.0.0.1:9090/api/v1/otlp
    tls:
      insecure: true
  otlp_http/traces:
    endpoint: http://127.0.0.1:4418
    tls:
      insecure: true
  otlp_http/logs:
    endpoint: http://127.0.0.1:3100/otlp
    tls:
      insecure: true

service:
  extensions:
    - health_check
  pipelines:
    metrics:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - otlp_http/metrics
    traces:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - otlp_http/traces
    logs:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - otlp_http/logs
    logs/prnsd:
      receivers:
        - file_log/prnsd
      processors:
        - resource/prnsd
        - batch
      exporters:
        - otlp_http/logs
