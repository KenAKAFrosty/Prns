[package]
name = "prnsd"
version = "0.2.5"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KenAKAFrosty/Prns"
homepage = "https://reticulum.rs"
rust-version = "1.90"
description = "Thin daemon host for the Personal Reticulum engine"
publish = false

[workspace]

[[bin]]
name = "prnsd"
path = "src/main.rs"
required-features = ["tokio-host", "observability"]

[features]
default = ["tokio-host", "observability", "host-parallelism"]
alloc = ["personal-rns/alloc"]
std = ["alloc", "personal-rns/std"]
tokio-host = [
    "std",
    "personal-rns/tokio-host",
    "personal-rns/tcp",
    "personal-rns/udp",
    "personal-rns/serial",
    "personal-rns/kiss",
    "personal-rns/ax25",
    "personal-rns/rnode",
    "personal-rns/pipe",
    "personal-rns/backbone",
    "personal-rns/i2p",
    "personal-rns/weave",
    "personal-rns/wifi",
    "personal-rns/shared-instance",
    "personal-rns/config",
    "personal-rns/interface-discovery-archive",
    "dep:tokio",
    "dep:clap",
]
fixture-identity = []
observability = [
    "personal-rns/log",
    "personal-rns/tracing",
    "dep:log",
    "dep:tracing",
    "dep:tracing-log",
    "dep:tracing-subscriber",
]
host-parallelism = [
    "personal-rns/parallel-persistence",
    "personal-rns/parallel-resource-hash",
]
otlp = [
    "observability",
    "personal-rns/runtime-metrics",
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]

[dependencies]
personal-rns = { path = "../personal-rns", default-features = false }
prnsd-control = { path = "../tools/prnsd-control" }
# The async runtime (tokio-host only); the USB-serial transport now rides personal-rns's
# serial feature (prns-interfaces-tokio's serial-host opener).
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "process", "signal", "fs"], optional = true }
# The daemon's command-line front door (tokio-host only): typed args, --help, --version.
clap = { version = "4", features = ["derive"], optional = true }
log = { version = "0.4", optional = true }
tracing = { version = "0.1", optional = true }
tracing-log = { version = "0.2", optional = true }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["ansi", "env-filter", "fmt", "json", "registry"] }
opentelemetry = { version = "0.32", optional = true, default-features = false, features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.32", optional = true, default-features = false, features = ["http-proto", "metrics", "reqwest-blocking-client", "reqwest-rustls-webpki-roots", "trace"] }
opentelemetry_sdk = { version = "0.32", optional = true, default-features = false, features = ["metrics", "trace"] }
tracing-opentelemetry = { version = "0.33", optional = true, default-features = false }
# OS CSPRNG for the daemon's node identity (main's load_identity_secret_key) —
# the same source RNS uses (`os.urandom`).

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
significant_drop_in_scrutinee = "warn"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
