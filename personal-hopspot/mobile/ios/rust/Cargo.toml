[package]
name = "personal-hopspot-ios"
version = "0.1.0"
edition = "2021"
publish = false
description = "Personal Hopspot iOS face: a C-ABI + DrawTarget bridge that renders the shared Hopspot screen into an iOS RGBA buffer and feeds taps back as single-button input."

[workspace]
resolver = "2"

[lib]
name = "personal_hopspot_ios"
crate-type = ["staticlib", "lib"]

[dependencies]
personal-hopspot-core = { path = "../../../core", default-features = false }
personal-rns = { path = "../../../../personal-rns", default-features = false, features = ["tokio-host"] }
prns-interfaces-tokio = { path = "../../../../personal-rns-interfaces/tokio", default-features = false, features = ["tcp", "wifi", "ble"] }
embedded-graphics = "0.8"
heapless = { version = "0.8", default-features = false }
getrandom = "0.2"
# The async runtime + a TCP listener: RNS TCP framing is the serial HDLC framing, so the
# reactor's serial interface serves a TCP connection directly — `accept` standing in for `open`.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }

# The native CoreBluetooth BLE backend (objc2), shared with the macOS desktop face. iOS-only:
# the staticlib builds for iOS device + simulator (both `target_os = "ios"`), where this supplies
# the same proven GATT acceptor the desktop runs.
[target.'cfg(target_os = "ios")'.dependencies]
personal-rns-ffi = { path = "../../../../personal-rns-ffi" }

[profile.release]
codegen-units = 1
opt-level = "s"
