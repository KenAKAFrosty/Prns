[package]
name = "personal-hopspot-ios"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Personal Hopspot iOS face: a C-ABI bridge that expands the canonical Hopspot frame into an iOS RGBA buffer and feeds taps back as single-button input."

[workspace]
resolver = "2"

[features]
default = []
source-archive = ["personal-hopspot-core/source-archive"]

[lib]
name = "personal_hopspot_ios"
crate-type = ["staticlib", "lib"]

[dependencies]
personal-hopspot-core = { path = "../../../core", default-features = false, features = ["display", "host"] }
personal-rns = { path = "../../../../personal-rns", default-features = false, features = ["tokio-host", "tcp", "wifi-auto-apple", "bluetooth-auto", "parallel-persistence", "parallel-resource-hash"] }
heapless = { version = "0.8", default-features = false }
# The async runtime + a TCP listener: RNS TCP framing is the serial HDLC framing, so the
# manifold's serial interface serves a TCP connection directly — `accept` standing in for `open`.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
libc = "0.2"

# The native CoreBluetooth BLE backend (objc2), shared with the macOS desktop face. iOS-only:
# the staticlib builds for iOS device + simulator (both `target_os = "ios"`), where this supplies
# the same proven GATT acceptor the desktop runs.
[target.'cfg(target_os = "ios")'.dependencies]
prns-ffi = { path = "../../../../prns-ffi" }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[dev-dependencies]
tempfile = "3"
