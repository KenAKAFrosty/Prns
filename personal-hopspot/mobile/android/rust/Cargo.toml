[package]
name = "personal-hopspot-android"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Personal Hopspot Android face: a JNI bridge that expands the canonical Hopspot frame into an Android bitmap and feeds taps back as single-button input."

[workspace]
resolver = "2"

[features]
default = []
source-archive = ["personal-hopspot-core/source-archive"]

[lib]
name = "personal_hopspot_android"
crate-type = ["cdylib", "lib"]

[dependencies]
personal-hopspot-core = { path = "../../../core", default-features = false, features = ["display", "host"] }
personal-rns = { path = "../../../../personal-rns", default-features = false, features = ["tokio-host", "wifi-auto", "wifi-direct", "wifi-aware", "bluetooth-auto", "usb", "shared-instance", "log", "parallel-persistence", "parallel-resource-hash"] }
prns-ffi = { path = "../../../../prns-ffi", default-features = false, features = ["log"] }
getrandom = "0.2"
heapless = { version = "0.8", default-features = false }
jni = "0.21"
log = "0.4"
# The async runtime + the channels/IO traits the JNI-bridged USB stream rides; the manifold's
# USB-auto host multiplexes it like any other stream. The Wi-Fi auto-interface supervisor rides the same
# runtime (prns-interfaces-tokio's `wifi-auto` pulls tokio/net + socket2 + if-addrs); the Kotlin side
# holds the multicast lock so the supervisor's IPv6 link-local multicast crosses.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
