[package]
name = "personal-hopspot-assurance-kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
host = []
thumbv7em = [
    "dep:cortex-m-rt",
    "dep:cortex-m-semihosting",
    "dep:panic-halt",
]
riscv32imac = [
    "dep:riscv-rt",
    "dep:semihosting",
]
xtensa-esp32s3 = []

[dependencies]
embassy-futures = { version = "0.1", default-features = false }
embedded-hal = { version = "1", default-features = false }
embedded-hal-async = { version = "1", default-features = false }
prns-core = { path = "../../prns-core", default-features = false, features = ["embassy-host"] }
prns-interfaces-embassy = { path = "../../prns-interfaces/impls/embassy", default-features = false, features = ["lora"] }
cortex-m-rt = { version = "0.7", optional = true }
cortex-m-semihosting = { version = "0.5", optional = true }
panic-halt = { version = "1", optional = true }
riscv-rt = { version = "0.16", features = ["memory", "single-hart"], optional = true }
semihosting = { version = "0.1", features = ["panic-handler", "stdio"], optional = true }

[[bin]]
name = "assurance-host"
path = "src/bin/host.rs"
required-features = ["host"]

[[bin]]
name = "assurance-thumbv7em"
path = "src/bin/thumbv7em.rs"
required-features = ["thumbv7em"]

[[bin]]
name = "assurance-riscv32imac"
path = "src/bin/riscv32imac.rs"
required-features = ["riscv32imac"]

[[bin]]
name = "assurance-xtensa-esp32s3"
path = "src/bin/xtensa_esp32s3.rs"
required-features = ["xtensa-esp32s3"]

[lints]
workspace = true
