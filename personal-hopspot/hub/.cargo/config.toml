[alias]
hub-coverage = ["llvm-cov", "--package", "hopspot-hub-core", "--locked", "--all-features", "--all-targets", "--fail-uncovered-functions", "0", "--fail-uncovered-lines", "0", "--fail-uncovered-regions", "0", "--show-missing-lines", "--ignore-filename-regex", "/(architecture|behavior|proofs|tests)\\.rs$|/tests/"]
hub-mutants = "mutants --package hopspot-hub-core --all-features --config .cargo/mutants.toml --in-place --cargo-arg=--locked"
