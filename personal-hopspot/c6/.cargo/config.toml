#   cargo c6         build the C6 firmware
#   cargo c6-flash   build + flash + monitor (board on USB)

[target.riscv32imac-unknown-none-elf]
runner = "espflash flash --monitor"
rustflags = ["-C", "link-arg=-Tlinkall.x"]

[alias]
c6 = "build --release --target riscv32imac-unknown-none-elf -Zbuild-std=core,alloc"
c6-flash = "run --release --target riscv32imac-unknown-none-elf -Zbuild-std=core,alloc"
