[package]
name = "t-echo"
version = "0.1.0"
edition = "2021"
publish = false
description = "LilyGo T-Echo (nRF52840 + SX1262 + 200x200 SSD1681 e-ink) Personal Hopspot face: drives the Personal Reticulum engine on bare metal and renders the shared Hopspot screen on e-ink."

[workspace]

[[bin]]
name = "t-echo"
path = "src/main.rs"

[dependencies]
personal-rns = { path = "../../personal-rns", default-features = false, features = ["embassy-contract", "embassy-lora"] }
personal-hopspot-ui = { path = "../ui", default-features = false }

embedded-graphics = "0.8"
epd-waveshare = { version = "0.6", default-features = false, features = ["graphics", "epd2in13_v3"] }
embedded-hal = "1.0"
embedded-hal-bus = { version = "0.3", features = ["async"] }

cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "1.0"

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5" }
embassy-nrf = { version = "0.10", features = ["nrf52840", "time-driver-rtc1", "gpiote"] }
embassy-usb = { version = "0.6" }
embassy-futures = "0.1"
embassy-sync = "0.8"

static_cell = "2.1"
heapless = "0.8"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "thin"
opt-level = "s"
overflow-checks = false
