[package]
name = "t-echo"
version = "0.1.0"
edition = "2021"
publish = false
description = "LilyGo T-Echo (nRF52840 + SX1262 + 200x200 SSD1681 e-ink) Personal Hopspot face: drives the Personal Reticulum engine on bare metal and renders the shared Hopspot screen on e-ink."

[workspace]

[[bin]]
name = "t-echo"
path = "src/main.rs"

[features]
default = ["cs-single-core"]
# Bare-metal critical sections for the normal (non-SoftDevice) firmware. Mutually exclusive with the
# `ble` build, which gets its critical section from the SoftDevice instead.
cs-single-core = ["cortex-m/critical-section-single-core"]
# BLE-first-light bring-up: brings in the S140 SoftDevice (nrf-softdevice) and swaps `main` for the
# advertising bring-up. Build with `--no-default-features --features ble`, so the SoftDevice owns the
# critical section. The default build is the unchanged LoRa firmware.
ble = ["dep:nrf-softdevice", "dep:heapless09", "nrf-softdevice/critical-section-impl", "personal-rns/embassy-bluetooth"]

[dependencies]
personal-rns = { path = "../../personal-rns", default-features = false, features = ["embassy-contract", "embassy-lora"] }
personal-hopspot-ui = { path = "../ui", default-features = false }

embedded-graphics = "0.8"
epd-waveshare = { version = "0.6", default-features = false, features = ["graphics", "epd2in13_v3"] }
embedded-hal = "1.0"
embedded-hal-bus = { version = "0.3", features = ["async"] }

cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
panic-halt = "1.0"

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5" }
embassy-nrf = { version = "0.10", features = ["nrf52840", "time-driver-rtc1", "gpiote"] }
embassy-usb = { version = "0.6" }
embassy-futures = "0.1"
embassy-sync = "0.8"

static_cell = "2.1"
heapless = "0.8"

# BLE-only (gated by the `ble` feature). nrf-softdevice does not depend on embassy-nrf, so it rides
# alongside the T-Echo's embassy-nrf 0.10. The S140 v7 binding talks to the SoftDevice over SVCs.
nrf-softdevice = { git = "https://github.com/embassy-rs/nrf-softdevice", features = ["nrf52840", "s140", "ble-central", "ble-peripheral", "ble-gatt-server", "ble-gatt-client"], optional = true }
# nrf-softdevice's GATT characteristics use heapless 0.9; the rest of the firmware is on 0.8.
heapless09 = { package = "heapless", version = "0.9", optional = true }

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "thin"
opt-level = "s"
overflow-checks = false
