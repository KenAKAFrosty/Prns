[package]
name = "personal-hopspot-desktop"
version = "0.1.0"
edition = "2021"
publish = false
description = "Linux debug face of the Personal Hopspot — renders the same status screen as the S3 OLED in a window, driven by a real engine over a serial link."

[[bin]]
name = "personal-hopspot-desktop"
path = "src/main.rs"

# Standalone workspace: keeps SDL2 (embedded-graphics-simulator) out of the core
# suite's build + lockfile. Mirrors the hosts/* layout.
[workspace]

[features]
default = []
# Deterministic bring-up identity (the pinned oracle keypair) — mirrors rnsd.
fixture-identity = []

[dependencies]
# The same engine + std host the daemon uses, plus the plug-and-play USB-auto
# interface (announcing ContractRuntime over auto-discovered USB CDC links).
personal-rns = { path = "../../personal-rns", default-features = false, features = ["std-host", "usb-auto"] }
# The shared Hopspot screen renderer — the exact draw code the S3 OLED runs.
personal-hopspot-ui = { path = "../ui", default-features = false }
# Render the BinaryColor screen into an SDL2 window (pin the 0.8 line that pairs
# with embedded-graphics 0.8).
embedded-graphics = "0.8"
embedded-graphics-simulator = "0.8.0"
# OS CSPRNG for the node identity (mirrors rnsd's load_identity_secret_key).
getrandom = "0.2"
# The card vector the renderer takes.
heapless = { version = "0.8", default-features = false }
