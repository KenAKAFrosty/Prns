[package]
name = "hopspot-flash"
version = "0.3.7"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false
description = "Interactive flashing helper for Personal Hopspot boards."

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.5"
dialoguer = "0.11"
espflash = { version = "=4.5.0", default-features = false, features = ["serialport"] }
nusb = "=0.2.4"
prns-flash-manifest = { path = "../../prns-flash-manifest" }
prns-nrf-dfu = { path = "../../prns-nrf-dfu" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = { version = "4.7", default-features = false }
sha2 = "0.10"
thiserror = "2.0"
ureq = { version = "=3.3.0", default-features = false, features = ["rustls", "gzip"] }
url = "2.5"

[lints]
workspace = true
