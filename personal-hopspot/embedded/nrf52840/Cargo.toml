[package]
name = "t-echo"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "LilyGo T-Echo (nRF52840 + SX1262 + 200x200 SSD1681 e-ink) Personal Hopspot face: drives the Personal Reticulum engine on bare metal and renders the shared Hopspot screen on e-ink."

[workspace]

[features]
default = ["board-t-echo"]
board-t-echo = []
board-t096 = []
# Seeed SenseCAP Wio Tracker T1000-E: nRF52840 + Semtech LR1110, no display.
# The shared nrf52840 runtime still links the display deps (the T-Echo face uses
# them and the runtime is display-coupled); the T1000-E board returns the
# `None`/Unavailable display path so the display code is inert at runtime.
board-t1000e = []

[lib]
name = "personal_hopspot_nrf52840"
path = "src/lib.rs"

[[bin]]
name = "t-echo"
path = "src/main.rs"
required-features = ["board-t-echo"]

[[bin]]
name = "t096"
path = "src/bin/t096.rs"
required-features = ["board-t096"]

[[bin]]
name = "t1000e"
path = "src/bin/t1000e.rs"
required-features = ["board-t1000e"]

[dependencies]
personal-rns = { path = "../../../personal-rns", default-features = false, features = ["embassy-host", "flash", "lora", "bluetooth-auto", "usb"] }
personal-hopspot-core = { path = "../../core", default-features = false }

embedded-graphics = "0.8"
epd-waveshare = { version = "0.6", default-features = false, features = ["graphics", "epd2in13_v3"] }
embedded-hal = "1.0"
embedded-hal-bus = { version = "0.3", features = ["async"] }

cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
panic-halt = "1.0"

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5" }
embassy-nrf = { version = "0.10", features = ["nrf52840", "time-driver-rtc1", "gpiote"] }
embassy-usb = { version = "0.6" }
embassy-futures = "0.1"
embassy-sync = "0.8"

static_cell = "2.1"
heapless = "0.8"

embedded-io-async = "0.6"
# T-Echo firmware. nrf-softdevice does not depend on embassy-nrf, so it rides alongside the
# T-Echo's embassy-nrf 0.10. The S140 v7 binding talks to the SoftDevice over SVCs.
# evt-max-size-512: our att_mtu is 247, so a single GATT write/notification event reaches ~258 bytes —
# past the 128-byte default and the 256 tier. Without this the SoftDevice's event read overflows and
# nrf-softdevice panics ("BLE_EVT_MAX_SIZE is too low") the instant a peer sends a full-MTU payload.
nrf-softdevice = { git = "https://github.com/embassy-rs/nrf-softdevice", rev = "47d6121c6e823120e8b883a7ac75f44ce7daa3aa", features = ["nrf52840", "s140", "ble-central", "ble-peripheral", "ble-gatt-server", "ble-gatt-client", "ble-l2cap", "ble-l2cap-credit-workaround", "evt-max-size-512", "critical-section-impl"] }
# nrf-softdevice's GATT characteristics use heapless 0.9; the rest of the firmware is on 0.8.
heapless09 = { package = "heapless", version = "0.9" }
rand_chacha = { version = "0.9", default-features = false }

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
