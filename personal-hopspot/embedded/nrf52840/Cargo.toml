[package]
name = "t-echo"
version = "0.1.0"
edition = "2021"
publish = false
description = "LilyGo T-Echo (nRF52840 + SX1262 + 200x200 SSD1681 e-ink) Personal Hopspot face: drives the Personal Reticulum engine on bare metal and renders the shared Hopspot screen on e-ink."

[workspace]

[[bin]]
name = "t-echo"
path = "src/main.rs"

[features]
default = ["hopspot-t-echo"]
# The production Hopspot image for LilyGO T-Echo. This is the profile the web
# flasher and local CLI build: LoRa, BLE Auto, and USB Auto above the factory
# S140 SoftDevice.
hopspot-t-echo = ["dep:nrf-softdevice", "dep:heapless09", "nrf-softdevice/critical-section-impl", "prns-interfaces-embassy/ble", "prns-interfaces-embassy/usb-device"]
# Bare-metal critical sections for the developer LoRa-only firmware. Mutually
# exclusive with the SoftDevice-backed Hopspot profile above.
cs-single-core = ["cortex-m/critical-section-single-core"]
# Compatibility alias for older local commands that still request `ble`.
ble = ["hopspot-t-echo"]

[dependencies]
personal-rns = { path = "../../../personal-rns", default-features = false, features = ["embassy-host"] }
prns-interfaces-embassy = { path = "../../../personal-rns-interfaces/embassy", default-features = false, features = ["lora"] }
personal-hopspot-core = { path = "../../core", default-features = false }

embedded-graphics = "0.8"
epd-waveshare = { version = "0.6", default-features = false, features = ["graphics", "epd2in13_v3"] }
embedded-hal = "1.0"
embedded-hal-bus = { version = "0.3", features = ["async"] }

cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
panic-halt = "1.0"

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5" }
embassy-nrf = { version = "0.10", features = ["nrf52840", "time-driver-rtc1", "gpiote"] }
embassy-usb = { version = "0.6" }
embassy-futures = "0.1"
embassy-sync = "0.8"

static_cell = "2.1"
heapless = "0.8"

embedded-io-async = "0.6"

# Hopspot T-Echo profile. nrf-softdevice does not depend on embassy-nrf, so it rides alongside the
# T-Echo's embassy-nrf 0.10. The S140 v7 binding talks to the SoftDevice over SVCs.
# evt-max-size-512: our att_mtu is 247, so a single GATT write/notification event reaches ~258 bytes —
# past the 128-byte default and the 256 tier. Without this the SoftDevice's event read overflows and
# nrf-softdevice panics ("BLE_EVT_MAX_SIZE is too low") the instant a peer sends a full-MTU payload.
nrf-softdevice = { git = "https://github.com/embassy-rs/nrf-softdevice", features = ["nrf52840", "s140", "ble-central", "ble-peripheral", "ble-gatt-server", "ble-gatt-client", "ble-l2cap", "ble-l2cap-credit-workaround", "evt-max-size-512"], optional = true }
# nrf-softdevice's GATT characteristics use heapless 0.9; the rest of the firmware is on 0.8.
heapless09 = { package = "heapless", version = "0.9", optional = true }

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "thin"
opt-level = "s"
overflow-checks = false
