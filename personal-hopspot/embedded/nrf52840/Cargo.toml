[package]
name = "t-echo"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Personal Hopspot firmware for supported nRF52840 boards."

[workspace]
exclude = [
    "vendor/nrf-softdevice/nrf-softdevice",
    "vendor/nrf-softdevice/nrf-softdevice-macro",
    "vendor/nrf-softdevice/nrf-softdevice-s140-v6",
    "vendor/nrf-softdevice/nrf-softdevice-s140-v7",
]

[features]
default = ["board-t-echo", "softdevice-s140-v7"]
board-t-echo = ["personal-hopspot-core/display", "dep:embedded-graphics"]
board-t096 = ["personal-hopspot-core/display", "dep:embedded-graphics", "softdevice-s140-v6"]
board-t114 = ["personal-hopspot-core/display", "dep:embedded-graphics", "softdevice-s140-v6"]
board-t1000e = ["cortex-m/critical-section-single-core"]
board-mesh-tower-v2 = ["embassy-nrf/nfc-pins-as-gpio"]
softdevice-s140-v6 = ["dep:nrf-softdevice", "nrf-softdevice/s140-v6"]
softdevice-s140-v7 = ["dep:nrf-softdevice", "nrf-softdevice/s140-v7"]

[lib]
name = "personal_hopspot_nrf52840"
path = "src/lib.rs"

[[bin]]
name = "t-echo"
path = "src/main.rs"
required-features = ["board-t-echo"]

[[bin]]
name = "t096"
path = "src/bin/t096.rs"
required-features = ["board-t096"]

[[bin]]
name = "heltec-t114"
path = "src/bin/heltec_t114.rs"
required-features = ["board-t114"]

[[bin]]
name = "t1000e"
path = "src/bin/t1000e.rs"
required-features = ["board-t1000e"]

[[bin]]
name = "heltec-mesh-tower-v2"
path = "src/bin/heltec_mesh_tower_v2.rs"
required-features = ["board-mesh-tower-v2", "softdevice-s140-v6"]

[dependencies]
personal-rns = { path = "../../../personal-rns", default-features = false, features = ["embassy-host", "flash", "lora", "bluetooth-auto", "usb"] }
personal-hopspot-core = { path = "../../core", default-features = false, features = ["embedded"] }
prns-core = { path = "../../../prns-core", default-features = false }

embedded-graphics = { version = "0.8", optional = true }
embedded-hal = "1.0"
embedded-hal-async = "1.0"
embedded-hal-bus = { version = "0.3", features = ["async"] }

cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
panic-halt = "1.0"

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-embedded-hal = "0.6"
embassy-time = { version = "0.5" }
embassy-nrf = { version = "0.10", features = ["nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac"] }
embassy-usb = { version = "0.6" }
embassy-futures = "0.1"
embassy-sync = "0.8"

static_cell = "2.1"
heapless = "0.8"

embedded-io-async = "0.6"
# evt-max-size-512: our att_mtu is 247, so a single GATT write/notification event reaches ~258 bytes —
# past the 128-byte default and the 256 tier. Without this the SoftDevice's event read overflows and
# nrf-softdevice panics ("BLE_EVT_MAX_SIZE is too low") the instant a peer sends a full-MTU payload.
nrf-softdevice = { path = "vendor/nrf-softdevice/nrf-softdevice", optional = true, features = ["nrf52840", "ble-central", "ble-peripheral", "ble-gatt-server", "ble-gatt-client", "ble-l2cap", "ble-l2cap-credit-workaround", "evt-max-size-512", "critical-section-impl"] }
# nrf-softdevice's GATT characteristics use heapless 0.9; the rest of the firmware is on 0.8.
heapless09 = { package = "heapless", version = "0.9" }
rand_chacha = { version = "0.9", default-features = false }

[dev-dependencies]
epd-waveshare = { version = "0.6", default-features = false, features = ["graphics", "epd2in13_v3"] }

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[build-dependencies]
personal-hopspot-core = { path = "../../core", default-features = false }
