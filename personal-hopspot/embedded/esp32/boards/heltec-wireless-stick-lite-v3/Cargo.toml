[package]
name = "hopspot-heltec-wireless-stick-lite-v3"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Personal Hopspot firmware for the Heltec Wireless Stick Lite V3 (ESP32-S3FN8)"

[dependencies]
personal-hopspot-esp32 = { path = "../..", default-features = false, features = ["bluetooth-auto", "esp32s3fn8", "lora", "silent-logging", "usb"] }
embassy-executor = { version = "0.10", default-features = false }
esp-hal = { version = "1.1", features = ["esp32s3", "unstable"] }
esp-rtos = { version = "0.3.0", features = ["esp32s3", "embassy", "esp-radio"] }

[features]
default = []
