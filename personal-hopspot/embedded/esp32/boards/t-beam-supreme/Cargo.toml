[package]
name = "hopspot-t-beam-supreme"
version = "0.1.0"
edition = "2021"
publish = false
description = "Personal Hopspot firmware for the LilyGO T-Beam S3 Supreme"

[dependencies]
personal-hopspot-esp32 = { path = "../..", default-features = false, features = ["bluetooth-auto", "wifi-auto", "esp-now", "lora", "usb", "tcp"] }
embassy-executor = { version = "0.10", default-features = false }
esp-hal = { version = "1.1", features = ["esp32s3", "unstable"] }
esp-rtos = { version = "0.3.0", features = ["esp32s3", "embassy", "esp-radio"] }
