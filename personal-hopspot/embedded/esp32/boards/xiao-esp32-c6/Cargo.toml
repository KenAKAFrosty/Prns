[package]
name = "hopspot-xiao-esp32-c6"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Personal Hopspot firmware for the Seeed Studio XIAO ESP32-C6"

[dependencies]
personal-hopspot-esp32 = { path = "../..", default-features = false, features = ["bluetooth-auto", "esp-now", "jtag-logging", "usb"] }
embassy-executor = { version = "0.10", default-features = false }
esp-hal = { version = "1.1", features = ["esp32c6", "unstable"] }
esp-rtos = { version = "0.3.0", features = ["esp32c6", "embassy", "esp-radio"] }
