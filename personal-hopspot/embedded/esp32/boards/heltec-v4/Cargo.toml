[package]
name = "hopspot-heltec-v4"
version = "0.1.0"
edition = "2021"
publish = false
description = "Personal Hopspot firmware for the Heltec WiFi LoRa 32 V4"

[dependencies]
personal-hopspot-esp32 = { path = "../..", default-features = false, features = ["ble", "wifi-auto", "esp-now", "lora", "usb", "tcp"] }
embassy-executor = { version = "0.10", default-features = false }
esp-hal = { version = "1.1", features = ["esp32s3", "unstable"] }
esp-rtos = { version = "0.3.0", features = ["esp32s3", "embassy", "esp-radio"] }
