#   cargo heltec-v4        build the Heltec V4 (S3R2) firmware
#   cargo heltec-v4-flash  build + flash + monitor (board on USB)
#   cargo heltec-e290      / -flash   the Heltec Vision Master E290-HF
#   cargo heltec-v4-r8     / -flash   the Heltec V4-R8 (S3R8 / Octal PSRAM)
#   cargo tbeam-supreme    / -flash   the LilyGO T-Beam S3 Supreme
#   cargo c6               / -flash   the headless XIAO ESP32-C6

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor --after watchdog-reset"
rustflags = ["-C", "link-arg=-Tlinkall.x", "-C", "force-frame-pointers"]

[target.riscv32imac-unknown-none-elf]
runner = "espflash flash --monitor"
rustflags = ["-C", "link-arg=-Tlinkall.x"]

[env]
# esp-println's logger is off unless `ESP_LOG` is set at build time (init_logger_from_env reads it).
# Scope output to the firmware, engine, and interface backend so lifecycle lines
# (BLE link/L2CAP/PHY, auto-announce) print without trouble-host flooding USB-serial-JTAG.
ESP_LOG = "personal_hopspot_esp32=info,personal_rns=info,prns_interfaces_embassy=info"
# The dual-role BLE backend's central side subscribes to BOTH the peer's control and data
# characteristics, so trouble-host's GATT-client notification pubsub needs room for two subscribers
# (its default is 1). The queue depth follows so a control notification isn't dropped while a data
# fragment is in flight. esp-config reads these as `<CRATE>_<NAME>` at build time.
TROUBLE_HOST_GATT_CLIENT_NOTIFICATION_MAX_SUBSCRIBERS = "2"
TROUBLE_HOST_GATT_CLIENT_NOTIFICATION_QUEUE_SIZE = "2"
ESP_HAL_CONFIG_STACK_GUARD_OFFSET = "4096"

[alias]
heltec-e290 = "build --release -p hopspot-heltec-e290 --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc"
heltec-e290-flash = "run --release -p hopspot-heltec-e290 --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc"
heltec-v4 = "build --release -p hopspot-heltec-v4 --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc"
heltec-v4-flash = "run --release -p hopspot-heltec-v4 --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc"
heltec-v4-r8 = "build --release -p hopspot-heltec-v4-r8 --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc"
heltec-v4-r8-flash = "run --release -p hopspot-heltec-v4-r8 --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc"
tbeam-supreme = "build --release -p hopspot-t-beam-supreme --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc"
tbeam-supreme-flash = "run --release -p hopspot-t-beam-supreme --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc"
# Seeed XIAO ESP32-C6 Hopspot: USB-auto + ESP-NOW + BLE on the headless board. ESP-NOW uses
# Espressif's WiFi radio driver internally, but this build exposes no WiFi-LAN or SoftAP interface.
c6 = "build --release -p hopspot-xiao-esp32-c6 --target riscv32imac-unknown-none-elf -Zbuild-std=core,alloc"
c6-flash = "run --release -p hopspot-xiao-esp32-c6 --target riscv32imac-unknown-none-elf -Zbuild-std=core,alloc"
