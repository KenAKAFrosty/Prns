[package]
name = "personal-hopspot-ui"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shared Personal Hopspot status-screen renderer — one DrawTarget-generic draw path for the S3 OLED and the Linux debug window."

[dependencies]
# Snapshot types only (RuntimeSnapshot / InterfaceView / InterfaceId). These are
# ungated, so the renderer stays pure no_std with no runtime feature pulled in.
personal-rns = { path = "../../personal-rns", default-features = false }
# The drawing primitives; pinned to the same 0.8 the S3's ssd1306 stack uses.
embedded-graphics = "0.8"
# No-alloc line formatting + the card vector.
heapless = { version = "0.8", default-features = false }

[lints]
workspace = true
