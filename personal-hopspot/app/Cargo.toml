[package]
name = "personal-hopspot-app"
version = "0.1.0"
edition = "2021"
publish = false
description = "Personal Hopspot: one source, two targets (the Linux debug window and the Heltec S3 OLED firmware)."

[workspace]
resolver = "2"

[features]
default = []
fixture-identity = []

[[bin]]
name = "personal-hopspot-app"
path = "src/main.rs"

[dependencies]
personal-hopspot-ui = { path = "../ui", default-features = false }
embedded-graphics = "0.8"
heapless = { version = "0.8", default-features = false }


[target.'cfg(not(target_arch = "xtensa"))'.dependencies]
embedded-graphics-simulator = "0.8.0"
personal-rns = { path = "../../personal-rns", default-features = false, features = ["std-sync-host", "usb-auto", "wifi-lan-auto", "tcp"] }
# OS CSPRNG for the node identity (mirrors rnsd's load_identity_secret_key).
getrandom = "0.2"

[target.'cfg(target_arch = "xtensa")'.dependencies]
personal-rns = { path = "../../personal-rns", default-features = false, features = ["embassy-contract", "embassy-wifi"] }
esp-radio = { version = "0.18", default-features = false, features = ["esp32s3", "wifi", "unstable", "esp-alloc"] }
embassy-net = { version = "0.9.1", default-features = false, features = ["proto-ipv6", "medium-ethernet", "multicast", "udp"] }
static_cell = "2"
log = "0.4"
esp-hal = { version = "1.1", features = ["esp32s3", "unstable"] }
esp-backtrace = { version = "0.19", default-features = false, features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.17", default-features = false, features = ["esp32s3", "jtag-serial", "log-04"] }
esp-bootloader-esp-idf = { version = "0.5", features = ["esp32s3"] }
ssd1306 = "0.9"
esp-rtos = { version = "0.3.0", features = ["esp32s3", "embassy", "esp-radio"] }
esp-alloc = { version = "0.10.0", features = ["internal-heap-stats"] }
critical-section = "1"
embassy-executor = { version = "0.10", default-features = false }
embassy-time = { version = "0.5", default-features = false }
embassy-sync = { version = "0.8", default-features = false }
embassy-futures = { version = "0.1", default-features = false }

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false
