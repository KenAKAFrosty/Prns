[package]
name = "personal-hopspot-app"
version = "0.1.0"
edition = "2021"
publish = false
description = "Personal Hopspot: one source, two targets (the Linux debug window and the Heltec V4 OLED firmware)."

[workspace]
resolver = "2"

[features]
default = ["radio-wifi"]
# esp-radio's WiFi controller + the firmware's WiFi station/mesh stack. On by default (the production
# firmware). `ble-bringup` builds with `--no-default-features` to leave it OFF, keeping the radio
# BLE-only as a minimal isolated bring-up build (smaller, fewer moving parts while the native-BLE data
# plane is proven). This is a bring-up convenience, not a coexistence requirement: WiFi+BLE coex is
# supported, and the data-plane freezes once blamed on coex were a cross-core async-correctness bug.
radio-wifi = ["esp-radio/wifi", "esp-radio/esp-now"]
fixture-identity = []
# Diagnostics: a pre-frame boot line reporting the engine's static SRAM footprint and
# free heap, with a settle delay so a USB-serial-JTAG monitor catches it past re-enumeration.
footprint = []
# Replaces the normal Hopspot firmware with an on-device self-firehose: two engines on the
# PSRAM storage, hand-wired in-process, measuring pure engine throughput on the S3 silicon and
# printing a DEVICE_FIREHOSE line over the serial-JTAG log.
device-firehose = []
# Temporary native-BLE bring-up mode: pulls in trouble-host + esp-radio's BLE controller and brings
# the radio up as Bluetooth in isolation (WiFi off), proving the stack before WiFi+BLE coexistence.
# Off by default, so the production firmware is unchanged.
ble-bringup = ["dep:trouble-host", "dep:embassy-sync-07", "dep:heapless-09", "esp-radio/ble", "personal-rns/embassy-bluetooth"]
# WiFi + BLE coexistence: both radios live at once (esp-radio's coex arbiter time-shares the 2.4 GHz
# front-end) with WiFi and BLE as separate engine fleets. Pulls ble-bringup + radio-wifi together.
coex = ["ble-bringup", "radio-wifi", "esp-radio/coex"]
# Brings the AccessPoint role up. With WIFI creds configured this gives APSTA (the always-on "Hopspot"
# SoftAP alongside the home-network station); with no WIFI_SSID it is the off-grid AP-only measurement
# build. Part of the `full` production feature below.
softap = []
# THE production firmware: every radio + the SoftAP, in one feature. WiFi station + "Hopspot" SoftAP
# (APSTA), LoRa, and BLE all coexisting via the coex arbiter. This is what the field boards run — build
# with `cargo heltec-v4-flash` / `cargo tbeam-supreme-flash`. Don't hand-assemble coex/softap/radio-wifi
# piecemeal; that is how a board ends up missing BLE or its AP. The `-ble` aliases stay for isolated
# bring-up debugging only.
full = ["coex", "softap"]
# Build for the LilyGO T-Beam S3 Supreme instead of the Heltec V4. Same ESP32-S3 + SX1262 silicon,
# so the radio/WiFi/BLE/reactor stack is identical; this selects the board bring-up module
# (t_beam_supreme.rs) with the T-Beam pin map + AXP2101 PMU power-up. Orthogonal to the radio-set
# features (radio-wifi / ble-bringup / coex), which still apply.
board-tbeam-supreme = []
# AP-segment isolation test: gates LoRa + ESP-NOW off the engine routing so the only live data path is
# the WiFi-auto SoftAP. Pair with a bogus SSID (station never associates) + a no-coex build (no BLE) to
# prove AP-segment multicast in isolation. Not production.
ap-test = []
# Native-BLE bring-up for the C6 (riscv32): the mirror of `ble-bringup`, kept separate so it activates
# the riscv target's OPTIONAL BLE deps (trouble-host + esp-radio's esp32c6 controller) and switches
# esp-rtos onto the radio scheduler. The C6 is BLE-only — no WiFi, no coex.
ble-bringup-c6 = ["dep:trouble-host", "dep:embassy-sync-07", "dep:heapless-09", "esp-radio/ble", "esp-rtos/esp-radio", "personal-rns/embassy-bluetooth"]
# WiFi-auto for the C6 (riscv32): the esp-radio WiFi station controller + an embassy-net stack feeding
# the WiFi-LAN UDP auto interface. Like ble-bringup-c6 it switches on the optional radio deps (esp-radio
# wifi + embassy-net) and puts esp-rtos on the radio scheduler. Station-only for now — no SoftAP/ESP-NOW
# yet, just the LAN-auto pipe proving out on the chip. Credentials come from HOPSPOT_WIFI_SSID /
# HOPSPOT_WIFI_PASSWORD at build time (mirrors the S3).
wifi-bringup-c6 = ["esp-radio/wifi", "esp-radio/esp-now", "esp-rtos/esp-radio", "personal-rns/embassy-wifi", "personal-rns/embassy-espnow", "dep:embassy-net"]
# WiFi + BLE coexistence on the C6: both radios live at once under esp-radio's coex arbiter, each its own
# engine fleet on the one RISC-V core. The tight-fit target — a single 512 KB SRAM holds both radio
# stacks, both fleets, and the inline engine columns, with the main-task stack as the leftover.
coex-c6 = ["wifi-bringup-c6", "ble-bringup-c6", "esp-radio/coex"]

[[bin]]
name = "personal-hopspot-app"
path = "src/main.rs"

[dependencies]
personal-hopspot-ui = { path = "../ui", default-features = false }
embedded-graphics = "0.8"
heapless = { version = "0.8", default-features = false }


[target.'cfg(not(target_os = "none"))'.dependencies]
embedded-graphics-simulator = "0.8.0"
personal-rns = { path = "../../personal-rns", default-features = false, features = ["tokio-host", "wifi-lan-auto", "tcp", "local"] }
sdl2 = "0.38"
# OS CSPRNG for the node identity (mirrors rnsd's load_identity_secret_key).
getrandom = "0.2"
# The async runtime + async USB-serial transport the reactor's USB-auto host rides. serialport
# supplies the CDC enumeration (available_ports) the host's discovery scans; tokio-serial wraps
# each opened port as an async stream. Default features on for the udev/IOKit enumeration backend.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tokio-serial = { version = "5" }
serialport = { version = "4" }
# Opt-in diagnostics for the host backends' `log` traces (BLE lifecycle, etc.); idle unless RUST_LOG
# is set, so the default run prints nothing extra.
env_logger = "0.11"
tray-icon = { version = "0.21.3", default-features = false }

# Linux hot-plug: udev fires a uevent the instant a serial device is plugged, so the host
# rescans immediately instead of waiting on its fallback timer. tokio-udev exposes the monitor
# as an async event stream; tokio-stream gives it `.next()`. macOS leans on the fallback timer.
[target.'cfg(all(not(target_os = "none"), target_os = "linux"))'.dependencies]
gtk = "0.18"
personal-rns = { path = "../../personal-rns", default-features = false, features = ["bluetooth-bluer"] }
tokio-udev = "0.9"
tokio-stream = "0.1"

# Windows desktop: SDL2 has no system install path the linker finds by default, so instead of
# prebuilt dev libs + a LIB/PATH env + a shipped SDL2.dll, build SDL2 from source and fold it into
# the binary. `bundled` compiles it via CMake; `static-link` links it statically. Feature
# unification means embedded-graphics-simulator's sdl2 picks this up too — one self-contained exe.
# Version tracks the sdl2 e-g-simulator resolves. Build needs CMake + MSVC on PATH.
[target.'cfg(target_os = "windows")'.dependencies]
sdl2 = { version = "0.38", features = ["bundled", "static-link"] }
# Native WinRT backend for the BLE auto-interface (GATT-only). Like the macOS backend below, the
# unsafe/FFI surface lives in personal-rns-ffi, off the engine's forbid-unsafe surface.
personal-rns-ffi = { path = "../../personal-rns-ffi" }

# Native CoreBluetooth backend for the BLE auto-interface (the unsafe objc2 FFI lives in its own
# crate, off the engine's forbid-unsafe surface). macOS-only; on Linux the BlueR backend is reached
# through personal-rns itself.
[target.'cfg(target_os = "macos")'.dependencies]
personal-rns-ffi = { path = "../../personal-rns-ffi" }

[target.'cfg(target_arch = "xtensa")'.dependencies]
personal-rns = { path = "../../personal-rns", default-features = false, features = ["embassy-contract", "embassy-wifi", "embassy-lora", "embassy-espnow", "external-alloc"] }
allocator-api2 = { version = "0.3", default-features = false, features = ["alloc"] }
embedded-hal = "1"
embedded-hal-bus = { version = "0.3", features = ["async"] }
esp-radio = { version = "0.18", default-features = false, features = ["esp32s3", "unstable", "esp-alloc"] }
# Pure-Rust host BLE stack driving esp-radio's HCI BleConnector. 0.6.0 is the published release whose
# bt-hci 0.8 agrees with esp-radio 0.18. It depends on embassy-sync 0.7 and heapless 0.9 while the
# rest of the firmware is on 0.8; the GATT-server macro emits both, so ble.rs pins matching aliases
# below to feed trouble its own versions across the boundary. Optional, only under `ble-bringup`.
trouble-host = { version = "0.6.0", optional = true, default-features = false, features = ["central", "scan", "peripheral", "gatt", "derive", "default-packet-pool-mtu-255", "log"] }
embassy-sync-07 = { package = "embassy-sync", version = "0.7", default-features = false, optional = true }
heapless-09 = { package = "heapless", version = "0.9", default-features = false, optional = true }
embassy-net = { version = "0.9.1", default-features = false, features = ["proto-ipv4", "proto-ipv6", "dhcpv4", "medium-ethernet", "multicast", "tcp", "udp"] }
static_cell = "2"
portable-atomic = { version = "1", default-features = false }
log = "0.4"
esp-hal = { version = "1.1", features = ["esp32s3", "unstable"] }
esp-backtrace = { version = "0.19", default-features = false, features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.17", default-features = false, features = ["esp32s3", "jtag-serial", "log-04"] }
esp-bootloader-esp-idf = { version = "0.5", features = ["esp32s3"] }
ssd1306 = "0.9"
esp-rtos = { version = "0.3.0", features = ["esp32s3", "embassy", "esp-radio"] }
esp-alloc = { version = "0.10.0", features = ["internal-heap-stats"] }
critical-section = "1"
embassy-executor = { version = "0.10", default-features = false }
embassy-time = { version = "0.5", default-features = false }
embassy-sync = { version = "0.8", default-features = false }
embassy-futures = { version = "0.1", default-features = false }

# Seeed XIAO ESP32-C6 (riscv32, single-core, no PSRAM): the esp stack pinned to the esp32c6 chip, with
# no radio crate yet — first light is interface-free, and BLE rides esp-radio in a later step. Built
# --no-default-features so radio-wifi (the S3's WiFi/ESP-NOW feature set) stays off.
[target.'cfg(target_arch = "riscv32")'.dependencies]
personal-rns = { path = "../../personal-rns", default-features = false, features = ["embassy-contract"] }
esp-hal = { version = "1.1", features = ["esp32c6", "unstable"] }
esp-rtos = { version = "0.3.0", features = ["esp32c6", "embassy"] }
esp-alloc = { version = "0.10.0", features = ["internal-heap-stats"] }
esp-backtrace = { version = "0.19", default-features = false, features = ["esp32c6", "panic-handler", "println"] }
esp-println = { version = "0.17", default-features = false, features = ["esp32c6", "jtag-serial", "log-04"] }
esp-bootloader-esp-idf = { version = "0.5", features = ["esp32c6"] }
static_cell = "2"
portable-atomic = { version = "1", default-features = false }
log = "0.4"
critical-section = "1"
embassy-executor = { version = "0.10", default-features = false }
embassy-time = { version = "0.5", default-features = false }
embassy-sync = { version = "0.8", default-features = false }
embassy-futures = { version = "0.1", default-features = false }
trouble-host = { version = "0.6.0", optional = true, default-features = false, features = ["central", "scan", "peripheral", "gatt", "derive", "default-packet-pool-mtu-255", "log"] }
embassy-sync-07 = { package = "embassy-sync", version = "0.7", default-features = false, optional = true }
heapless-09 = { package = "heapless", version = "0.9", default-features = false, optional = true }
esp-radio = { version = "0.18", default-features = false, features = ["esp32c6", "unstable", "esp-alloc"], optional = true }
embassy-net = { version = "0.9.1", default-features = false, features = ["proto-ipv4", "proto-ipv6", "dhcpv4", "medium-ethernet", "multicast", "udp"], optional = true }

[build-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false
