# The `esp` toolchain ships host std + rust-src, so it builds both faces. build-std
# stays target-scoped (not global) so the host build isn't dragged into core/alloc.
#
#   cargo desktop          run the desktop window (host: Mac, Linux, or Windows)
#   cargo heltec-v4        build the Heltec V4 firmware
#   cargo heltec-v4-flash  build + flash + monitor (board on USB)

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor --after watchdog-reset"
rustflags = ["-C", "link-arg=-Tlinkall.x", "-C", "force-frame-pointers"]

# The desktop face dynamically links the system SDL2 (via embedded-graphics-simulator).
# Point the linker at Homebrew's prefix so `cargo desktop` finds it with no env var;
# the path simply doesn't exist on Linux/CI, so these are no-ops there.
[target.aarch64-apple-darwin]
rustflags = ["-L", "/opt/homebrew/lib"]
[target.x86_64-apple-darwin]
rustflags = ["-L", "/usr/local/lib"]

# Windows has no system SDL2 the linker finds, so the app's Cargo.toml builds SDL2 from source and
# links it statically (sdl2 `bundled` + `static-link`) — a self-contained exe, no dev libs, no env,
# no shipped DLL. The SDL2 source vendored by sdl2-sys declares an old `cmake_minimum_required`, and
# CMake 4.x dropped compatibility below 3.5; this override lets that old project configure anyway.
# Harmless on Mac/Linux, which dynamically link the system SDL2 and never run the bundled CMake.
# Build prereqs on Windows: CMake and the MSVC toolchain on PATH.
[env]
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
# esp-println's logger is off unless `ESP_LOG` is set at build time (init_logger_from_env reads it).
# Scope it to this crate so the firmware's own lifecycle lines (BLE link/L2CAP/PHY, auto-announce) print
# without pulling in trouble-host's verbose `log` feature, which would flood the USB-serial-JTAG.
ESP_LOG = "personal_hopspot_app=info,personal_rns=info"
# The dual-role BLE backend's central side subscribes to BOTH the peer's control and data
# characteristics, so trouble-host's GATT-client notification pubsub needs room for two subscribers
# (its default is 1). The queue depth follows so a control notification isn't dropped while a data
# fragment is in flight. esp-config reads these as `<CRATE>_<NAME>` at build time.
TROUBLE_HOST_GATT_CLIENT_NOTIFICATION_MAX_SUBSCRIBERS = "2"
TROUBLE_HOST_GATT_CLIENT_NOTIFICATION_QUEUE_SIZE = "2"
# The host packet pool is a static inside HostResources (default 16 packets × ~MTU ≈ 4 KiB of .bss).
# The core-0 main-task stack is the leftover at the top of dram_seg, so shrinking this static grows the
# stack 1:1 at no heap/core-1 cost — headroom the dual-role BLE path (the BT controller's deep
# r_btdm_task_post runs on this stack) needs. One connection at BLE rates is well served by 8 packets.
TROUBLE_HOST_DEFAULT_PACKET_POOL_SIZE = "8"

[alias]
desktop = "run"
# THE field firmware — one command per board. The `full` feature is the whole production radio set:
# WiFi station + always-on "Hopspot" SoftAP (APSTA), LoRa, and BLE, coexisting via esp-radio's coex
# arbiter. Fits at full MTU via the dram2_seg repartition (app/memory.x), the core1 stack sizing, and
# the D-cache heap reclaim. No more piecemeal coex/softap assembly — this is the only build you flash.
heltec-v4 = "build --release --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc --features full"
heltec-v4-flash = "run --release --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc --features full"
# LilyGO T-Beam S3 Supreme: same silicon, board-tbeam-supreme selects its pin map + AXP2101 PMU.
tbeam-supreme = "build --release --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc --features full,board-tbeam-supreme"
tbeam-supreme-flash = "run --release --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc --features full,board-tbeam-supreme"
# Isolated BLE bring-up (debugging ONLY): BLE radio alone, no WiFi/LoRa/SoftAP. Not a field build.
heltec-v4-ble = "build --release --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc --no-default-features --features ble-bringup"
heltec-v4-ble-flash = "run --release --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc --no-default-features --features ble-bringup"
tbeam-supreme-ble = "build --release --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc --no-default-features --features board-tbeam-supreme,ble-bringup"
tbeam-supreme-ble-flash = "run --release --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc --no-default-features --features board-tbeam-supreme,ble-bringup"
