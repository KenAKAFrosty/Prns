# The `esp` toolchain ships host std + rust-src, so it builds both faces. build-std
# stays target-scoped (not global) so the host build isn't dragged into core/alloc.
#
#   cargo desktop          run the desktop window (host: Mac, Linux, or Windows)
#   cargo heltec-v4        build the Heltec V4 firmware
#   cargo heltec-v4-flash  build + flash + monitor (board on USB)

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor --after watchdog-reset"
rustflags = ["-C", "link-arg=-Tlinkall.x", "-C", "force-frame-pointers"]

# The desktop face dynamically links the system SDL2 (via embedded-graphics-simulator).
# Point the linker at Homebrew's prefix so `cargo desktop` finds it with no env var;
# the path simply doesn't exist on Linux/CI, so these are no-ops there.
[target.aarch64-apple-darwin]
rustflags = ["-L", "/opt/homebrew/lib"]
[target.x86_64-apple-darwin]
rustflags = ["-L", "/usr/local/lib"]

# Windows has no system SDL2 the linker finds, so the app's Cargo.toml builds SDL2 from source and
# links it statically (sdl2 `bundled` + `static-link`) — a self-contained exe, no dev libs, no env,
# no shipped DLL. The SDL2 source vendored by sdl2-sys declares an old `cmake_minimum_required`, and
# CMake 4.x dropped compatibility below 3.5; this override lets that old project configure anyway.
# Harmless on Mac/Linux, which dynamically link the system SDL2 and never run the bundled CMake.
# Build prereqs on Windows: CMake and the MSVC toolchain on PATH.
[env]
CMAKE_POLICY_VERSION_MINIMUM = "3.5"

[alias]
desktop = "run"
heltec-v4 = "build --release --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc"
heltec-v4-flash = "run --release --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc"
# Bluetooth bring-up: BLE-only radio (no WiFi feature → no WiFi+BLE coex firmware). --no-default-features
# drops radio-wifi; ble-bringup pulls trouble-host + esp-radio's BLE controller.
heltec-v4-ble = "build --release --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc --no-default-features --features ble-bringup"
heltec-v4-ble-flash = "run --release --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc --no-default-features --features ble-bringup"
# Full WiFi + LoRa + BLE coexistence firmware: all three radios via esp-radio's coex arbiter. radio-wifi
# stays on (default, carries WiFi + LoRa), coex pulls in ble-bringup. Fits at full MTU via the dram2_seg
# repartition (app/memory.x), core1 stack sized to the reactor peak, and the D-cache heap reclaim.
heltec-v4-coex = "build --release --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc --features coex"
heltec-v4-coex-flash = "run --release --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc --features coex"
