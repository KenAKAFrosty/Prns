[package]
name = "personal-hopspot-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false
description = "Shared Personal Hopspot application state, canonical display face, and presentation policy."
build = "build.rs"

[features]
default = ["display", "remote-control-pairing"]
display = ["dep:embedded-graphics"]
embedded = ["personal-rns/embassy-host", "dep:embassy-sync"]
host = ["personal-rns/tokio-host"]
remote-control-pairing = []
source-archive = ["personal-rns/large-static-responses"]
compact-node-pages = []

[dependencies]
personal-rns = { path = "../../personal-rns", default-features = false, features = ["flash"] }
prns-core = { path = "../../prns-core", default-features = false }
prns-macros = { path = "../../prns-macros" }
embedded-storage = "0.3"
embedded-storage-async = "0.4"
embedded-graphics = { version = "0.8", optional = true } # pinned to the same 0.8 the S3's ssd1306 stack uses.
heapless = { version = "0.8", default-features = false }
embassy-sync = { version = "0.8", default-features = false, optional = true }
zeroize = { version = "1", default-features = false, features = ["derive"] }

[build-dependencies]
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
critical-section = { version = "1", features = ["std"] }

[lints]
workspace = true
