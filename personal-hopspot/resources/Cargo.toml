[package]
name = "personal-hopspot-resources"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false
description = "Embedded resource reporting and memory-contract tooling for Personal Hopspot."

[dependencies]
clap = { version = "4.5", features = ["derive"] }
object = { version = "0.39.1", default-features = false, features = ["elf", "read_core", "std"] }
personal-hopspot-builder = { path = "../builder" }
personal-hopspot-memory = { path = "../memory" }
prns-flash-manifest = { path = "../../prns-flash-manifest" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"

[lints]
workspace = true
