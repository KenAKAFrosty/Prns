[workspace]
members = ["core", "store", "store/redb", "service", "profiles/text", "transport/reticulum"]
exclude = ["security/mls-rs", "bindings/uniffi"]
default-members = ["core", "store", "store/redb", "service", "profiles/text", "transport/reticulum", "."]
resolver = "3"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KenAKAFrosty/Prns"
homepage = "https://reticulum.rs"
rust-version = "1.90"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
significant_drop_in_scrutinee = "warn"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(mutants)'] }

[package]
name = "prns-groups"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false
description = "Group enrollment, records, history and clients with optional networking"

[features]
default = ["text", "network"]
archive = []
uniffi-bindings = ["dep:uniffi", "prns-groups-core/uniffi-bindings", "prns-groups-service/uniffi-bindings", "prns-groups-store-redb/uniffi-bindings"]
text = ["dep:prns-group-text"]
network = ["prns-groups-reticulum/network", "dep:prns-host-runtime", "dep:prns-runtime", "dep:log", "dep:futures-util", "tokio/time", "tokio/macros"]
headless = ["text", "network", "dep:personal-rns", "tokio/rt-multi-thread"]

[[bin]]
name = "dev-group-peer"
path = "src/bin/dev-group-peer/main.rs"
required-features = ["headless"]

[[example]]
name = "telemetry"
required-features = ["network"]

[[test]]
name = "automatic_recovery"
required-features = ["text", "network"]

[[test]]
name = "capability_sync"
required-features = ["text", "network"]

[[test]]
name = "enrollment_network"
required-features = ["text", "network"]

[[test]]
name = "group_only_onboarding"
required-features = ["text", "network", "archive"]

[[test]]
name = "generic_records"
required-features = ["text"]

[[test]]
name = "headless_process"
required-features = ["headless"]

[[test]]
name = "lane_recovery"
required-features = ["text"]

[[test]]
name = "push_delivery"
required-features = ["text", "network"]

[[test]]
name = "retry_acceleration"
required-features = ["text", "network"]

[dependencies]
uniffi = { version = "=0.31.2", default-features = false, optional = true }
prns-group-text = { path = "profiles/text", optional = true }
prns-groups-core = { path = "core", features = ["serde"] }
prns-groups-service = { path = "service" }
prns-groups-store = { path = "store" }
prns-groups-store-redb = { path = "store/redb", features = ["serde"] }
prns-groups-mls = { path = "security/mls-rs" }
prns-groups-reticulum = { path = "transport/reticulum", default-features = false }
prns-host = { path = "../prns-host/core" }
prns-host-runtime = { path = "../prns-host/impls/runtime", optional = true }
prns-runtime = { path = "../prns-runtime/core", default-features = false, optional = true }
prns-storage = { path = "../prns-storage", features = ["redb"] }
log = { version = "0.4", default-features = false, optional = true }
personal-rns = { path = "../personal-rns", default-features = false, features = ["tokio-host", "tcp"], optional = true }
redb = "=4.2.0"
sha2 = { version = "0.10", default-features = false }
tokio = { version = "1", default-features = false, features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.2.17"
zeroize = "1"
futures-util = { version = "0.3", default-features = false, features = ["alloc", "std"], optional = true }

[dev-dependencies]
prns-contact-card = { path = "../prns-contact-card", features = ["prns-identity"] }
prns-groups-reticulum = { path = "transport/reticulum", default-features = false, features = ["contact-card"] }
futures-util = { version = "0.3", default-features = false, features = ["async-await", "std"] }
prns-host-runtime = { path = "../prns-host/impls/runtime" }
personal-rns = { path = "../personal-rns", default-features = false, features = ["tokio-host"] }
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }

[lints]
workspace = true
