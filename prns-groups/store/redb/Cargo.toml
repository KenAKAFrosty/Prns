[package]
name = "prns-groups-store-redb"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Caller-owned redb storage for transactional group services"
publish = false

[features]
default = []
serde = ["dep:serde"]
uniffi-bindings = ["dep:uniffi"]

[dependencies]
prns-groups-store = { path = ".." }
redb = "=4.2.0"
serde = { version = "1", features = ["derive"], optional = true }
uniffi = { version = "=0.31.2", default-features = false, optional = true }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
