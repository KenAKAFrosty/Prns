[package]
name = "prns-groups-uniffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
members = ["image"]
resolver = "3"

[lib]
crate-type = ["rlib"]

[dependencies]
prns-groups-core = { path = "../../core", features = ["uniffi-bindings"] }
prns-groups = { path = "../..", default-features = false, features = ["uniffi-bindings"] }
prns-identities-uniffi = { path = "../../../prns-identities/bindings/uniffi" }
prns-storage = { path = "../../../prns-storage" }
uniffi = { version = "=0.31.2", default-features = false }
thiserror = "2"
