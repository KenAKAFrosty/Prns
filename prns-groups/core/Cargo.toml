[package]
name = "prns-groups-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Allocation-free identifiers and capacity contracts for group synchronization"
publish = false

[features]
serde = ["dep:serde"]
uniffi-bindings = ["dep:uniffi"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
uniffi = { version = "=0.31.2", default-features = false, optional = true }

[lints]
workspace = true
