[package]
name = "prns-groups-mls"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false
description = "Bounded MLS operations with recoverable group transactions"
[workspace]
[dependencies]
prns-groups-core = { path = "../../core" }
prns-groups-store = { path = "../../store" }
mls-rs = { version = "=0.57.0", default-features = false, features = ["private_message", "prior_epoch", "out_of_order", "by_ref_proposal", "fast_serialize"] }
mls-rs-core = { version = "=0.27.0", default-features = false }
mls-rs-codec = { version = "=0.7.1", default-features = false }
mls-rs-crypto-rustcrypto = { version = "=0.23.0", default-features = false }
getrandom = { version = "0.4", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
spin = { version = "0.10", default-features = false, features = ["mutex", "spin_mutex"] }
[dev-dependencies]
embedded-storage = { version = "0.3.2", default-features = false }
prns-groups-store = { path = "../../store", features = ["secure"] }
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
